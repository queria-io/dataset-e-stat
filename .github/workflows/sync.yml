name: Apply

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 19 * * *" # 毎日 04:00 JST
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@main
    with:
      dataset_name: e_stat
      # 共通の既定 90 分では足りない。成功ランの実測は最大 210 分
      timeout_minutes: 300
      # dbt のスピル (migration_od_is_consistent で約 10GB、profiles.yml) と手元に置く新しいデータファイルの分を空ける
      free_disk: true
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      ESTAT_API_KEY: ${{ secrets.ESTAT_API_KEY }}

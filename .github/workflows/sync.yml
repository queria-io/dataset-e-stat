name: Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
  schedule:
    - cron: "0 19 * * *" # 毎日 04:00 JST
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@main
    with:
      dataset_name: e_stat
      # 共通の既定 90 分では足りない。成功ランの実測は最大 210 分
      timeout_minutes: 300
    secrets: inherit

e_stat:
  target: default
  outputs:
    default:
      type: duckdb
      path: ":memory:"
      database: e_stat
      schema: main
      threads: 1
      # DuckDB の既定はマシンのメモリの 80% まで使う。ubuntu-26.04 のランナーでは
      # migration_od_is_consistent (約 7,000 万行のビュー 2 つを自己結合する) の途中で
      # ランナーごと止まった。上限を置き、超えた分をディスクへスピルさせる
      # (:memory: の接続は temp_directory を指定しないとスピルできない。pipelines/__init__.py と同じ)
      settings:
        memory_limit: "{{ env_var('DUCKDB_MEMORY_LIMIT', '8GB') }}"
      # ビルドが公開ストレージを読むときの名乗り。shared/scripts/build-fdl.sh が
      # queria-build として渡す。無いと data.queria.io の利用統計に
      # 自分のビルドが利用者として混ざる。
      # settings: ではなく config_options: — custom_user_agent は接続を開く
      # ときにしか決められず、SET では変えられない
      # temp_directory も config_options: に置く。settings: はカーソルを開くたびに SET し直すが、
      # DuckDB は一度スピルに使った temp_directory を SET し直すと
      # 「Cannot switch temporary directory after the current one has been used」で止まる
      config_options:
        custom_user_agent: "{{ env_var('QUERIA_USER_AGENT', '') }}"
        temp_directory: "{{ env_var('TMPDIR', '/tmp') }}/duckdb-estat-dbt"
      extensions:
        - httpfs
        - ducklake
        - spatial
        - sqlite
      # fdl checkout が作った作業場のカタログ (SQLite) に書く。新しいデータファイルは
      # FDL_DATA_PATH に書き、fdl commit が新しいバージョンにする (shared/scripts/build-fdl.sh)
      attach:
        - path: "ducklake:{{ env_var('FDL_WORKING') }}"
          alias: e_stat
          is_ducklake: true
          options:
            DATA_PATH: "{{ env_var('FDL_DATA_PATH') }}"
            OVERRIDE_DATA_PATH: true
            META_TYPE: "'sqlite'"
            # 既定のままだと小さいテーブルがカタログの中に収まり parquet が
            # 1 つも生成されない。fdl commit はインライン化された行を断るので、常に切る
            DATA_INLINING_ROW_LIMIT: 0

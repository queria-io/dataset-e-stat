  # 家計調査 家計収支編 二人以上の世帯（品目分類 2025年改定）
  # 2025年改定の表は 1985年1月まで遡って組み替えられているので、旧改定（平成17/22/27年・
  # 2020年）の表を併せて取る必要はない。月次表と年次表で時間軸コードが衝突しないため、
  # 同じスキーマに積んで frequency で分けている。
  - name: household_expenditure_monthly
    description: 家計調査 品目別支出金額（月次・全国および都道府県庁所在市等53地域）
    statsDataId: "0004023601"
    merge_keys: [tab, cat01, cat02, area, time]
    incremental: true
  - name: household_expenditure_annual
    description: 家計調査 品目別支出金額（年次・全国および都道府県庁所在市等53地域）
    statsDataId: "0004023605"
    merge_keys: [tab, cat01, cat02, area, time]
    incremental: true
  # 数量は月次が全国のみで、都道府県庁所在市別は年次にしか無い。
  - name: household_quantity_monthly
    description: 家計調査 品目別購入数量（月次・全国のみ）
    statsDataId: "0004023602"
    merge_keys: [tab, cat01, cat02, area, time]
    incremental: true
  - name: household_quantity_annual
    description: 家計調査 品目別購入数量（年次・全国および都道府県庁所在市等53地域）
    statsDataId: "0004023606"
    merge_keys: [tab, cat01, cat02, area, time]
    incremental: true

  # 労働力調査 基本集計
  # 全国は月次（1968年1月～）、地域ブロック別は四半期（2000年1-3月期～）で表が分かれる。
  # 時間軸コードは月次が YYYY00MMMM、四半期が YYYY00MMMM（期首月・期末月）で
  # 衝突しないため、同じスキーマに積んで frequency で分けている。
  # 実数（万人）と率（％）は別表なので、mart も別にする。
  - name: labor_force_monthly
    description: 労働力調査 基本集計 就業状態，年齢階級別15歳以上人口（全国・月次）
    statsDataId: "0002060002"
    merge_keys: [tab, cat01, cat02, cat03, cat04, area, time]
    incremental: true
  - name: labor_force_rate_monthly
    description: 労働力調査 基本集計 年齢階級別労働力人口比率，就業率及び完全失業率（全国・月次）
    statsDataId: "0002060004"
    merge_keys: [tab, cat01, cat02, cat03, cat04, area, time]
    incremental: true
  # 地域ブロック別は cat の並びが全国表と違う（cat01=性別・cat02=年齢階級）。
  # 産業の軸を持たないので merge キーも1つ少ない。
  - name: labor_force_regional_quarterly
    description: 労働力調査 基本集計 就業状態，年齢階級別15歳以上人口（地域別・四半期）
    statsDataId: "0003009572"
    merge_keys: [tab, cat01, cat02, cat03, area, time]
    incremental: true
  - name: labor_force_rate_regional_quarterly
    description: 労働力調査 基本集計 年齢階級別労働力人口比率，就業率及び完全失業率（地域別・四半期）
    statsDataId: "0003009576"
    merge_keys: [tab, cat01, cat02, cat03, area, time]
    incremental: true

  # 住民基本台帳人口移動報告 市区町村別の転入・転出（年次）
  # 2020年以降は表章項目に転入・転出・転入超過の3つが同居する1表、2019年以前は
  # 表章項目ごとに3表へ分かれる。分類軸の並びも era で違う（2020年以降は
  # cat01=年齢・cat02=性別・cat03=国籍、2019年以前は cat01=性別・cat02=国籍・
  # cat03=年齢）ので、積むのは stg で列を明示して行う。
  # 年齢は総数だけを取る。年齢区分が era で違い（2019年以前は3区分、2020年以降は
  # 5歳階級）、同じ列に積むと区分の意味が年で変わる。区分を取るなら 5歳階級の表が
  # 2014年以降にあるので、そちらを別テーブルとして足す。
  - name: migration_municipality
    description: 住民基本台帳人口移動報告 市区町村別 転入者数・転出者数・転入超過数（2020年～）
    statsDataId: "0003419945"
    merge_keys: [tab, cat01, cat02, cat03, area, time]
    incremental: true
    api_params:
      cdCat01: "000"
  - name: migration_municipality_inflow_pre2020
    description: 住民基本台帳人口移動報告 市区町村別 他市区町村からの転入者数（2010年～2019年）
    statsDataId: "0003461887"
    merge_keys: [tab, cat01, cat02, cat03, area, time]
    incremental: true
    api_params:
      cdCat03: "000"
  - name: migration_municipality_outflow_pre2020
    description: 住民基本台帳人口移動報告 市区町村別 他市区町村への転出者数（2010年～2019年）
    statsDataId: "0003461888"
    merge_keys: [tab, cat01, cat02, cat03, area, time]
    incremental: true
    api_params:
      cdCat03: "000"
  - name: migration_municipality_net_pre2020
    description: 住民基本台帳人口移動報告 市区町村別 転入超過数（2010年～2019年）
    statsDataId: "0003461889"
    merge_keys: [tab, cat01, cat02, cat03, area, time]
    incremental: true
    api_params:
      cdCat03: "000"

  # 小売物価統計調査（動向編） 調査品目の年平均価格
  # 品目別の「円」そのものを市別に持つ唯一の表。cpi.price_index は地域ごとに
  # 2020年=100 に揃えた指数なので、地域間の水準比較には使えない。
  # 地域コードが 5 桁の標準地域コードなので、code.municipality と直接つながる。
  # 月別の表（0003421913）は1,480万行あり、年平均だけでは足りない用途が出てから足す。
  - name: retail_price_annual
    description: 小売物価統計調査（動向編） 調査品目の年平均価格（都道府県庁所在市及び人口15万以上の市）
    statsDataId: "0003420453"
    merge_keys: [tab, cat01, cat02, area, time]
    incremental: true

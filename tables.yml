  # 労働力調査 基本集計
  # 全国は月次（1968年1月～）、地域ブロック別は四半期（2000年1-3月期～）で表が分かれる。
  # 時間軸コードは月次が YYYY00MMMM、四半期が YYYY00MMMM（期首月・期末月）で
  # 衝突しないため、同じスキーマに積んで frequency で分けている。
  # 実数（万人）と率（％）は別表なので、mart も別にする。
  - name: labor_force_monthly
    description: 労働力調査 基本集計 就業状態，年齢階級別15歳以上人口（全国・月次）
    statsDataId: "0002060002"
    merge_keys: [tab, cat01, cat02, cat03, cat04, area, time]
    incremental: true
  - name: labor_force_rate_monthly
    description: 労働力調査 基本集計 年齢階級別労働力人口比率，就業率及び完全失業率（全国・月次）
    statsDataId: "0002060004"
    merge_keys: [tab, cat01, cat02, cat03, cat04, area, time]
    incremental: true
  # 地域ブロック別は cat の並びが全国表と違う（cat01=性別・cat02=年齢階級）。
  # 産業の軸を持たないので merge キーも1つ少ない。
  - name: labor_force_regional_quarterly
    description: 労働力調査 基本集計 就業状態，年齢階級別15歳以上人口（地域別・四半期）
    statsDataId: "0003009572"
    merge_keys: [tab, cat01, cat02, cat03, area, time]
    incremental: true
  - name: labor_force_rate_regional_quarterly
    description: 労働力調査 基本集計 年齢階級別労働力人口比率，就業率及び完全失業率（地域別・四半期）
    statsDataId: "0003009576"
    merge_keys: [tab, cat01, cat02, cat03, area, time]
    incremental: true

  # 住民基本台帳人口移動報告 市区町村別の転入・転出（年次）
  # 2020年以降は表章項目に転入・転出・転入超過の3つが同居する1表、2019年以前は
  # 表章項目ごとに3表へ分かれる。分類軸の並びも era で違う（2020年以降は
  # cat01=年齢・cat02=性別・cat03=国籍、2019年以前は cat01=性別・cat02=国籍・
  # cat03=年齢）ので、積むのは stg で列を明示して行う。
  # ここでは年齢を総数だけに絞る。年齢区分は 2010〜2013年が3区分しか無いので、
  # 年齢5歳階級の内訳は2014年からの表を下の migration_municipality_age* で別に取る。
  - name: migration_municipality
    description: 住民基本台帳人口移動報告 市区町村別 転入者数・転出者数・転入超過数（2020年～）
    statsDataId: "0003419945"
    merge_keys: [tab, cat01, cat02, cat03, area, time]
    incremental: true
    api_params:
      cdCat01: "000"
  - name: migration_municipality_inflow_pre2020
    description: 住民基本台帳人口移動報告 市区町村別 他市区町村からの転入者数（2010年～2019年）
    statsDataId: "0003461887"
    merge_keys: [tab, cat01, cat02, cat03, area, time]
    incremental: true
    api_params:
      cdCat03: "000"
  - name: migration_municipality_outflow_pre2020
    description: 住民基本台帳人口移動報告 市区町村別 他市区町村への転出者数（2010年～2019年）
    statsDataId: "0003461888"
    merge_keys: [tab, cat01, cat02, cat03, area, time]
    incremental: true
    api_params:
      cdCat03: "000"
  - name: migration_municipality_net_pre2020
    description: 住民基本台帳人口移動報告 市区町村別 転入超過数（2010年～2019年）
    statsDataId: "0003461889"
    merge_keys: [tab, cat01, cat02, cat03, area, time]
    incremental: true
    api_params:
      cdCat03: "000"

  # 2020年以降の表は総数（000）と3区分の合計（301 / 302 / 401）も同じ軸に持つが、
  # 2019年以前の表には無いので、両方にある5歳階級（0～4歳 … 85～89歳、90歳以上）だけを取る。
  # 2020年以降の表は上の migration_municipality と同じ統計表だが、あちらは年齢を総数に絞って
  # 増分取得しているので、絞りを外すと過去の年が取り直されない。別のテーブルとして取る。
  - name: migration_municipality_age
    description: 住民基本台帳人口移動報告 市区町村別 年齢5歳階級別 転入者数・転出者数・転入超過数（2020年～）
    statsDataId: "0003419945"
    merge_keys: [tab, cat01, cat02, cat03, area, time]
    incremental: true
    api_params:
      cdTab: "21,22,04"
      cdCat01: "201,202,203,204,205,206,207,208,209,210,211,212,213,214,215,216,217,218,402"
  - name: migration_municipality_age_inflow_pre2020
    description: 住民基本台帳人口移動報告 市区町村別 年齢5歳階級別 他市区町村からの転入者数（2014年～2019年）
    statsDataId: "0003461890"
    merge_keys: [tab, cat01, cat02, cat03, area, time]
    incremental: true
    api_params:
      cdTab: "11"
      cdCat03: "201,202,203,204,205,206,207,208,209,210,211,212,213,214,215,216,217,218,402"
  - name: migration_municipality_age_outflow_pre2020
    description: 住民基本台帳人口移動報告 市区町村別 年齢5歳階級別 他市区町村への転出者数（2014年～2019年）
    statsDataId: "0003461891"
    merge_keys: [tab, cat01, cat02, cat03, area, time]
    incremental: true
    api_params:
      cdCat03: "201,202,203,204,205,206,207,208,209,210,211,212,213,214,215,216,217,218,402"
  - name: migration_municipality_age_net_pre2020
    description: 住民基本台帳人口移動報告 市区町村別 年齢5歳階級別 転入超過数（2014年～2019年）
    statsDataId: "0003461892"
    merge_keys: [tab, cat01, cat02, cat03, area, time]
    incremental: true
    api_params:
      cdCat03: "201,202,203,204,205,206,207,208,209,210,211,212,213,214,215,216,217,218,402"

  # 建築着工統計調査（建築物着工統計） 市区町村別・用途別（大分類）の建築物の数・床面積
  # 2019年までと2020年以降で統計表が分かれる。2020年以降の表は工事費予定額を持たない。
  # 地域軸には市区町村のほかに郡・振興局・支庁と特別区部の集計行が入るが、2020〜2023年の
  # 集計行は値が入っていない（0）ので stg で落とす。
  - name: building_starts_municipality_use
    description: 建築着工統計調査 建築物着工統計 市区町村別、用途別（大分類）／建築物の数、床面積（2020年以降）
    statsDataId: "0004019181"
    merge_keys: [tab, cat01, area, time]
    incremental: true
  - name: building_starts_municipality_use_pre2020
    description: 建築着工統計調査 建築物着工統計 市区町村別、用途別（大分類）／建築物の数、床面積、工事費予定額（2011年～2019年）
    statsDataId: "0003114492"
    merge_keys: [tab, cat01, area, time]
    incremental: true

  # 建設総合統計 月別《地域別》出来高（都道府県・地方別、月次）
  # 毎年6月に過去3年分の月次の値が補正率で遡及改定される（訂正時はさらに遡る）ので、
  # incremental にせず毎回全量を取り直して置き換える（merge_keys を持たないので replace）。
  # 全量でも1万行ほど。対前年同期比（tab=130）は地方の行にしか無いので取らない。
  - name: construction_prefecture_monthly
    description: 建設総合統計 月別《地域別》出来高
    statsDataId: "0003458459"
    api_params:
      cdTab: "100"

  # 小売物価統計調査（動向編） 調査品目の年平均価格
  # 品目別の「円」そのものを市別に持つ唯一の表。cpi.price_index は地域ごとに
  # 2020年=100 に揃えた指数なので、地域間の水準比較には使えない。
  # 地域コードが 5 桁の標準地域コードなので、code.municipality と直接つながる。
  # 月別の表（0003421913）は1,480万行あり、年平均だけでは足りない用途が出てから足す。
  - name: retail_price_annual
    description: 小売物価統計調査（動向編） 調査品目の年平均価格（都道府県庁所在市及び人口15万以上の市）
    statsDataId: "0003420453"
    merge_keys: [tab, cat01, cat02, area, time]
    incremental: true

  # 就業構造基本調査 就業状態・従業上の地位・雇用形態別の15歳以上人口（第7-1表）
  # 5年ごとの調査で、調査年ごとに統計表が別になる。2017年は都道府県編（全国・都道府県と
  # その市部・政令指定都市）、2022年は地域編（全国・都道府県・政令指定都市・県庁所在都市・
  # 人口30万以上の市）で地域の並びが違うが、分類軸の並びとコードは同じなので stg で積む。
  # 次の調査（2027年）の表は statsDataId を足して取る。
  - name: employment_structure_status_2017
    description: 就業構造基本調査 男女，配偶関係，教育，就業状態・仕事の主従・従業上の地位・雇用形態，年齢別人口（2017年・都道府県編）
    statsDataId: "0003222786"
    merge_keys: [tab, cat01, cat02, cat03, cat04, cat05, area, time]
    incremental: true
  - name: employment_structure_status_2022
    description: 就業構造基本調査 男女、配偶関係、教育、就業状態・仕事の主従・従業上の地位・雇用形態、年齢別人口（2022年・地域編）
    statsDataId: "0004008431"
    merge_keys: [tab, cat01, cat02, cat03, cat04, cat05, area, time]
    incremental: true

  # 民間給与実態統計調査 全国計表 第9表 業種別及び給与階級別の給与所得者数・給与額
  # 2008年からの同名の表（0003045946）は別系列で、重なる年でも値が一致しないので取らない。
  # 地域の軸が無い表なので merge キーに area を含めない。
  - name: private_salary_industry
    description: 民間給与実態統計調査 業種別及び給与階級別の給与所得者数・給与額（1年を通じて勤務した給与所得者・2014年～）
    statsDataId: "0004009620"
    merge_keys: [tab, cat01, cat02, cat03, time]
    incremental: true

  # 令和5年住宅・土地統計調査 世帯の年間収入階級(10区分)・住宅の所有の関係(5区分)別主世帯数。
  # 市区町村の表は全市と人口1.5万人以上の町村などだけで、全町村は載らない。
  - name: housing_survey_income_tenure
    description: 住宅・土地統計調査 世帯の年間収入階級・住宅の所有の関係別主世帯数（全国・都道府県・市区町村、2023年）
    statsDataId: "0004021668"
    merge_keys: [tab, cat01, cat02, area, time]
    incremental: true
    # 表章項目は主世帯数 (13-2023) だけを使う。1世帯当たり人員などは取らない。
    api_params:
      cdTab: "13-2023"

  # 2019年全国家計構造調査 家計総合集計 1世帯当たり1か月間の収入と支出（第1-21-1表）。
  # 全国だけの表で、tab=表章項目、cat01=世帯の種類、cat02=世帯区分、cat03=世帯主の性別、
  # cat04=収支項目（細分類406区分）、cat05=年間収入階級（平均・40区分・再掲3区分の44区分）。
  # 年間収入階級ごとの消費支出を、小地域の世帯の年収分布に掛けて消費支出を推計するために取る。
  # 世帯の種類は総世帯、世帯区分は全世帯、世帯主の性別は平均に絞る。収支項目は消費支出と
  # 10大費目、および表章項目の付帯値（集計世帯数・世帯数分布・世帯人員など）が載る 0 総数と
  # 1 平均だけを取る。分位の境界値（15-2019）は年間収入階級の表ではすべて「-」なので取らない。
  # 全セルを取ると65万セルあり、この絞りで792セルになる。
  - name: household_structure_income_class
    description: 全国家計構造調査 年間収入階級別 1世帯当たり1か月間の消費支出（総世帯・全国、2019年）
    statsDataId: "0003424577"
    merge_keys: [tab, cat01, cat02, cat03, cat04, cat05, area, time]
    incremental: true
    api_params:
      cdTab: "01-2019,06-2019,07-2019,08-2019,09-2019,10-2019,11-2019,12-2019"
      cdCat01: "0"
      cdCat02: "0"
      cdCat03: "0"
      cdCat04: "0,1,2101,210101,210102,210103,210104,210105,210106,210107,210108,210109,210110"

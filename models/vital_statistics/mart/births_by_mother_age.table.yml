schema: vital_statistics
name: births_by_mother_age
title: 市区町村別 母の年齢（5歳階級）別の出生数（人口動態統計）
description: |-
  人口動態調査 人口動態統計（確定数）から、全国・都道府県・市区町村ごとの出生数を、
  母の年齢（14歳以下・15〜19歳 … 45〜49歳・50歳以上・不詳の10区分）別、子の性別に
  収録する。収録は2015〜2024年、194,280行。年 × 地域 × 母の年齢で1行。
  10区分を足すとその地域・年の出生数になり、vital_events の births に一致する。
  原典の年齢の総数の行は二重に数えないよう持たない。
  地域は全国・都道府県・市町村と特別区・政令指定都市の区と、住所が外国・不詳の行が同じ表に
  並ぶ。日本全域をちょうど1回覆うのは area_kind = 'prefecture' か
  area_kind IN ('municipality', 'ward') のいずれかで、絞らずに合計すると何重にも数える。
  政令指定都市そのものの行は無いので、市でまとめるときは code.municipality の
  municipality_code で区を束ねる（市の値は vital_events にもある）。
  area_code は code.municipality の area_code と同じ標準地域コード（5桁）で、各年のコードの
  まま入る。全国地方公共団体コード（6桁）とは別体系。
  原典の「-」（計数のない場合）は0にしてある。秘匿は無い。
  出典: 厚生労働省 人口動態調査 人口動態統計 確定数「出生数，都道府県・市区町村・性・
  母の年齢（５歳階級）別」（統計表 0003412062）。https://www.e-stat.go.jp/statistics/00450011
keywords:
  - e-stat
  - 人口動態調査
  - 人口動態統計
  - 市区町村
  - 出生数
  - 母の年齢
  - 出産年齢
published: true
themes: [population]
temporal_coverage: { start: "2015", end: "2024" }
sources:
  - path: https://www.e-stat.go.jp/statistics/00450011
fields:
  - name: year
    title: 年
    description: 事象の起きた年（1月〜12月）。2015〜2024年
  - name: area_code
    title: 標準地域コード（5桁）
    description: 標準地域コード。全国は 00000、住所が外国は 51000、不詳は 52000、都道府県は 13000 のように市区町村部が 000。code.municipality の area_code と同じ体系で、各年のコードのまま入る。全国地方公共団体コード（6桁）とは別体系
    semantic: { role: entity, name: city }
  - name: area_name
    title: 地域名
    description: 地域の名称（全国／外国／不詳／東京都／新宿区／札幌市中央区 など）
  - name: area_kind
    title: 地域の粒度
    description: 'nationwide=全国、foreign=住所が外国、unknown=住所が不詳、prefecture=都道府県、municipality=政令指定都市以外の市町村と東京都の特別区、ward=政令指定都市の区。政令指定都市そのものの行は無い。日本全域をちょうど1回覆うのは prefecture だけ、または municipality と ward の組だけ。nationwide は prefecture・foreign・unknown の和'
  - name: prefecture_code
    title: 都道府県コード
    description: area_code の上2桁。全国・外国・不詳は NULL
    semantic: { role: entity, name: prefecture }
  - name: mother_age_code
    title: 母の年齢区分のコード
    description: 原典の母の年齢区分のコード。00190=14歳以下 … 00310=50歳以上、00450=不詳
  - name: mother_age_class
    title: 母の年齢区分
    description: mother_age_code に対応する区分名（14歳以下／15～19歳／50歳以上／不詳）
  - name: mother_age_from
    title: 母の年齢の下限
    description: 区分の下限の年齢（歳）。14歳以下と不詳は NULL
  - name: mother_age_to
    title: 母の年齢の上限
    description: 区分の上限の年齢（歳）。50歳以上と不詳は NULL
  - name: births
    title: 出生数
    description: 出生数（人）。births_male と births_female の和
  - name: births_male
    title: 出生数（男）
    description: 男の子の出生数（人）
  - name: births_female
    title: 出生数（女）
    description: 女の子の出生数（人）

schema: vital_statistics
name: vital_events
title: 市区町村別 出生・死亡・死産・婚姻・離婚の数（人口動態統計）
description: |-
  人口動態調査 人口動態統計（確定数）の人口動態総覧から、都道府県・市区町村ごとの
  出生数・低体重児の出生数・死亡数・乳児死亡数・新生児死亡数・早期新生児死亡数・
  自然死産数・人工死産数・妊娠満22週以後の死産数・周産期死亡数・婚姻件数・離婚件数を
  年1行にまとめた表。収録は2015〜2024年、19,628行。日本における日本人の事象を、
  住所地（出生は子の住所、死亡は死亡者の住所）で数える。
  地域は都道府県・政令指定都市・市町村と特別区・政令指定都市の区が同じ表に並ぶ。
  日本全域をちょうど1回覆うのは area_kind = 'prefecture' か
  area_kind IN ('municipality', 'designated_city') のいずれかで、ward は designated_city の
  内訳なので一緒に足すと二重に数える。全国の値は都道府県を足す（住所が外国・不詳の分は
  含まない）。原典の市部・郡部などの集計行は持たない。
  area_code は code.municipality の area_code と同じ標準地域コード（5桁）で、各年のコードの
  まま入る（富谷市は2015年が富谷町 04423、2016年から 04216。那珂川市は2018年から 40231。
  浜松市の区は2024年に再編されて 22138〜22140 になる）。原典の政令指定都市の行は独自の
  コード（札幌市 01010 など）なので、標準地域コード（札幌市 01100）に直してある。
  全国地方公共団体コード（6桁）とは別体系。
  原典の「-」（計数のない場合）は0にしてある。秘匿は無い。
  社会・人口統計体系（ssds）の市区町村の表にも出生数・死亡数・婚姻件数・離婚件数があるが
  2023年までで、乳児死亡・新生児死亡・死産・周産期死亡・低体重児の出生は無い。
  住民基本台帳の出生・死亡（resident_registry）は日本人に限らない届出の数で、この表とは
  数え方が違う。
  出典: 厚生労働省 人口動態調査 人口動態統計 確定数「人口動態総覧（件数），都道府県・
  市部－郡部－保健所－市区町村別」（統計表 0003411564）。https://www.e-stat.go.jp/statistics/00450011
keywords:
  - e-stat
  - 人口動態調査
  - 人口動態統計
  - 市区町村
  - 出生数
  - 死亡数
  - 乳児死亡
  - 死産
  - 婚姻
  - 離婚
published: true
themes: [population]
temporal_coverage: { start: "2015", end: "2024" }
sources:
  - path: https://www.e-stat.go.jp/statistics/00450011
fields:
  - name: year
    title: 年
    description: 事象の起きた年（1月〜12月）。2015〜2024年
  - name: area_code
    title: 標準地域コード（5桁）
    description: 標準地域コード。都道府県は 13000 のように市区町村部が 000。code.municipality の area_code と同じ体系で、各年のコードのまま入る。全国地方公共団体コード（6桁）とは別体系
    semantic: { role: entity, name: city }
  - name: area_name
    title: 地域名
    description: 地域の名称（東京都／新宿区／札幌市／札幌市中央区 など）
  - name: area_kind
    title: 地域の粒度
    description: 'prefecture=都道府県、designated_city=政令指定都市、municipality=政令指定都市以外の市町村と東京都の特別区、ward=政令指定都市の区。日本全域をちょうど1回覆うのは prefecture だけ、または municipality と designated_city の組だけ。ward は designated_city の内訳'
  - name: prefecture_code
    title: 都道府県コード
    description: area_code の上2桁
    semantic: { role: entity, name: prefecture }
  - name: births
    title: 出生数
    description: 出生数（人）
  - name: low_birth_weight_births
    title: 低体重児の出生数
    description: 出生時の体重が2,500g未満の出生数（人）。births の内数
  - name: deaths
    title: 死亡数
    description: 死亡数（人）
  - name: infant_deaths
    title: 乳児死亡数
    description: 生後1年未満の死亡数（人）。deaths の内数
  - name: neonatal_deaths
    title: 新生児死亡数
    description: 生後4週未満の死亡数（人）。infant_deaths の内数
  - name: early_neonatal_deaths
    title: 早期新生児死亡数
    description: 生後1週未満の死亡数（人）。neonatal_deaths の内数
  - name: spontaneous_fetal_deaths
    title: 自然死産数
    description: 妊娠満12週以後の自然死産の数（胎）
  - name: induced_fetal_deaths
    title: 人工死産数
    description: 妊娠満12週以後の人工死産の数（胎）。spontaneous_fetal_deaths との和が死産数
  - name: late_fetal_deaths
    title: 妊娠満22週以後の死産数
    description: 妊娠満22週以後の死産の数（胎）。死産数の内数
  - name: perinatal_deaths
    title: 周産期死亡数
    description: late_fetal_deaths と early_neonatal_deaths の和
  - name: marriages
    title: 婚姻件数
    description: 婚姻件数（組）。夫の住所で数える
  - name: divorces
    title: 離婚件数
    description: 離婚件数（組）。別居する前の住所で数える

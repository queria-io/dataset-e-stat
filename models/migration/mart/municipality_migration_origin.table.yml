schema: migration
name: municipality_migration_origin
title: 市区町村別 転入元別の転入者数（住民基本台帳人口移動報告）
description: |-
  現住地（転入先）ごとに、転入元の都道府県・市区町村・区別の転入者数を、年齢10歳階級・男女別に2012年から年次で持つテーブルです。

  - 前住地は、その年の移動者の総数が10人以上の地域だけが個別の行になり、残りは「その他の県」「その他の市町村」「その他の区」にまとまります
  - 総数・都道府県・市区町村・区が同じ列に並ぶので、origin_level で絞ってから合計してください
  - 2017年以前は日本人移動者、2018年以降は外国人を含む移動者です

  移動前の住所地別転入者数（転入元別）。
  住民基本台帳人口移動報告の参考表から、市区町村の間の移動者数を、年齢10歳階級・男女別に
  2012年から年次で持つ。住民票の異動届にもとづく実績で、推計ではない。
  表の主の地域（現住地）は都道府県・市区町村・政令指定都市の区の全部を持つ。相手の地域（前住地）は、
  その年の移動者の総数（年齢・男女とも総数）が10人以上の都道府県・市区町村・区だけが個別の行になり、
  残りは「その他の県」「その他の市町村」「その他の区」にまとめられる。まとめの行も足すと、
  都道府県の和は総数に、市区町村の和は都道府県に、区の和は政令指定都市に一致する。
  政令指定都市と東京都特別区部の行は区の間の移動を含み、都道府県の行はその都道府県内の市区町村の
  間の移動を含む（2024年の札幌市から札幌市へは53,631人）。市の外へ出た人数を見るときは、
  相手が自分自身の行を除く。総数は municipality_migration のinflow（同じ年・同じ国籍区分）と一致する。
  2017年以前は日本人移動者、2018年以降は外国人を含む移動者の表なので、2017年と2018年の間に段差がある。
  出典: 総務省統計局 住民基本台帳人口移動報告 参考表 https://www.stat.go.jp/data/idou/sankouhyo.htm

schema: migration
name: municipality_migration
title: 市区町村別 転入・転出・転入超過（住民基本台帳人口移動報告）
description: |-
  住民基本台帳人口移動報告の市区町村別 転入者数・転出者数・転入超過数（年次）。
  住民票の異動届にもとづく実績で、推計ではない。市区町村をまたぐ移動だけを数え、
  同一市区町村内の移動と国外との出入りは含まない。全国の転入超過数は、どの移動も
  転入と転出の両方に数えられるため定義上 0 になる。
  収録は2010年〜2025年の210,927行。年齢は総数のみで、年齢階級の内訳は持たない
  （原典の年齢区分が年代で違い、2019年以前が3区分、2020年以降が5歳階級）。
  国籍（nationality_code）は系列の始まる年が違う。2010年から続くのは日本人移動者だけで、
  外国人を含む「移動者」は2018年から、「外国人移動者」は2020年からしか無い。
  2017年以前まで遡る時系列は日本人移動者で引く。
  resident_registry.population の moved_in_domestic / moved_out_domestic も同じ住民票の異動から
  作られるが、別に集計された統計なので値は一致しない（2025年の全国・日本人の国内転入は
  この表が4,528,254人、住基の動態が4,523,542人）。全国で転入と転出が一致するのはこの表だけで、
  転入超過を見るならこちらを使う。
  地域には全国・都道府県・市区町村・政令指定都市の区・特別区のほかに、市部／郡部・郡・
  北海道の振興局・東京の支庁という集計行が同じ列に入っている。area_level で絞らずに
  合計すると何重にも数える。
  出典: 総務省統計局 住民基本台帳人口移動報告。
  https://www.stat.go.jp/data/idou/
keywords:
  - e-stat
  - 住民基本台帳
  - 人口移動
  - 転入
  - 転出
  - 転入超過
  - 市区町村
published: true
sources:
  - path: https://www.e-stat.go.jp/dbview?sid=0003419945
  - path: https://www.e-stat.go.jp/dbview?sid=0003461887
fields:
  - name: area
    title: 標準地域コード（5桁）
    description: 地域コード（5桁）。00000=全国、下3桁が000は都道府県、001／002は市部／郡部の集計。標準地域コード（6桁）とは桁が違うので、lg_code や address_br と結合するときは桁を揃える。code.municipality の area_code・census 系の area と同じ体系
  - name: area_name
    title: 地域名
    description: area に対応する地域名。市区町村は「千代田区」「札幌市」のように名称のみで、都道府県名は付かない
  - name: area_level
    title: 地域の粒度
    description: area の粒度。national=全国（1）、prefecture=都道府県（47）、municipality=市・町村・政令指定都市・東京都特別区部（通期で1,736）、ward=政令指定都市の区と特別区（201）、county=郡・北海道の振興局・東京の支庁（332）、urban_rural_part=市部／郡部（96）。日本全域をちょうど1回覆うのは municipality だけ。ward は municipality の内訳、county は町村の合計、urban_rural_part は市と町村を別の切り方でまとめた合計で、いずれも足すと二重に数える。2025年は county と urban_rural_part の行が無い（原典が出していない）ので、地域数は年によって変わる
  - name: parent_area
    title: 上位地域の標準地域コード
    description: 1つ上の階層の地域コード。市・町村・郡・振興局・支庁・政令指定都市の親は都道府県、区の親は政令指定都市（特別区の親は東京都特別区部 13100）、町村の親は郡または振興局・支庁。全国は NULL。市部／郡部が市・町村と重なるので、ある親の子を全部足すと二重に数える
  - name: year
    title: 年
    description: 西暦の年。1月から12月までの移動を積んだ年次の値で、年度ではない
  - name: sex_code
    title: 性別コード
    description: 性別コード。0=総数、1=男、2=女。総数と内訳が同じ列にあるので、絞らずに集計すると二重に数える
  - name: sex
    title: 性別
    description: sex_code に対応する性別名（総数／男／女）
  - name: nationality_code
    title: 国籍コード
    description: 国籍コード。60000=移動者（日本人と外国人の合計）、61000=日本人移動者、62000=外国人移動者。総数と内訳が同じ列にあるので絞らずに集計すると二重に数える。収録の始まりが違い、61000 は2010年から、60000 は2018年から、62000 は2020年から。2012年7月の住民基本台帳法改正で外国人が住民票の対象になるまでの年は 61000 しか無い
  - name: nationality
    title: 国籍区分
    description: nationality_code に対応する国籍区分名（移動者／日本人移動者／外国人移動者）
  - name: inflow
    title: 転入者数
    description: 他市区町村からの転入者数（人）。同一市区町村内の移動と国外からの転入は含まない
  - name: outflow
    title: 転出者数
    description: 他市区町村への転出者数（人）。同一市区町村内の移動と国外への転出は含まない。矢祭町の2010〜2014年と国立市の2010〜2011年は原典が欠測値としているため NULL
  - name: net_inflow
    title: 転入超過数
    description: 転入超過数（人）。inflow - outflow に等しく、負なら転出超過。矢祭町の2010〜2015年と国立市の2010〜2012年は原典が欠測値としているため NULL。原典には「移動前の住所地不詳」（2020年以降）と「その他」（2019年以前）という別枠の表章もあるが、どちらも転入者数にも転入超過数にも含まれず、指しているものが年代で違うのでこの表には取っていない

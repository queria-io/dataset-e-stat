schema: corporate_finance
name: annual_statements
title: 法人企業統計 年度別の財務諸表
description: |-
  法人企業統計調査の年次別調査の値を、調査項目・業種・資本金規模・年度ごとに縦に持つテーブルです。金融業、保険業以外の業種を1960年度から、金融業、保険業の各業種と全産業の範囲を2008年度から収録しています。

  - 調査項目のコードは scope ごとに違うので、scope で絞ってから item_code を使ってください
  - 業種・資本金規模・調査項目は合計と内訳が同じ列に並ぶので、絞ってから集計してください
  - 資本金1千万円未満の法人も含み、四半期別調査とは対象が違います
keywords:
- e-stat
- 法人企業統計
- 財務省
- 企業
- 売上高
- 経常利益
- 設備投資
- 財務
- 付加価値

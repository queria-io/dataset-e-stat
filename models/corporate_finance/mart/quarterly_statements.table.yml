schema: corporate_finance
name: quarterly_statements
title: 法人企業統計 四半期別の財務諸表
description: |-
  法人企業統計調査の四半期別調査の値を、調査項目・業種・資本金規模・四半期ごとに縦に持つテーブルです。金融業、保険業以外の業種を1954年4〜6月期から、金融業、保険業の各業種と全産業の範囲を2008年4〜6月期から、季節調整値を1985年4〜6月期から収録しています。

  - 調査項目のコードは scope ごとに違うので、scope で絞ってから item_code を使ってください
  - 業種・資本金規模・調査項目は合計と内訳が同じ列に並ぶので、絞ってから集計してください
  - 季節調整値と原数値は seasonally_adjusted で分けてください
keywords:
- e-stat
- 法人企業統計
- 財務省
- 企業
- 売上高
- 経常利益
- 設備投資
- 財務
- 季節調整
published: true

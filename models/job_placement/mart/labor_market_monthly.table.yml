schema: job_placement
name: labor_market_monthly
title: 都道府県別の求人数・求職者数・求人倍率（月次）
description: |-
  厚生労働省 一般職業紹介状況（職業安定業務統計）の、ハローワークの求人数・求職者数・求人倍率を、月ごと・都道府県ごとに持つテーブルです。受理地別は1963年1月から、就業地別は2005年2月から最新の公表月まで収録しています。

  - 新規学卒者を除き、パートタイムを含む一般の値です
  - 受理地別と就業地別、実数と季節調整値が同じ列に並ぶので、basis と seasonally_adjusted で絞ってから使ってください
  - 季節調整値は毎年1月分の公表で過去の月も改定されます。毎日の更新で全期間を取り直しています
  - 1972年までの全国の値は沖縄県を含みません
keywords:
- e-stat
- 一般職業紹介状況
- 職業安定業務統計
- 厚生労働省
- ハローワーク
- 有効求人倍率
- 新規求人倍率
- 求人数
- 求職者数
- 都道府県
- 月次
sources:
- path: https://www.e-stat.go.jp/stat-search/files?toukei=00450222
fields:
- name: year
  title: 年
  description: 暦年（西暦4桁）
- name: month
  title: 月
  description: 月（1〜12）
- name: basis
  title: 集計地
  description: 受理地 または 就業地。受理地は求人・求職を受け付けたハローワークの所在地、就業地は求人の働く場所。本社が一括して出す求人は、受理地別では本社の都道府県に数える。就業地別に全国の行は無く、求職者の数（new_applications・active_applicants）は NULL
- name: seasonally_adjusted
  title: 季節調整値
  description: true は季節調整値、false は実数（原数値）。同じ月に両方の行があるので、絞らずに集計すると二重に数える
- name: area
  title: 地域コード
  description: 地域コード（5桁）。00000=全国、XX000=都道府県。1972年までの全国は沖縄県を含まない
- name: area_name
  title: 地域名
  description: 地域名（全国、北海道、青森県 など）
- name: prefecture_code
  title: 都道府県コード
  description: 都道府県コード（2桁）。01=北海道〜47=沖縄県。全国は NULL
  annotations: { queria: { semantic: { role: entity, name: prefecture } } }
- name: new_job_openings
  title: 新規求人数
  description: その月に新たに受け付けた求人の数（人）
- name: new_applications
  title: 新規求職申込件数
  description: その月に新たに受け付けた求職申込の件数（件）。就業地別は NULL
- name: active_job_openings
  title: 有効求人数
  description: 前月から繰り越した求人と、その月の新規求人の合計（人）
- name: active_applicants
  title: 有効求職者数
  description: 前月から繰り越した求職者と、その月の新規求職者の合計（人）。就業地別は NULL
- name: new_openings_ratio
  title: 新規求人倍率
  description: 新規求人数 ÷ 新規求職申込件数（倍）。就業地別は、就業地別の新規求人数を受理地別の新規求職申込件数で割った値
- name: active_openings_ratio
  title: 有効求人倍率
  description: 有効求人数 ÷ 有効求職者数（倍）。就業地別は、就業地別の有効求人数を受理地別の有効求職者数で割った値
annotations:
  queria:
    themes:
    - labour

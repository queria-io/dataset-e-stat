schema: census
name: census_municipality_daytime_population
title: 市区町村別 昼夜間人口（令和2年国勢調査）
description: |-
  令和2年国勢調査 従業地・通学地による人口・就業状態等集計から、全国・都道府県・市区町村ごとの
  夜間人口（常住地による人口）と昼間人口（従業地・通学地による人口）を、男女別・従業地通学地別に
  集計した表。年齢は総数のみで、年齢階級別の内訳は含まない。
  1地域につき 男女3区分 × 常住地従業地19区分 = 57行の縦持ちで、地域は1,965。
  population_base が夜間（nighttime）と昼間（daytime）の別、location_level が階層の深さを表す。
  夜間人口 = 従業も通学もしていない + 自市区町村で従業・通学 + 他市区町村で従業・通学 +
  従業地・通学地「不詳」で、この4区分は location_level = 2 かつ population_base = 'nighttime'
  かつ is_reprint = false で取れる。population_base を落とすと昼間人口側の2区分が混ざる。
  絞らずに合計すると何重にも数える。
  昼間人口 = 夜間人口 − 流出人口 + 流入人口 が全1,965地域・男女3区分すべてで成り立つ。
  昼夜間人口比率は 昼間人口 ÷ 夜間人口 × 100 で、原典の第1-1-2表の公表値と一致する
  （千代田区は 903,780 ÷ 66,680 × 100 = 1355.39892）。
  流出人口・流入人口が指す範囲は area_level で変わる。市区町村（区・町村・政令指定都市以外の市）は
  自市内他区・県内他市町村・他県の3区分の和、政令指定都市と特別区部は県内他市町村・他県の2区分の和、
  都道府県は他県のみ、全国は NULL。「他市区町村で従業・通学」から従業・通学市区町村「不詳・外国」を
  除いたものにあたるが、どこまでを外とみなすかが粒度ごとに違う。
  area は全国（00000）・都道府県・市・特別区部・政令指定都市の区・特別区・町村が同じ列に
  縦に並ぶ。日本全域をちょうど1回覆うのは area_level = 'prefecture' か
  area_level IN ('city', 'town_village') のいずれかで、どちらも夜間人口の合計が全国の
  126,146,099 に一致する。絞らずに合計すると何重にも数える。
  area は census_municipality_labor_force と同じ1,965地域で、census_municipality・
  census_small_area_* の市区町村行・boundary.small_area の key_code の上位5桁・
  code.municipality の area_code と同じ標準地域コード（5桁）。
  全国地方公共団体コード（6桁）とは別体系なので、lg_code や address_br と結合するときは
  桁と体系を揃える。
  常住地から従業地・通学地への流動そのものは census_commuting_flow にある。
  出典: 総務省統計局 令和2年国勢調査 従業地・通学地による人口・就業状態等集計（第1-1-1表）。
  https://www.e-stat.go.jp/
keywords:
  - e-stat
  - 国勢調査
  - 市区町村
  - 都道府県
  - 昼間人口
  - 夜間人口
  - 昼夜間人口比率
  - 通勤
  - 通学
  - 流入人口
  - 流出人口
published: true
sources:
  - path: https://www.e-stat.go.jp/statistics/00200521
fields:
  - name: area
    title: 標準地域コード（5桁）
    description: 標準地域コード。全国は 00000、都道府県は 13000 のように市区町村部が 000。census_municipality の area と同じ体系で、そちらの部分集合（2000年市区町村の再掲を除いた1,965地域）
  - name: area_name
    title: 地域名
    description: 地域の名称（全国／東京都／特別区部／千代田区／札幌市／札幌市中央区 など）
  - name: area_level
    title: 地域の粒度
    description: 'area の粒度。national=全国（1）、prefecture=都道府県（47）、city=市・特別区部（793）、ward=政令指定都市の区と特別区（198）、town_village=町村（926）。日本全域をちょうど1回覆うのは prefecture だけ、または city と town_village の組だけで、どちらも夜間人口の合計が全国の 126,146,099 に一致する。ward は city の内訳（例: 千代田区は特別区部の内訳）で、足すと二重に数える'
  - name: parent_area
    title: 上位地域の標準地域コード
    description: 1つ上の階層の area。都道府県の親は全国、市・町村の親は都道府県、政令指定都市の区の親はその市、特別区の親は特別区部（13100）。全国は NULL
  - name: sex_code
    title: 男女コード
    description: 男女のコード。0=総数、1=男、2=女。同じ地域・同じ従業地通学地区分で 男 + 女 = 総数 が全行で成り立つため、絞らずに合計すると2倍になる
  - name: sex
    title: 男女
    description: sex_code に対応する区分名（総数／男／女）
  - name: location_code
    title: 常住地又は従業地・通学地コード
    description: "常住地又は従業地・通学地のコード。夜間人口側は 0=常住地による人口（夜間人口）、001=従業も通学もしていない、002=自市区町村で従業・通学（0021=自宅で従業／0022=自宅外の自市区町村で従業・通学）、003=他市区町村で従業・通学（0031=自市内他区／0032=県内他市町村／0033=他県／0034=従業・通学市区町村「不詳・外国」）、004=従業地・通学地「不詳」、0R1=（再掲）流出人口。昼間人口側は 1=従業地・通学地による人口（昼間人口）、101=うち他市区町村に常住（1011=自市内他区／1012=県内他市町村／1013=他県）、102=うち従業地・通学地「不詳」等で当地に常住している者、1R1=（再掲）流入人口。総数と大区分と内訳が同じ列に混在する"
  - name: location
    title: 常住地又は従業地・通学地
    description: location_code に対応する区分名。（再掲）が付く2区分は他の区分の一部を足し直したもの
  - name: location_level
    title: 常住地又は従業地・通学地の階層
    description: "区分の階層の深さ。1=夜間人口と昼間人口そのもの、2=その大区分、3=大区分の内訳。夜間人口の合計に使えるのは location_level = 2 かつ population_base = 'nighttime' かつ is_reprint = false の4区分で、その和が夜間人口に一致する"
  - name: population_base
    title: 夜間・昼間の別
    description: "区分が夜間人口側か昼間人口側か。nighttime=常住地による人口（夜間人口）とその内訳、daytime=従業地・通学地による人口（昼間人口）とその内訳。location_code の先頭1文字に対応する。夜間と昼間は同じ人口を別の場所で数え直したものなので、両方を足すと意味を持たない"
  - name: is_reprint
    title: 再掲かどうか
    description: "（再掲）流出人口（0R1）と（再掲）流入人口（1R1）に true。どちらも他の区分の一部を足し直したもので、同じ location_level の他の区分と並べて足すと二重に数える。流出人口・流入人口が指す範囲は area_level で変わり、市区町村（区・町村・政令指定都市以外の市）は自市内他区・県内他市町村・他県の和、政令指定都市と特別区部は県内他市町村・他県の和、都道府県は他県のみ、全国は NULL"
  - name: unit
    title: 単位
    description: 単位。この表では常に「人」
  - name: value
    title: 人口
    description: 人口（人）。2020年10月1日現在。原典が「-」の区分は NULL で、112,005行のうち11,360行。該当者がいない（0人）ことを表し、内訳の合計は総数と一致する。全国行の流出人口・流入人口は定義上存在しないため NULL

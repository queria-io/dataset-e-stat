schema: census
name: daytime_population_mesh_1km
title: 1kmメッシュ別 昼間人口・夜間人口（推計）
description: '1kmメッシュ別の昼間人口・夜間人口・昼夜間人口比率（推計値）。

  昼間人口は市区町村より細かい単位では公表されていないため、市区町村の公表値を

  メッシュへ按分して推計している。公表値の内訳（社会・人口統計体系 A6101〜A6106、

  令和2年）を「その場に残る人」と「そこで従業・通学する人」に分け、前者はメッシュの

  夜間人口、後者はメッシュの従業者数をウェイトに配分する。ウェイトは市区町村内で

  正規化するので、市区町村ごとに合計すると公表昼間人口（A6107）に一致する。

  推計の限界: 従業者数のウェイトは平成28年経済センサス（A～R全産業、S公務を除く）で、

  官公庁の集積と通学による流入は反映されない。買い物客・観光客は含まない

  （公表昼間人口も同じ）。

  mesh_code は同データセットの境界データ mesh_1km と同一体系で、mesh_code で

  結合して地図化・空間集計できる。

  出典: 総務省統計局 令和2年国勢調査／平成28年経済センサス‐活動調査に関する

  地域メッシュ統計、社会・人口統計体系。

  https://www.e-stat.go.jp/'
keywords:
  - e-stat
  - 国勢調査
  - 経済センサス
  - メッシュ
  - 昼間人口
  - 夜間人口
  - GIS
published: true
sources:
  - path: https://www.e-stat.go.jp/
fields:
  - name: mesh_code
    title: メッシュコード（境界データ mesh_1km と同一体系の8桁）
    semantic: { role: entity, name: mesh }
  - name: city_code
    title: 按分に使った市区町村コード（メッシュ中心点が属する市区町村。5桁）
    semantic: { role: entity, name: city }
  - name: nighttime_population
    title: 夜間人口（常住人口。令和2年国勢調査の人口総数）
  - name: daytime_population
    title: 昼間人口（推計値。市区町村合計は公表値に一致する）
  - name: daytime_ratio
    title: 昼夜間人口比率（％。夜間人口0のメッシュは NULL）
  - name: daytime_night_diff
    title: 昼夜間人口差（昼間人口−夜間人口）
  - name: employees
    title: 従業者数（平成28年経済センサス‐活動調査、A～R全産業）
  - name: establishments
    title: 事業所数（平成28年経済センサス‐活動調査、A～R全産業）

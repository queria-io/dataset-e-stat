version: 2

models:
  - name: census_small_area_age
    description: |
      令和2年国勢調査 小地域(町丁・字等)別 年齢(5歳階級・4区分)別、男女別人口。
      area は同データセットの境界データ small_area の key_code と同一体系で、
      key_code = area で境界ポリゴン・人口・世帯数と結合できる。
      area には市区町村(5桁)と小地域(9桁/11桁)の各階層が含まれる。
      分類は cat01=男女・年齢区分（総数／男／女 × 5歳階級・4区分）、
      cat02=秘匿・合算区分(無し/合算/秘匿)。男女は cat01 側に入っている。
      出典: 総務省統計局 令和2年国勢調査 小地域集計（統計GIS）。
      https://www.e-stat.go.jp/gis
    access: public
    columns:
      - name: area
        description: "地域コード。境界データ boundary.small_area の key_code と同一体系で、key_code = area で結合できる（9桁/11桁のみ）。市区町村（5桁）・町丁・字等（9桁）・その内訳区画（11桁）の3階層が同じ列に混在し、5桁は9桁の合計、9桁は11桁の合計にあたる。桁数を揃えずに合計すると二重・三重の計上になる"
      - name: area_name
        description: "地域の名称。5桁の行は市区町村名（札幌市中央区）、9桁/11桁の行は市区町村名に町丁・字等名を続けた表記（札幌市中央区円山）"
      - name: area_level
        description: "area の粒度。municipality=市区町村（5桁）、small_area=町丁・字等（9桁）、small_area_detail=丁目など町丁・字等の内訳（11桁）。municipality と small_area はどちらも全域を覆い、総人口の合計はどちらも 126,146,099 で一致する。small_area_detail は丁目に分かれている地域にしか無く全域を覆わない（総人口で 80,726,789、64%）ので、この粒度だけで合計すると足りない"
      - name: cat01
        description: "男女・年齢区分のコード（4桁）。0010〜0200 が総数、0210〜0400 が男、0410〜0600 が女で、男女の別もこの列に入っている。各区分の中に「総数、年齢「不詳」含む」と5歳階級と4区分（15歳未満・15〜64歳・65歳以上・75歳以上）が同居するため、cat01 を絞らずに value を合計すると何重にも重複する"
      - name: age_class
        description: "sex_code に対応する区分名（「総数、年齢「不詳」含む」「　男６５歳以上」など）。先頭の全角空白は元データの階層表現をそのまま残したもの"
      - name: cat02
        description: "秘匿・合算区分のコード。1=無し、2=合算、3=秘匿。男女区分ではない（男女は cat01 側に入っている）"
      - name: sex
        description: "cat02 に対応する区分名（無し／合算／秘匿）。列名は sex だが中身は秘匿・合算区分で、男女ではない"
      - name: unit
        description: "単位。この表では常に「人」"
      - name: value
        description: "人口（人）。cat02=3（秘匿）の行は 0 が入るが「0人」ではなく非公表で、実数は cat02=2（合算）の地域に含まれている。秘匿を 0 として合計すると実態より小さくなる"

  - name: census_small_area_household
    description: |
      令和2年国勢調査 小地域(町丁・字等)別 世帯の家族類型別一般世帯数。
      area は同データセットの境界データ small_area の key_code と同一体系で、
      key_code = area で境界ポリゴン・人口・世帯数と結合できる。
      area には市区町村(5桁)と小地域(9桁/11桁)の各階層が含まれる。
      分類は cat01=世帯の家族類型(一般世帯総数・親族世帯・核家族世帯・夫婦のみ・
      夫婦と子供 など)、cat02=秘匿・合算区分(無し/合算/秘匿)。
      出典: 総務省統計局 令和2年国勢調査 小地域集計（統計GIS）。
      https://www.e-stat.go.jp/gis
    access: public
    columns:
      - name: area
        description: "地域コード。境界データ boundary.small_area の key_code と同一体系で、key_code = area で結合できる（9桁/11桁のみ）。市区町村（5桁）・町丁・字等（9桁）・その内訳区画（11桁）の3階層が同じ列に混在し、5桁は9桁の合計、9桁は11桁の合計にあたる。桁数を揃えずに合計すると二重・三重の計上になる"
      - name: area_name
        description: "地域の名称。5桁の行は市区町村名（札幌市中央区）、9桁/11桁の行は市区町村名に町丁・字等名を続けた表記（札幌市中央区円山）"
      - name: area_level
        description: "area の粒度。municipality=市区町村（5桁）、small_area=町丁・字等（9桁）、small_area_detail=丁目など町丁・字等の内訳（11桁）。municipality と small_area はどちらも全域を覆い、総人口の合計はどちらも 126,146,099 で一致する。small_area_detail は丁目に分かれている地域にしか無く全域を覆わない（総人口で 80,726,789、64%）ので、この粒度だけで合計すると足りない"
      - name: cat01
        description: "世帯の家族類型コード（4桁）。0010=一般世帯総数、0020=親族世帯、0030=核家族世帯、0040/0050=そのうち夫婦のみ／夫婦と子供、0060=核家族以外。総数と内訳が同じ列に混在するため、cat01 を絞らずに value を合計すると二重計上になる"
      - name: family_type
        description: "cat01 に対応する家族類型名。先頭の全角空白は元データの階層表現をそのまま残したもので、字下げが深いほど下位の内訳"
      - name: cat02
        description: "秘匿・合算区分のコード。1=無し、2=合算、3=秘匿"
      - name: secrecy
        description: "cat02 に対応する区分名（無し／合算／秘匿）"
      - name: unit
        description: "単位。この表では常に「世帯」"
      - name: value
        description: "一般世帯数（世帯）。cat02=3（秘匿）の行は 0 が入るが「0世帯」ではなく非公表で、実数は cat02=2（合算）の地域に含まれている。秘匿を 0 として合計すると実態より小さくなる"

  - name: census_small_area_industry
    description: |
      令和2年国勢調査 小地域(町丁・字等)別 産業(大分類)別就業者数。
      area は同データセットの境界データ small_area の key_code と同一体系で、
      key_code = area で境界ポリゴン・人口・世帯数と結合できる。
      area には市区町村(5桁)と小地域(9桁/11桁)の各階層が含まれる。
      分類は cat01=産業大分類(総数・農業林業・製造業・卸売小売業 など)、
      cat02=秘匿・合算区分(無し/合算/秘匿)。値は就業者数(人)。
      出典: 総務省統計局 令和2年国勢調査 小地域集計（統計GIS）。
      https://www.e-stat.go.jp/gis
    access: public
    columns:
      - name: area
        description: "地域コード。境界データ boundary.small_area の key_code と同一体系で、key_code = area で結合できる（9桁/11桁のみ）。市区町村（5桁）・町丁・字等（9桁）・その内訳区画（11桁）の3階層が同じ列に混在し、5桁は9桁の合計、9桁は11桁の合計にあたる。桁数を揃えずに合計すると二重・三重の計上になる"
      - name: area_name
        description: "地域の名称。5桁の行は市区町村名（札幌市中央区）、9桁/11桁の行は市区町村名に町丁・字等名を続けた表記（札幌市中央区円山）"
      - name: area_level
        description: "area の粒度。municipality=市区町村（5桁）、small_area=町丁・字等（9桁）、small_area_detail=丁目など町丁・字等の内訳（11桁）。municipality と small_area はどちらも全域を覆い、総人口の合計はどちらも 126,146,099 で一致する。small_area_detail は丁目に分かれている地域にしか無く全域を覆わない（総人口で 80,726,789、64%）ので、この粒度だけで合計すると足りない"
      - name: cat01
        description: "産業大分類のコード（4桁）。0010=総数、0020 以降が日本標準産業分類の大分類（Ａ農業、林業／Ｂ漁業…）。総数と「うち農業」のような内訳が同じ列に混在するため、cat01 を絞らずに value を合計すると二重計上になる"
      - name: industry
        description: "cat01 に対応する産業大分類名（総数、Ａ農業、林業 など）。「うち農業」で始まる行は直前の大分類の内訳"
      - name: cat02
        description: "秘匿・合算区分のコード。1=無し、2=合算、3=秘匿"
      - name: secrecy
        description: "cat02 に対応する区分名（無し／合算／秘匿）"
      - name: unit
        description: "単位。この表では常に「人」"
      - name: value
        description: "就業者数（人）。cat02=3（秘匿）の行は 0 が入るが「0人」ではなく非公表で、実数は cat02=2（合算）の地域に含まれている。秘匿を 0 として合計すると実態より小さくなる"

  - name: census_small_area_housing
    description: |
      令和2年国勢調査 小地域(町丁・字等)別 住宅の所有の関係別一般世帯数。
      area は同データセットの境界データ small_area の key_code と同一体系で、
      key_code = area で境界ポリゴン・人口・世帯数と結合できる。
      area には市区町村(5桁)と小地域(9桁/11桁)の各階層が含まれる。
      分類は cat01=住宅の種類・所有の関係(住宅に住む一般世帯・持ち家・民営借家 など)、
      cat02=秘匿・合算区分(無し/合算/秘匿)。
      出典: 総務省統計局 令和2年国勢調査 小地域集計（統計GIS）。
      https://www.e-stat.go.jp/gis
    access: public
    columns:
      - name: area
        description: "地域コード。境界データ boundary.small_area の key_code と同一体系で、key_code = area で結合できる（9桁/11桁のみ）。市区町村（5桁）・町丁・字等（9桁）・その内訳区画（11桁）の3階層が同じ列に混在し、5桁は9桁の合計、9桁は11桁の合計にあたる。桁数を揃えずに合計すると二重・三重の計上になる"
      - name: area_name
        description: "地域の名称。5桁の行は市区町村名（札幌市中央区）、9桁/11桁の行は市区町村名に町丁・字等名を続けた表記（札幌市中央区円山）"
      - name: area_level
        description: "area の粒度。municipality=市区町村（5桁）、small_area=町丁・字等（9桁）、small_area_detail=丁目など町丁・字等の内訳（11桁）。municipality と small_area はどちらも全域を覆い、総人口の合計はどちらも 126,146,099 で一致する。small_area_detail は丁目に分かれている地域にしか無く全域を覆わない（総人口で 80,726,789、64%）ので、この粒度だけで合計すると足りない"
      - name: cat01
        description: "住宅の種類・所有の関係コード（4桁）。0010=住宅に住む一般世帯（総数）、0020=持ち家、0030=民営借家 以降が内訳。総数と内訳が同じ列に混在するため、cat01 を絞らずに value を合計すると二重計上になる"
      - name: tenure
        description: "cat01 に対応する住宅の種類・所有の関係名（住宅に住む一般世帯、持ち家、民営借家 など）"
      - name: cat02
        description: "秘匿・合算区分のコード。1=無し、2=合算、3=秘匿"
      - name: secrecy
        description: "cat02 に対応する区分名（無し／合算／秘匿）"
      - name: unit
        description: "単位。この表では常に「世帯」"
      - name: value
        description: "一般世帯数（世帯）。cat02=3（秘匿）の行は 0 が入るが「0世帯」ではなく非公表で、実数は cat02=2（合算）の地域に含まれている。秘匿を 0 として合計すると実態より小さくなる"

  - name: daytime_population_mesh_1km
    description: |
      1kmメッシュ別の昼間人口・夜間人口・昼夜間人口比率（推計値）。
      昼間人口は市区町村より細かい単位では公表されていないため、市区町村の公表値を
      メッシュへ按分して推計している。公表値の内訳（社会・人口統計体系 A6101〜A6106、
      令和2年）を「その場に残る人」と「そこで従業・通学する人」に分け、前者は
      メッシュの夜間人口、後者はメッシュの従業者数をウェイトに配分する。
      ウェイトは市区町村内で正規化するので、市区町村ごとに合計すると公表昼間人口
      （A6107）に一致する。
      推計の限界: 従業者数のウェイトは平成28年経済センサス（A～R全産業、S公務を除く）で、
      官公庁の集積と通学による流入は反映されない。買い物客・観光客は含まない
      （公表昼間人口も同じ）。
      mesh_code は同データセットの境界データ mesh_1km と同一体系で、
      mesh_code = mesh_code で結合して地図化・空間集計できる。
      出典: 総務省統計局 令和2年国勢調査／平成28年経済センサス‐活動調査
      に関する地域メッシュ統計、社会・人口統計体系。
      https://www.e-stat.go.jp/
    access: public
    columns:
      - name: mesh_code
        description: "3次メッシュコード（8桁）。境界データ mesh_1km の mesh_code と同一体系で結合できる"
      - name: city_code
        description: "按分に使った市区町村コード（5桁）。メッシュ中心点が属する市区町村。中心点がどの町丁・字等にも入らないメッシュは NULL で、この場合 daytime_population = nighttime_population になる"
      - name: nighttime_population
        description: "夜間人口（人）。令和2年国勢調査の人口総数で、推計値ではなく実測値"
      - name: daytime_population
        description: "昼間人口（人）。推計値。市区町村ごとに合計すると公表昼間人口（A6107）に一致する"
      - name: daytime_ratio
        description: "昼夜間人口比率（％）。昼間人口÷夜間人口×100。夜間人口が0のメッシュは NULL"
      - name: daytime_night_diff
        description: "昼夜間人口差（人）。昼間人口−夜間人口。正なら流入超過、負なら流出超過"
      - name: employees
        description: "従業者数（人）。平成28年経済センサス‐活動調査のA～R全産業（S公務を除く）。流入の按分ウェイトに使っている"
      - name: establishments
        description: "事業所数。平成28年経済センサス‐活動調査のA～R全産業（S公務を除く）"

  - name: census_municipality
    description: |
      令和2年国勢調査 人口等基本集計から、全国・都道府県・市区町村ごとの人口、
      男女別人口、世帯数、世帯人員、5年前との人口・世帯の増減、人口性比、面積、
      人口密度を1行にまとめた表。census スキーマの他の表が町丁・字等の粒度なのに対し、
      こちらは市区町村・都道府県の粒度。
      area は全国(00000)・都道府県・市区町村・政令指定都市の区・2000年(平成12年)
      市区町村が同じ列に縦に並ぶ。日本全域をちょうど1回覆うのは
      area_level = 'prefecture' か area_level IN ('city', 'town_village') の
      いずれかで、絞らずに合計すると何重にも数える。
      area は census_small_area_* の市区町村行、boundary.small_area の key_code の
      上位5桁、code.municipality の area_code と同じ標準地域コード(5桁)。
      出典: 総務省統計局 令和2年国勢調査 人口等基本集計
      (第1-1-1表・第1-1-2表・第1-1-3表)。https://www.e-stat.go.jp/
    access: public
    columns:
      - name: area
        description: "標準地域コード。全国は 00000、都道府県は 13000 のように市区町村部が 000。census_small_area_* の市区町村行・boundary.small_area の key_code の上位5桁・code.municipality の area_code と同じ体系。全国地方公共団体コード（6桁）とは別体系"
      - name: area_name
        description: "地域の名称（全国／東京都／特別区部／千代田区／札幌市／札幌市中央区 など）。2000年市区町村の行は「（旧：戸井町）」のように括弧付きで入る"
      - name: area_level
        description: "area の粒度。national=全国（1）、prefecture=都道府県（47）、city=市・特別区部（793）、ward=政令指定都市の区と特別区（198）、town_village=町村（926）、former_municipality=2000年（平成12年）の市区町村（2,121）。日本全域をちょうど1回覆うのは prefecture だけ、または city と town_village の組だけで、どちらも人口の合計が全国の 126,146,099 に一致する。ward は city の内訳、former_municipality は現行市区町村を2000年の区域で組み替えた再掲で、いずれも足すと二重に数える"
      - name: parent_area
        description: "1つ上の階層の area。都道府県の親は全国、市・町村の親は都道府県、政令指定都市の区の親はその市、特別区の親は特別区部（13100）。全国は NULL。2000年市区町村の親は都道府県で、現行の市区町村ではない"
      - name: population
        description: "人口（人）。2020年10月1日現在。全国で 126,146,099"
      - name: population_male
        description: "男の人口（人）。population_male + population_female = population が全行で成り立つ"
      - name: population_female
        description: "女の人口（人）"
      - name: households
        description: "世帯数（世帯）。一般世帯と施設等の世帯の合計。全国で 55,830,154"
      - name: households_general
        description: "一般世帯数（世帯）。全国で 55,704,949"
      - name: households_institutional
        description: "施設等の世帯数（世帯）。寮・病院・施設・自衛隊営舎などに住む世帯"
      - name: household_members
        description: "世帯人員（人）。全行で population と一致する（国勢調査は世帯を単位に人を数えるため）"
      - name: household_members_general
        description: "一般世帯の世帯人員（人）。household_members_general ÷ households_general が1世帯当たり人員"
      - name: household_members_institutional
        description: "施設等の世帯の世帯人員（人）"
      - name: population_2015
        description: "平成27年国勢調査の人口を2020年の市区町村の区域に組み替えた値（人）。東日本大震災で全町避難が続いた富岡町・大熊町・双葉町・浪江町の4町は原典が「-」で NULL"
      - name: households_2015
        description: "平成27年国勢調査の世帯数を2020年の市区町村の区域に組み替えた値（世帯）。population_2015 と同じ4町が NULL"
      - name: population_change_5y
        description: "2015年からの人口増減数（人）。population - population_2015 に等しい。ただし population_2015 が NULL の4町では原典が2015年を0として増減数を出しているため、実質的に2020年の人口そのもの（双葉町は0）で、増減として読めない"
      - name: population_change_rate_5y
        description: "2015年からの人口増減率（％）。population_2015 が NULL の4町は原典も「-」で NULL"
      - name: household_change_5y
        description: "2015年からの世帯増減数（世帯）。population_change_5y と同じく、4町では増減として読めない"

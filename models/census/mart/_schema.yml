        description: "area の粒度。national=全国（1）、prefecture=都道府県（47）、city=市・特別区部（793）、ward=政令指定都市の区と特別区（198）、town_village=町村（926）。日本全域をちょうど1回覆うのは prefecture だけ、または city と town_village の組だけで、どちらも15歳以上人口の合計が全国の 108,258,569 に一致する。ward は city の内訳で、足すと二重に数える"
      - name: parent_area
        description: "1つ上の階層の area。都道府県の親は全国、市・町村の親は都道府県、政令指定都市の区の親はその市、特別区の親は特別区部（13100）。全国は NULL"
      - name: sex_code
        description: "男女のコード。0=総数、1=男、2=女。同じ地域・同じ労働力状態で 男 + 女 = 総数 が全行で成り立つため、絞らずに合計すると2倍になる"
      - name: sex
        description: "sex_code に対応する区分名（総数／男／女）"
      - name: labor_status_code
        description: "労働力状態のコード。0=総数、1=労働力人口、11=就業者、111/112/113/114=就業者の内訳、12=完全失業者、2=非労働力人口、21/22/23=非労働力人口の内訳、3=労働力状態「不詳」"
      - name: labor_status
        description: "labor_status_code に対応する区分名。内訳の名称は原典どおり括弧付き（「（就業者）休業者」など）"
      - name: labor_status_level
        description: "労働力状態の階層の深さ。1=総数と大区分、2=その内訳、3=就業者の内訳。合計に使えるのは labor_status_level = 1 かつ labor_status_code <> '0' の3行で、その和が総数に一致する"
      - name: unit
        description: "単位。この表では常に「人」"
      - name: value
        description: "15歳以上人口（人）。原典が「-」の区分は NULL。内訳の合計が総数と一致することから、「-」は該当者がいない（0人）ことを表す。双葉町だけは39行すべてが「-」で、全項目が NULL になる"


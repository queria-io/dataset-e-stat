schema: census
name: census_municipality_employment_status
title: 市区町村別 従業上の地位別就業者数（令和2年国勢調査）
description: |-
  令和2年国勢調査の、全国・都道府県・市区町村ごとの15歳以上就業者を、男女別・従業上の地位別に持つテーブルです。

  - 合計に使えるのは employment_status_level = 1、employment_status_code <> '0'、is_reprint = false の7行です
  - 全国・都道府県・市区町村などの行が同じ列に並ぶので、area_level で1つの粒度に絞ってから合計してください
  - area は標準地域コード（5桁）で、6桁の全国地方公共団体コードとは別体系です
keywords:
  - e-stat
  - 国勢調査
  - 市区町村
  - 都道府県
  - 就業者
  - 従業上の地位
  - 正規雇用
  - 非正規雇用
temporal_coverage: { start: "2020", end: "2020" }
sources:
  - path: https://www.e-stat.go.jp/statistics/00200521
fields:
  - name: area
    title: 標準地域コード（5桁）
    description: 標準地域コード。全国は 00000、都道府県は 13000 のように市区町村部が 000。census_municipality の area と同じ体系で、そちらの部分集合（2000年市区町村の再掲を除いた1,965地域）
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: area_name
    title: 地域名
    description: 地域の名称（全国／東京都／特別区部／千代田区／札幌市／札幌市中央区 など）
  - name: area_level
    title: 地域の粒度
    description: 'area の粒度。national=全国（1）、prefecture=都道府県（47）、city=市・特別区部（793）、ward=政令指定都市の区と特別区（198）、town_village=町村（926）。日本全域をちょうど1回覆うのは prefecture だけ、または city と town_village の組だけで、どちらも就業者数の合計が全国の 57,643,225 に一致する。ward は city の内訳で、足すと二重に数える'
  - name: parent_area
    title: 上位地域の標準地域コード
    description: 1つ上の階層の area。都道府県の親は全国、市・町村の親は都道府県、政令指定都市の区の親はその市、特別区の親は特別区部（13100）。全国は NULL
  - name: sex_code
    title: 男女コード
    description: 男女のコード。0=総数、1=男、2=女。同じ地域・同じ従業上の地位で 男 + 女 = 総数 が全行で成り立つため、絞らずに合計すると2倍になる
  - name: sex
    title: 男女
    description: sex_code に対応する区分名（総数／男／女）
  - name: employment_status_code
    title: 従業上の地位コード
    description: "従業上の地位のコード。0=総数、1=雇用者、11/12/13=雇用者の内訳（正規の職員・従業員／労働者派遣事業所の派遣社員／パート・アルバイト・その他）、2=役員、3=雇人のある業主、4=雇人のない業主、5=家族従業者、6=家庭内職者、7=従業上の地位「不詳」、R1=（再掲）雇用者（役員を含む）"
  - name: employment_status
    title: 従業上の地位
    description: employment_status_code に対応する区分名。雇用者の内訳は原典どおり括弧付き（「（雇用者）正規の職員・従業員」など）
  - name: employment_status_level
    title: 従業上の地位の階層
    description: "従業上の地位の階層の深さ。1=総数と大区分、2=雇用者の内訳。level = 1 には再掲の「（再掲）雇用者（役員を含む）」も入るので、合計するときは is_reprint = false も併せて絞る"
  - name: is_reprint
    title: 再掲かどうか
    description: 「（再掲）雇用者（役員を含む）」（employment_status_code = 'R1'）のとき true。雇用者と役員を足し直した再掲で、大区分と一緒に合計すると二重に数える
  - name: unit
    title: 単位
    description: 単位。この表では常に「人」
  - name: value
    title: 就業者数
    description: 15歳以上就業者数（人）。2020年10月1日現在。原典が「-」の区分は NULL。内訳の合計が総数と一致することから、「-」は該当者がいない（0人）ことを表す。全町避難が続いた双葉町だけは36行すべてが「-」で、全項目が NULL になる
annotations:
  queria:
    themes: [population]

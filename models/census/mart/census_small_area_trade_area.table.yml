schema: census
name: census_small_area_trade_area
title: 商圏分析用 小地域別の国勢調査の値（令和2年国勢調査）
description: '商圏分析（queria.io の /gis と、ページの gis ブロック）が町丁目ごとに引く値を、

  小地域の年齢・世帯の家族類型・世帯人員・住宅の所有の関係・住宅の建て方の 5 つの表から

  1 本に積んだもの。分析が使う cat01 の行だけを、元の表の行のまま持つ。

  source が元の表の名前で、area・cat01・cat02・value の意味は元の表と同じ。

  出典: 総務省統計局 令和2年国勢調査 小地域集計（統計GIS）。

  https://www.e-stat.go.jp/gis'
keywords:
  - e-stat
  - 国勢調査
  - 小地域
  - 商圏
published: false
themes: [population]
temporal_coverage: { start: "2020", end: "2020" }
sources:
  - path: https://www.e-stat.go.jp/gis
fields:
  - name: area
    title: 地域コード（境界データ small_area の key_code と同一体系）
    description: 地域コード。元の表の area と同じで、市区町村（5桁）・町丁・字等（9桁）・その内訳区画（11桁）の3階層が同じ列に混在する
    semantic: { role: entity, name: small_area }
  - name: source
    title: 元の表
    description: 行を取った表の名前（census_small_area_age・census_small_area_household・census_small_area_household_size・census_small_area_housing・census_small_area_building_type）。cat01 の意味は表ごとに違うので、必ず source で絞ってから使う
  - name: cat01
    title: 分類コード
    description: 元の表の cat01（4桁）。分析が使うコードだけを持つ
  - name: cat02
    title: 秘匿・合算区分コード
    description: 秘匿・合算区分のコード。1=無し、2=合算、3=秘匿
  - name: value
    title: 値
    description: 元の表の value。年齢の表は人、それ以外は世帯（世帯人員の 0070 は人）。cat02=3（秘匿）の行は 0 が入るが非公表で、実数は cat02=2（合算）の地域に含まれている

schema: census
name: census_small_area_household_size
title: 小地域別 世帯人員別一般世帯数（令和2年国勢調査）
description: '令和2年国勢調査 小地域(町丁・字等)別 世帯人員別一般世帯数。

  area は同データセットの境界データ small_area の key_code と同一体系で、

  key_code = area で境界ポリゴン・人口・世帯数と結合できる。

  area には市区町村(5桁)と小地域(9桁/11桁)の各階層が含まれる。

  分類は cat01=世帯人員(一般世帯数・世帯人員1人〜5人・一般世帯人員・1世帯当たり人員)、

  cat02=秘匿・合算区分(無し/合算/秘匿)。

  出典: 総務省統計局 令和2年国勢調査 小地域集計（統計GIS）。

  https://www.e-stat.go.jp/gis'
keywords:
  - e-stat
  - 国勢調査
  - 小地域
  - 町丁字
  - 世帯
  - 世帯人員
  - 単身世帯
published: true
sources:
  - path: https://www.e-stat.go.jp/gis
fields:
  - name: area
    title: 地域コード（境界データ small_area の key_code と同一体系）
    description: 地域コード。境界データ boundary.small_area の key_code と同一体系で、key_code = area で結合できる（9桁/11桁のみ）。市区町村（5桁）・町丁・字等（9桁）・その内訳区画（11桁）の3階層が同じ列に混在し、5桁は9桁の合計、9桁は11桁の合計にあたる。桁数を揃えずに合計すると二重・三重の計上になる
  - name: area_name
    title: 町丁・字等名称
    description: 地域の名称。5桁の行は市区町村名（札幌市中央区）、9桁/11桁の行は市区町村名に町丁・字等名を続けた表記（札幌市中央区円山）
  - name: area_level
    description: area の粒度。municipality=市区町村（5桁）、small_area=町丁・字等（9桁）、small_area_detail=丁目など町丁・字等の内訳（11桁）。municipality と small_area はどちらも全域を覆い、総人口の合計はどちらも 126,146,099 で一致する。small_area_detail は丁目に分かれている地域にしか無く全域を覆わない（総人口で 80,726,789、64%）ので、この粒度だけで合計すると足りない
  - name: cat01
    title: 世帯人員コード
    description: 世帯人員コード（4桁）。0010=一般世帯数（総数。6人以上を含む）、0020〜0060=世帯人員1人〜5人の世帯数、0070=一般世帯人員（人）、0080=1世帯当たり人員（人／世帯）。6人以上の世帯数の行は無く、0010 から 0020〜0060 を引いた差にあたる。0070 と 0080 は単位が違うので、cat01 を絞らずに value を合計すると意味の無い数になる
  - name: household_size
    title: 世帯人員名
    description: cat01 に対応する名称。先頭の全角空白は元データの階層表現をそのまま残したもので、字下げのある行が総数の内訳
  - name: cat02
    title: 秘匿・合算区分コード
    description: 秘匿・合算区分のコード。1=無し、2=合算、3=秘匿
  - name: secrecy
    title: 秘匿・合算区分名（無し/合算/秘匿）
    description: cat02 に対応する区分名（無し／合算／秘匿）
  - name: unit
    title: 単位
    description: 単位。cat01 によって違い、0010〜0060 は「世帯」、0070 は「人」、0080 は「*人／世帯」（先頭の * も元データの表記のまま）
  - name: value
    title: 世帯数・世帯人員・1世帯当たり人員
    description: cat01 に応じて一般世帯数（世帯）、一般世帯人員（人）、1世帯当たり人員（人／世帯）。cat02=3（秘匿）の行は 0 が入るが「0」ではなく非公表で、実数は cat02=2（合算）の地域に含まれている。秘匿を 0 として合計すると実態より小さくなる

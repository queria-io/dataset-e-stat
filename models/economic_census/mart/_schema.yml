version: 2

models:
  - name: establishment_industry
    description: |
      令和3年経済センサス‐活動調査 産業横断的集計「売上（収入）金額等」から、
      全国・都道府県・市区町村ごとの民営事業所数・従業者数・売上（収入）金額を
      産業大分類別・経営組織別に集計した表。2021年6月1日現在。
      1地域につき 産業27区分 × 経営組織6区分 = 162行で、地域は1,966。
      事業所数はこの集計の対象事業所数で、事業所に関する集計の民営事業所数
      (全国5,156,063)とは母数が違う。売上（収入）金額は産業によって調査されて
      いないため、建設業・運輸業・金融保険業などと全産業の合計は NULL になる。
      area は census_municipality・code.municipality と同じ標準地域コード(5桁)。
      出典: 総務省・経済産業省 令和3年経済センサス‐活動調査
      事業所に関する集計 産業横断的集計 売上（収入）金額等（第2-1表）。
      https://www.e-stat.go.jp/
    access: public
    columns:
      - name: area
        description: "標準地域コード。全国は 00000、都道府県は 13000 のように市区町村部が 000。census_municipality の area・code.municipality の area_code と同じ体系"
      - name: area_name
        description: "地域の名称（全国／東京都／特別区部／千代田区／札幌市／札幌市中央区 など）"
      - name: area_level
        description: "area の粒度。national=全国（1）、prefecture=都道府県（47）、municipality=市・町村・特別区部（1,719）、ward=政令指定都市の行政区・特別区・境界未定地域（199）。日本全域をちょうど1回覆うのは prefecture だけ、または municipality だけ。ward は municipality の内訳で、足すと二重に数える"
      - name: parent_area
        description: "1つ上の階層の area。都道府県の親は全国、市・町村・特別区部の親は都道府県、行政区の親はその市、特別区の親は特別区部（13100）。全国は NULL"
      - name: industry_code
        description: "産業大分類コード。AR=全産業（公務を除く）、AB=農林漁業、CR=非農林漁業、C〜R=大分類、G1/G2・O1/O2・Q1/Q2・R1/R2=大分類の内訳。総数と大分類と内訳が同じ列に混在する"
      - name: industry_name
        description: "industry_code に対応する産業の名称"
      - name: industry_level
        description: "産業分類の階層の深さ。1=全産業・農林漁業・非農林漁業、2=大分類（鉱業〜サービス業の16区分）、3=大分類の内訳。重複なく全産業を覆うのは AB と industry_level = 2 の16区分を合わせた17区分"
      - name: parent_industry
        description: "1つ上の階層の industry_code。大分類の親は CR、内訳の親はその大分類。AR・AB・CR は NULL"
      - name: organization_code
        description: "経営組織コード。0=総数、1=個人、2=会社、3=会社以外の法人、S1=（別掲）外国の会社、S2=（別掲）法人でない団体。総数 = 個人 + 会社 + 会社以外の法人で、S1・S2 は内数の別掲"
      - name: organization
        description: "organization_code に対応する経営組織の名称"
      - name: is_reprint
        description: "別掲（S1 外国の会社・S2 法人でない団体）なら真。総数の内数を数え直した行で、総数に足すと二重に数える"
      - name: establishments
        description: "民営事業所数（事業所）。この集計の対象事業所数で、事業所に関する集計の民営事業所数とは母数が違う"
      - name: employees
        description: "従業者数（人）"
      - name: sales_million_yen
        description: "売上（収入）金額（百万円）。産業によって調査されていないため NULL が入る"
      - name: employees_per_establishment
        description: "1事業所当たり従業者数（人）"
      - name: sales_per_establishment_10k_yen
        description: "1事業所当たり売上（収入）金額（万円）。sales_million_yen ÷ establishments で割り直した値とは一致しない（原典の分母が違う）"
      - name: sales_per_employee_10k_yen
        description: "従業者1人当たり売上（収入）金額（万円）。sales_million_yen ÷ employees で割り直した値とは一致しない（原典の分母が違う）"

  - name: retail_municipality
    description: |
      令和3年経済センサス‐活動調査 卸売業，小売業に関する集計 産業編（市区町村表）から、
      全国・都道府県・市区町村ごとの小売業の事業所数・従業者数・年間商品販売額・売場面積を
      産業中分類別に集計した表。2021年6月1日現在、年間商品販売額は2020年1年間。
      1地域につき 小売業計と中分類6区分 = 7行で、地域は1,966。
      管理，補助的経済活動のみを行う事業所・格付不能の事業所などを除く集計対象で、全国の
      小売業計は事業所数 755,015・年間商品販売額 133,257,457 百万円。総括表（事業所数 880,031・
      年間商品販売額 138,180,412 百万円）とは母数が違う。年間商品販売額と売場面積は秘匿の区分が
      NULL になる。
      area は establishment_industry・code.municipality と同じ標準地域コード(5桁)。
      出典: 総務省・経済産業省 令和3年経済センサス‐活動調査 卸売業，小売業に関する集計
      産業編（市区町村表）第1表・第2表。
      https://www.e-stat.go.jp/
    access: public
    columns:
      - name: area
        description: "標準地域コード。全国は 00000、都道府県は 13000 のように市区町村部が 000。establishment_industry の area・code.municipality の area_code と同じ体系"
      - name: area_name
        description: "地域の名称（全国／東京都／特別区部／千代田区／札幌市／札幌市中央区 など）"
      - name: area_level
        description: "area の粒度。national=全国（1）、prefecture=都道府県（47）、municipality=市・町村・特別区部（1,719）、ward=政令指定都市の行政区・特別区・境界未定地域（199）。日本全域をちょうど1回覆うのは prefecture だけ、または municipality だけ。ward は municipality の内訳で、足すと二重に数える"
      - name: parent_area
        description: "1つ上の階層の area。都道府県の親は全国、市・町村・特別区部の親は都道府県、行政区の親はその市、特別区の親は特別区部（13100）。全国は NULL"
      - name: industry_code
        description: "産業分類コード。I2=小売業計、56〜61=中分類（各種商品／織物・衣服・身の回り品／飲食料品／機械器具／その他／無店舗）。総数と中分類が同じ列に混在する"
      - name: industry_name
        description: "industry_code に対応する産業の名称"
      - name: industry_level
        description: "1=小売業計、2=中分類6区分。中分類6区分の和が小売業計に一致する"
      - name: parent_industry
        description: "中分類の親は I2。I2 は NULL"
      - name: establishments
        description: "事業所数（事業所）。総括表の小売業事業所数とは母数が違う。該当が無い区分は 0"
      - name: employees
        description: "従業者数（人）。該当が無い区分は 0"
      - name: sales_million_yen
        description: "年間商品販売額（百万円）。2020年1年間。秘匿された区分は NULL、事業所が無い区分は 0"
      - name: floor_area_m2
        description: "売場面積（m2）。秘匿された区分は NULL、事業所が無い区分は 0。無店舗小売業（61）は常に NULL"

  - name: shopping_district
    description: |
      令和3年経済センサス‐活動調査 立地環境特性編から、全国の商業集積地区（商店街）12,535地区
      ごとの小売業・飲食サービス業・生活関連サービス業の事業所数・従業者数・売上（収入）金額と
      小売業の売場面積を収録した表。全国・都道府県・市区町村・区ごとの商業集積地区の計の行も
      持つ。2021年6月1日現在、売上（収入）金額は2020年1年間。地区の位置（座標・町丁目）は無く、
      名前と市区町村（area）だけで特定する。売上（収入）金額と売場面積は秘匿の地区が NULL になる。
      area は retail_municipality・code.municipality と同じ標準地域コード(5桁)。
      出典: 総務省・経済産業省 令和3年経済センサス‐活動調査 立地環境特性編
      商業集積地区（商店街）別の表。
      https://www.e-stat.go.jp/
    access: public
    columns:
      - name: district_code
        description: "商業集積地区コード（8桁）。上5桁が area、下3桁が市区町村の中の地区の番号。計の行は下3桁が 000"
      - name: district_name
        description: "地区の名称（銀座地域／新宿駅西口／本町商店街 など）。計の行は「東京都計」「千代田区計」のような名称"
      - name: district_level
        description: "national=全国の計、prefecture=都道府県の計、municipality=市・町村・特別区部の計、ward=政令指定都市の区・特別区の計、district=商業集積地区。district だけ、または municipality だけを足すと全国の計に一致する（事業所数・大規模小売店舗内事業所数・従業者数）"
      - name: area
        description: "地区を含む市区町村（政令指定都市と特別区部では区）の標準地域コード。計の行はその地域自身のコード"
      - name: parent_district_code
        description: "1つ上の計の行の district_code。全国は NULL"
      - name: district_type_code
        description: "立地環境特性の細分類。11=駅周辺型、12=市街地型、13=住宅地背景型、14=ロードサイド型、15=その他。計の行は NULL"
      - name: district_type
        description: "district_type_code の名称"
      - name: industry_code
        description: "I2=小売業計、M2=飲食サービス業計、N=生活関連サービス業計"
      - name: industry_name
        description: "industry_code に対応する産業の名称"
      - name: establishments
        description: "事業所数（事業所）。該当が無い区分は 0"
      - name: establishments_in_large_stores
        description: "大規模小売店舗（店舗面積 1,000m2 超）内の事業所数（事業所）。establishments の内数"
      - name: employees
        description: "従業者数（人）。臨時雇用者を含む。該当が無い区分は 0"
      - name: sales_million_yen
        description: "売上（収入）金額（百万円）。2020年1年間。小売業も年間商品販売額ではない。秘匿された区分は NULL、事業所が無い区分は 0"
      - name: floor_area_m2
        description: "小売業の売場面積（m2）。法人組織の事業所だけの値。秘匿された地区と、事業所があっても「-」（該当数字なし）の地区は NULL、事業所が無い地区は 0。飲食サービス業・生活関連サービス業は NULL"

  - name: establishment_mesh_1km
    description: |
      平成28年経済センサス‐活動調査 1kmメッシュ（3次メッシュ）別の
      産業大分類別 事業所数・従業者数（縦持ち）。事業所の所在地で数える従業地ベース。
      cat01 に産業と「事業所数／従業者数」の別が入り、0010 が全産業の事業所数、
      0200 が全産業の従業者数。全産業は A～R（S 公務を除く）。
      出典: 総務省・経済産業省 平成28年経済センサス‐活動調査に関する地域メッシュ統計。
      https://www.e-stat.go.jp/
    access: public
    columns:
      - name: mesh_code
        description: "3次メッシュコード（8桁）。境界データ mesh_1km の mesh_code と結合できる"
      - name: mesh1_code
        description: "mesh_code の上4桁（1次メッシュ）"
      - name: cat01
        description: "産業大分類×事業所数／従業者数の区分コード。0010 全産業の事業所数、0200 全産業の従業者数"
      - name: category
        description: "cat01 に対応する区分名"
      - name: unit
        description: "単位（事業所または人）"
      - name: value
        description: "事業所数または従業者数"

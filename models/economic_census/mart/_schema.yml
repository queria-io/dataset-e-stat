version: 2

models:
  - name: establishment_industry
    description: |
      令和3年経済センサス‐活動調査 産業横断的集計「売上（収入）金額等」から、
      全国・都道府県・市区町村ごとの民営事業所数・従業者数・売上（収入）金額を
      産業大分類別・経営組織別に集計した表。2021年6月1日現在。
      1地域につき 産業27区分 × 経営組織6区分 = 162行で、地域は1,966。
      事業所数はこの集計の対象事業所数で、事業所に関する集計の民営事業所数
      (全国5,156,063)とは母数が違う。売上（収入）金額は産業によって調査されて
      いないため、建設業・運輸業・金融保険業などと全産業の合計は NULL になる。
      area は census_municipality・code.municipality と同じ標準地域コード(5桁)。
      出典: 総務省・経済産業省 令和3年経済センサス‐活動調査
      事業所に関する集計 産業横断的集計 売上（収入）金額等（第2-1表）。
      https://www.e-stat.go.jp/
    access: public
    columns:
      - name: area
        description: "標準地域コード。全国は 00000、都道府県は 13000 のように市区町村部が 000。census_municipality の area・code.municipality の area_code と同じ体系"
      - name: area_name
        description: "地域の名称（全国／東京都／特別区部／千代田区／札幌市／札幌市中央区 など）"
      - name: area_level
        description: "area の粒度。national=全国（1）、prefecture=都道府県（47）、municipality=市・町村・特別区部（1,719）、ward=政令指定都市の行政区・特別区・境界未定地域（199）。日本全域をちょうど1回覆うのは prefecture だけ、または municipality だけ。ward は municipality の内訳で、足すと二重に数える"
      - name: parent_area
        description: "1つ上の階層の area。都道府県の親は全国、市・町村・特別区部の親は都道府県、行政区の親はその市、特別区の親は特別区部（13100）。全国は NULL"
      - name: industry_code
        description: "産業大分類コード。AR=全産業（公務を除く）、AB=農林漁業、CR=非農林漁業、C〜R=大分類、G1/G2・O1/O2・Q1/Q2・R1/R2=大分類の内訳。総数と大分類と内訳が同じ列に混在する"
      - name: industry_name
        description: "industry_code に対応する産業の名称"
      - name: industry_level
        description: "産業分類の階層の深さ。1=全産業・農林漁業・非農林漁業、2=大分類（鉱業〜サービス業の16区分）、3=大分類の内訳。重複なく全産業を覆うのは AB と industry_level = 2 の16区分を合わせた17区分"
      - name: parent_industry
        description: "1つ上の階層の industry_code。大分類の親は CR、内訳の親はその大分類。AR・AB・CR は NULL"
      - name: organization_code
        description: "経営組織コード。0=総数、1=個人、2=会社、3=会社以外の法人、S1=（別掲）外国の会社、S2=（別掲）法人でない団体。総数 = 個人 + 会社 + 会社以外の法人で、S1・S2 は内数の別掲"
      - name: organization
        description: "organization_code に対応する経営組織の名称"
      - name: is_reprint
        description: "別掲（S1 外国の会社・S2 法人でない団体）なら真。総数の内数を数え直した行で、総数に足すと二重に数える"
      - name: establishments
        description: "民営事業所数（事業所）。この集計の対象事業所数で、事業所に関する集計の民営事業所数とは母数が違う"
      - name: employees
        description: "従業者数（人）"
      - name: sales_million_yen
        description: "売上（収入）金額（百万円）。産業によって調査されていないため NULL が入る"
      - name: employees_per_establishment
        description: "1事業所当たり従業者数（人）"
      - name: sales_per_establishment_10k_yen
        description: "1事業所当たり売上（収入）金額（万円）。sales_million_yen ÷ establishments で割り直した値とは一致しない（原典の分母が違う）"
      - name: sales_per_employee_10k_yen
        description: "従業者1人当たり売上（収入）金額（万円）。sales_million_yen ÷ employees で割り直した値とは一致しない（原典の分母が違う）"

  - name: establishment_mesh_1km
    description: |
      平成28年経済センサス‐活動調査 1kmメッシュ（3次メッシュ）別の
      産業大分類別 事業所数・従業者数（縦持ち）。事業所の所在地で数える従業地ベース。
      cat01 に産業と「事業所数／従業者数」の別が入り、0010 が全産業の事業所数、
      0200 が全産業の従業者数。全産業は A～R（S 公務を除く）。
      出典: 総務省・経済産業省 平成28年経済センサス‐活動調査に関する地域メッシュ統計。
      https://www.e-stat.go.jp/
    access: public
    columns:
      - name: mesh_code
        description: "3次メッシュコード（8桁）。境界データ mesh_1km の mesh_code と結合できる"
      - name: mesh1_code
        description: "mesh_code の上4桁（1次メッシュ）"
      - name: cat01
        description: "産業大分類×事業所数／従業者数の区分コード。0010 全産業の事業所数、0200 全産業の従業者数"
      - name: category
        description: "cat01 に対応する区分名"
      - name: unit
        description: "単位（事業所または人）"
      - name: value
        description: "事業所数または従業者数"

schema: economic_census
name: retail_municipality
title: 市区町村別 小売業の事業所数・従業者数・年間商品販売額・売場面積（令和3年経済センサス）
description: |-
  令和3年経済センサス‐活動調査の、全国・都道府県・市区町村ごとの小売業の事業所数・従業者数・年間商品販売額・売場面積を、産業中分類別に持つテーブルです。

  - 集計対象を絞った値で、総括表の小売業の事業所数・販売額より小さくなります
  - 秘匿の年間商品販売額と売場面積は NULL です
  - 小売業計（I2）と中分類、地域の粒度が同じ列に並ぶので、絞ってから合計してください
keywords:
  - e-stat
  - 経済センサス
  - 小売業
  - 年間商品販売額
  - 売場面積
  - 事業所
  - 従業者数
  - 市区町村
  - 都道府県
published: true
themes: [economy]
temporal_coverage: { start: "2020", end: "2021" }
sources:
  - path: https://www.e-stat.go.jp/statistics/00200553
fields:
  - name: area
    title: 標準地域コード（5桁）
    description: 標準地域コード。全国は 00000、都道府県は 13000 のように市区町村部が 000。establishment_industry・census_municipality の area・code.municipality の area_code と同じ体系
    semantic: { role: entity, name: city }
  - name: area_name
    title: 地域名
    description: 地域の名称（全国／東京都／特別区部／千代田区／札幌市／札幌市中央区 など）
  - name: area_level
    title: 地域の粒度
    description: 'area の粒度。national=全国（1）、prefecture=都道府県（47）、municipality=市・町村・特別区部（1,719）、ward=政令指定都市の行政区・特別区・境界未定地域（199）。日本全域をちょうど1回覆うのは prefecture だけ、または municipality だけで、どちらも小売業計の事業所数が全国の 755,015 に一致する。ward は municipality の内訳で、足すと二重に数える'
  - name: parent_area
    title: 上位地域の標準地域コード
    description: 1つ上の階層の area。都道府県の親は全国、市・町村・特別区部の親は都道府県、行政区の親はその市、特別区の親は特別区部（13100）。全国は NULL
  - name: industry_code
    title: 産業分類コード
    description: I2=小売業計、56=各種商品小売業、57=織物・衣服・身の回り品小売業、58=飲食料品小売業、59=機械器具小売業、60=その他の小売業、61=無店舗小売業。総数と中分類が同じ列に混在する
  - name: industry_name
    title: 産業分類
    description: industry_code に対応する産業の名称
  - name: industry_level
    title: 産業分類の階層
    description: 1=小売業計（I2）、2=中分類6区分。中分類6区分の和が小売業計に一致する
  - name: parent_industry
    title: 上位産業のコード
    description: 中分類の親は I2。I2 は NULL
  - name: establishments
    title: 事業所数
    description: 事業所数（事業所）。管理，補助的経済活動のみを行う事業所・格付不能の事業所などを除く集計対象で、同じ調査の総括表の小売業事業所数（全国880,031）とは母数が違う。該当が無い区分は 0
  - name: employees
    title: 従業者数
    description: 従業者数（人）。2021年6月1日現在。該当が無い区分は 0
  - name: sales_million_yen
    title: 年間商品販売額
    description: 年間商品販売額（百万円）。2020年1年間。秘匿された区分は NULL、事業所が無い区分は 0
  - name: floor_area_m2
    title: 売場面積
    description: 売場面積（m2）。2021年6月1日現在。秘匿された区分は NULL、事業所が無い区分は 0。無店舗小売業（61）は常に NULL

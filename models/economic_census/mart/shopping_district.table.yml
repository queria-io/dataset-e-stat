schema: economic_census
name: shopping_district
title: 商業集積地区（商店街）別 小売業・飲食サービス業・生活関連サービス業の事業所数・従業者数・売上金額（令和3年経済センサス）
description: |-
  令和3年経済センサス‐活動調査 立地環境特性編から、全国の商業集積地区（商店街）12,535地区
  ごとの小売業・飲食サービス業・生活関連サービス業の事業所数・従業者数・売上（収入）金額と、
  小売業の売場面積を収録する。2021年6月1日現在、売上（収入）金額は2020年1年間。
  地区のほかに、全国・都道府県・市区町村・区ごとの商業集積地区の計の行もある。
  1地区（計）につき 小売業計（I2）・飲食サービス業計（M2）・生活関連サービス業計（N）の3行。

  商業集積地区は商店街を形成している地区で、概ね1つの商店街（小売業・飲食店・サービス業の
  事業所が近接して30店舗以上集積しているもの）を1地区とする。ショッピングセンターや駅ビルも
  原則として1地区になる。district_type_code は立地環境特性の細分類（11 駅周辺型・12 市街地型・
  13 住宅地背景型・14 ロードサイド型・15 その他）。
  地区の位置（座標・境界・町丁目）は原典に無い。地区は名前（銀座地域・新宿駅西口・本町商店街
  など）と、それが計上された市区町村（area）でしか特定できない。同じ名前の地区がほかの
  市区町村にもある（本町商店街は94地区）ので、名前で結合するときは area もそろえる。
  市区町村を跨ぐ地区も、どれか1つの市区町村に計上されている。

  集計対象は立地環境特性編の対象事業所（管理，補助的経済活動のみを行う事業所・格付不能の
  事業所などを除く）。全国の地区の計は、小売業が事業所数 259,039・従業者数 2,316,334・
  売上（収入）金額 49兆8,238億円・売場面積 54,794,283m2、飲食サービス業が事業所数 188,254・
  売上（収入）金額 5兆7,371億円、生活関連サービス業が事業所数 93,803・売上（収入）金額
  2兆5,367億円。立地環境特性編の小売業全体（事業所数 755,015・売上（収入）金額 146兆5,317億円）
  のうち、商業集積地区にある分を表す。小売業の金額は年間商品販売額ではなく売上（収入）金額で、
  従業者数は臨時雇用者を含むので、retail_municipality（年間商品販売額）とは比べられない。
  事業所数と売場面積は retail_municipality と同じ母数。

  総数と内訳が同じ列に縦に並ぶので、絞らずに合計すると二重に数える。district_level が
  'district' の行だけ、または 'municipality' の行だけを足すと全国の計に一致する（事業所数・
  従業者数）。'ward' は政令指定都市と特別区部の内訳で、その地区は区の下に入る。
  商業集積地区が1つも無い市区町村は行が無い（地区のある市区町村は1,334）。

  事業所数・大規模小売店舗内事業所数・従業者数は秘匿が無く、該当数字なし（「-」）は 0 で入る。
  子の和は親の計に一致する。売上（収入）金額と売場面積は、集計対象の事業所が1か2の地区と、
  差し引きでそれが分かる地区が秘匿（「x」）されて NULL になる。事業所のある地区のうち売上が NULL なのは、小売業 605/12,473（4.9%）・
  飲食サービス業 2,357/11,875（19.8%）・生活関連サービス業 2,787/11,840（23.5%）。
  小売業の売場面積が NULL の地区は 996。売場面積は事業所があっても「-」（該当数字なし）の地区が
  あり、これも秘匿と区別できずに NULL で入る（996 のうち少なくとも 444 は、計から分かっている
  地区を引くと 0 になる）。事業所が無い区分は 0。市区町村の計は秘匿がほとんど
  無いので、市区町村ごとに比べるときは計の行を使う。売上（収入）金額は原典が地区ごとに
  丸めているため、地区の和が計と最大で（地区数 + 1）× 0.5 百万円ずれる。

  area は上位の市区町村・区の標準地域コード（5桁）で、retail_municipality・
  establishment_industry・code.municipality の area_code と同じ体系。全国地方公共団体コード
  （6桁）とは別体系なので、lg_code や address_br と結合するときは桁と体系を揃える。
  出典: 総務省・経済産業省 令和3年経済センサス‐活動調査 立地環境特性編
  「商業集積地区（商店街）の小売業・飲食サービス業・生活関連サービス業別、都道府県別、
  市区町村別の商店街数、事業所数、大規模小売店舗数、大規模小売店舗内事業所数、従業者数、
  売上（収入）金額及び売場面積」。
  https://www.e-stat.go.jp/statistics/00200553

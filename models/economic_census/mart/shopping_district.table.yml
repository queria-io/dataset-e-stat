fields:
  - name: district_code
    title: 商業集積地区コード（8桁）
    description: 上5桁が area（標準地域コード）、下3桁が市区町村の中の地区の番号。計の行は下3桁が 000（全国 00000000、東京都 13000000、特別区部 13100000、千代田区 13101000 など）
  - name: district_name
    title: 商業集積地区名
    description: 地区の名称（銀座地域／新宿駅西口／本町商店街 など）。計の行は「東京都計」「千代田区計」のような名称。原典の名前の末尾にある立地環境特性の番号（【11】など）は district_type_code に移してある
  - name: district_level
    title: 行の粒度
    description: 'national=全国の計（1）、prefecture=都道府県の計（47）、municipality=市・町村・特別区部の計（1,334）、ward=政令指定都市の区・特別区の計（197）、district=商業集積地区（12,535）。district だけ、または municipality だけを足すと全国の計に一致する'
  - name: area
    title: 標準地域コード（5桁）
    description: 地区を含む市区町村（政令指定都市と特別区部では区）の標準地域コード。計の行はその地域自身のコード（全国 00000、都道府県 13000 など）。retail_municipality・establishment_industry の area・code.municipality の area_code と同じ体系
    semantic: { role: entity, name: city }
  - name: parent_district_code
    title: 上位の district_code
    description: 1つ上の計の行。地区の親は市区町村の計か区の計、区の親は政令指定都市・特別区部の計、市区町村の親は都道府県の計、都道府県の親は全国の計。全国は NULL
  - name: district_type_code
    title: 立地環境特性（細分類）コード
    description: 11=駅周辺型、12=市街地型、13=住宅地背景型、14=ロードサイド型、15=その他。計の行は NULL
  - name: district_type
    title: 立地環境特性（細分類）
    description: district_type_code の名称（駅周辺型商業集積地区 など）
  - name: industry_code
    title: 産業分類コード
    description: I2=小売業計、M2=飲食サービス業計、N=生活関連サービス業計。互いに重ならない
  - name: industry_name
    title: 産業分類
    description: industry_code に対応する産業の名称
  - name: establishments
    title: 事業所数
    description: 事業所数（事業所）。該当が無い区分は 0。子の和が親の計に一致する
  - name: establishments_in_large_stores
    title: 大規模小売店舗内事業所数
    description: 大規模小売店舗（店舗面積 1,000m2 超）の中にある事業所数（事業所）。establishments の内数。該当が無い区分は 0
  - name: employees
    title: 従業者数
    description: 従業者数（人）。2021年6月1日現在。臨時雇用者を含む。該当が無い区分は 0
  - name: sales_million_yen
    title: 売上（収入）金額
    description: 売上（収入）金額（百万円）。2020年1年間。小売業も年間商品販売額ではなく売上（収入）金額で、retail_municipality の sales_million_yen とは別の項目。秘匿された区分は NULL、事業所が無い区分は 0
  - name: floor_area_m2
    title: 売場面積
    description: 小売業の売場面積（m2）。2021年6月1日現在。法人組織の事業所だけの値。秘匿された地区と、事業所があっても「-」の地区は NULL、事業所が無い地区は 0。飲食サービス業・生活関連サービス業は常に NULL

schema: economic_census
name: establishment_industry
title: 市区町村別 産業大分類別の事業所数・従業者数・売上金額（令和3年経済センサス）
description: |-
  令和3年経済センサス‐活動調査 産業横断的集計「売上（収入）金額等」から、全国・都道府県・
  市区町村ごとの民営事業所数・従業者数・売上（収入）金額を産業大分類別・経営組織別に
  集計した表。2021年6月1日現在。
  1地域につき 産業27区分 × 経営組織6区分 = 162行の縦持ちで、地域は1,966。
  国勢調査の census_small_area_industry が常住地ベース（住民がどの産業で働くか）なのに対し、
  こちらは従業地ベース（事業所がどの産業か）で、産業構造の供給側を表す。

  事業所数の母数がほかの表と違う。この表の全国・全産業の事業所数は 4,870,898 で、
  事業所に関する集計の民営事業所数 5,156,063 とは一致しない。売上（収入）金額等の集計は
  必要な事項の数値が得られた事業所だけを対象にするため、母数が約5.5%小さい。事業所数を
  ほかの統計表と突き合わせる用途には使えない。

  売上（収入）金額は産業によって調査されていない。建設業・電気ガス熱供給水道業・
  情報通信業・運輸業郵便業・金融業保険業・教育学習支援業・複合サービス事業・
  サービス業（他に分類されないもの）は NULL で、内訳の一部が欠けるため全産業（AR）と
  非農林漁業（CR）の売上も NULL になる。売上が入るのは農林漁業・鉱業・製造業・
  卸売業小売業・不動産業物品賃貸業・学術研究専門技術サービス業・宿泊業飲食サービス業・
  生活関連サービス業娯楽業・医療福祉と、G2・O2・Q2・R2 の内訳。
  事業所数と従業者数は全産業で揃っている。

  総数と内訳が同じ列に縦に並ぶ軸が3つあるので、絞らずに合計すると何重にも数える。
  産業は industry_level = 2 の16区分に AB（農林漁業）を足した17区分が重複のない全産業で、
  その和が AR に一致する。経営組織は organization_code = '0'（総数）が
  個人・会社・会社以外の法人の和で、is_reprint が真の2区分は内数の別掲。
  地域は area_level = 'prefecture' だけ、または area_level = 'municipality' だけが
  日本全域をちょうど1回覆う。特別区は 'ward' に入り、その親「特別区部」（13100）が
  'municipality' に立つ。特別区部には23区のほかに境界未定地域（13199）も含まれる。

  原典が「-」（該当数字なし）・「･･･」（調査していないもの）・「X」（秘匿）の区分は NULL に
  なり、3つの意味は区別できない。売上（収入）金額は原典が区分ごとに丸めているため、
  内訳の和が総数と最大1百万円ずれる産業がある。
  1事業所当たり売上（収入）金額と従業者1人当たり売上（収入）金額は、この表の事業所数・
  従業者数で割り直した値とは一致しない（原典の分母が違い、6万行のうち一致するのは
  1.4万行未満。中央値で約3.4%大きい）。1事業所当たり従業者数は従業者数÷事業所数に一致する。

  area は census_municipality・census_small_area_* の市区町村行・code.municipality の
  area_code と同じ標準地域コード（5桁）。全国地方公共団体コード（6桁）とは別体系なので、
  lg_code や address_br と結合するときは桁と体系を揃える。
  出典: 総務省・経済産業省 令和3年経済センサス‐活動調査 事業所に関する集計
  産業横断的集計 売上（収入）金額等（第2-1表）。
  https://www.e-stat.go.jp/
keywords:
  - e-stat
  - 経済センサス
  - 事業所
  - 従業者数
  - 売上高
  - 産業分類
  - 市区町村
  - 都道府県
published: true
sources:
  - path: https://www.e-stat.go.jp/statistics/00200553
fields:
  - name: area
    title: 標準地域コード（5桁）
    description: 標準地域コード。全国は 00000、都道府県は 13000 のように市区町村部が 000。census_municipality の area・code.municipality の area_code と同じ体系
    semantic: { role: entity, name: city }
  - name: area_name
    title: 地域名
    description: 地域の名称（全国／東京都／特別区部／千代田区／札幌市／札幌市中央区 など）
  - name: area_level
    title: 地域の粒度
    description: 'area の粒度。national=全国（1）、prefecture=都道府県（47）、municipality=市・町村・特別区部（1,719）、ward=政令指定都市の行政区・特別区・境界未定地域（199）。日本全域をちょうど1回覆うのは prefecture だけ、または municipality だけで、どちらも全産業の事業所数が全国の 4,870,898 に一致する。ward は municipality の内訳で、足すと二重に数える'
  - name: parent_area
    title: 上位地域の標準地域コード
    description: 1つ上の階層の area。都道府県の親は全国、市・町村・特別区部の親は都道府県、行政区の親はその市、特別区の親は特別区部（13100）。全国は NULL
  - name: industry_code
    title: 産業大分類コード
    description: 産業大分類のコード。AR=全産業（公務を除く）、AB=農林漁業、CR=非農林漁業、C〜R=大分類（鉱業／建設業／製造業／…／サービス業）、G1・G2・O1・O2・Q1・Q2・R1・R2=大分類の内訳。総数と大分類と内訳が同じ列に混在する
  - name: industry_name
    title: 産業大分類
    description: industry_code に対応する産業の名称
  - name: industry_level
    title: 産業分類の階層
    description: 産業分類の階層の深さ。1=全産業（AR）・農林漁業（AB）・非農林漁業（CR）、2=大分類16区分、3=大分類の内訳8区分。重複なく全産業を覆うのは AB と industry_level = 2 の16区分を合わせた17区分で、その和が AR に一致する
  - name: parent_industry
    title: 上位産業のコード
    description: 1つ上の階層の industry_code。大分類の親は CR、内訳の親はその大分類。AR・AB・CR は NULL
  - name: organization_code
    title: 経営組織コード
    description: 経営組織のコード。0=総数、1=個人、2=会社、3=会社以外の法人、S1=（別掲）外国の会社、S2=（別掲）法人でない団体。総数 = 個人 + 会社 + 会社以外の法人が事業所数・従業者数の全行で成り立つ
  - name: organization
    title: 経営組織
    description: organization_code に対応する経営組織の名称
  - name: is_reprint
    title: 別掲かどうか
    description: 別掲（S1 外国の会社・S2 法人でない団体）なら真。総数の内数を数え直した行で、総数と足すと二重に数える
  - name: establishments
    title: 民営事業所数
    description: 民営事業所数（事業所）。売上（収入）金額等の集計対象で、事業所に関する集計の民営事業所数（全国5,156,063）とは母数が違う
  - name: employees
    title: 従業者数
    description: 従業者数（人）。2021年6月1日現在
  - name: sales_million_yen
    title: 売上（収入）金額
    description: 売上（収入）金額（百万円）。産業によって調査されていないため NULL が入る
  - name: employees_per_establishment
    title: 1事業所当たり従業者数
    description: 1事業所当たり従業者数（人）
  - name: sales_per_establishment_10k_yen
    title: 1事業所当たり売上（収入）金額
    description: 1事業所当たり売上（収入）金額（万円）。sales_million_yen ÷ establishments で割り直した値とは一致しない（原典の分母が違う）
  - name: sales_per_employee_10k_yen
    title: 従業者1人当たり売上（収入）金額
    description: 従業者1人当たり売上（収入）金額（万円）。sales_million_yen ÷ employees で割り直した値とは一致しない（原典の分母が違う）

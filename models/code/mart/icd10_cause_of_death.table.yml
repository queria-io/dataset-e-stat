schema: code
name: icd10_cause_of_death
title: 疾病、傷害及び死因の統計分類（死因分類）
description: |-
  人口動態統計などの集計に使う死因分類表を、3つの版（2013年版・2003年版・1994年）ごとに持つテーブルです。

  - 各項目がどの基本分類のコードを含むかは icd10_codes にあります
  - 項目には中間の項目とその内訳が並ぶので、合計するときは parent_code で1つの階層に絞ってください
keywords:
  - e-stat
  - ICD-10
  - 死因分類
  - 死因コード
  - 人口動態統計
published: true
themes: [social_security_health]
primary_key: [revision, code]
sources:
  - path: https://www.e-stat.go.jp/classifications/terms/60
fields:
  - name: revision
    title: 版（2013 / 2003 / 1994）
    description: 分類の版。ICD-10 の版に対応する。結合では必ずこの列を揃える
  - name: code
    title: 分類コード
    description: 5桁の分類コード。下3桁が 000 の行が章、下2桁が 00 の行が中間の項目
  - name: name
    title: 項目名
    description: 分類項目の名称
  - name: parent_code
    title: 1つ上の項目のコード（章は NULL）
    description: 1つ上の項目のコード。内訳の項目は中間の項目（下2桁が 00）、中間の項目は章（下3桁が 000）。中間の項目が無い内訳は章が入る。章は NULL
  - name: icd10_codes
    title: 含む基本分類のコード
    description: この項目に含まれる基本分類（code.icd10）のコードの範囲の原文（A00-B99 など）。複数の範囲はカンマで区切って並び、「の残り」のような書き方もある

schema: code
name: municipality
title: 統計に用いる標準地域コード
description: |-
  統計に用いる標準地域コードの現行一覧。都道府県・郡・市区町村を 5 桁の
  標準地域コード (area_code) で収録する。国勢調査小地域・境界データ・社会人口
  統計体系 (SSDS) など本データセットの各テーブルが用いる地域コードと同体系で、
  コードから名称・よみがなを引くマスタとして使える。
  全国地方公共団体コード (6 桁・チェックデジット付き) とは別体系。

  都道府県・政令指定都市・行政区・郡/振興局/支庁・市区町村が同一テーブルに
  同居しているため、どの階層の行かは area_kind で判別する。市区町村として
  数える行は is_municipality が真の行 (政令指定都市を 1 団体として数え、
  行政区は数えない)。東京の特別区 23 は市区町村として数え、その親にあたる
  集計行「特別区部」(13100) は数えない。同じ「区」でも行政区と特別区で
  扱いが逆になる点に注意。

  出典: 総務省統計局 統計に用いる標準地域コード。
  https://www.soumu.go.jp/toukei_toukatsu/index/seido/9-5.htm
keywords:
  - e-stat
  - 標準地域コード
  - 市区町村コード
  - 都道府県
published: true
sources:
  - path: https://www.soumu.go.jp/toukei_toukatsu/index/seido/9-5.htm
fields:
  - name: area_code
    title: 標準地域コード（5桁）
    description: 統計に用いる標準地域コード（5桁）。この表の一意キーで、ssds / census / boundary の地域コードと同体系。全国地方公共団体コード（6桁・チェックデジット付き）とは別物なので、6桁のコードと突き合わせるときは桁を落として揃える
    semantic: { role: entity, name: city }
  - name: pref_code
    title: 都道府県コード（2桁）
    description: 都道府県コード（2桁）。area_code の先頭2桁
    semantic: { role: entity, name: prefecture }
  - name: pref_name
    title: 都道府県名
    description: 都道府県名
  - name: district_name
    title: 郡・振興局・政令市名（区の場合は所属市。無い場合は NULL）
    description: 元データの中間階層名をそのまま入れた列で、郡・振興局・支庁・政令指定都市のいずれかが入る（行政区の行では所属する政令市名）。用途が決まっているなら county_name / subprefecture_name / designated_city_name を使う
  - name: municipality_name
    title: 市区町村名（都道府県・郡・政令市の集計行では NULL）
    description: 市区町村名。都道府県・郡・政令市の集計行では NULL
  - name: yomigana
    title: よみがな
    description: 名称のよみがな。全角カタカナ
  - name: is_prefecture
    title: 都道府県の合計行か（コード末尾3桁が000）
    description: 都道府県の合計行かどうか（area_code の末尾3桁が 000）。area_kind = 'prefecture' と同値
  - name: area_kind
    title: 階層区分（prefecture / designated_city / ward / district / municipality）
    description: 行の階層区分。prefecture=都道府県の合計行、designated_city=政令指定都市の合計行、ward=政令市の行政区、district=郡・振興局・支庁の合計行、municipality=市町村と東京の特別区。集計行と明細行が同じ表に同居するので、絞らずに数えると重複する
  - name: is_municipality
    title: 市区町村として数える行か（政令市は1団体、行政区は数えない）
    description: 市区町村数を数えるときに1団体として数える行かどうか。政令指定都市は合計行を真・行政区を偽とし、東京の特別区23は真、その集計行「特別区部」（13100）は偽。市区町村単位の集計はこの列で絞る
  - name: county_name
    title: 郡名（郡に属さない場合は NULL。北海道は振興局・支庁で括られるため NULL）
    description: 郡名。郡に属さない場合は NULL。北海道は郡ではなく振興局・支庁で括られるため NULL になる
  - name: subprefecture_name
    title: 振興局・支庁名（北海道のみ。それ以外は NULL）
    description: 振興局・支庁名。北海道の行のみ値を持ち、それ以外は NULL
  - name: designated_city_name
    title: 政令指定都市名（政令市の集計行と行政区のみ。それ以外は NULL）
    description: 政令指定都市名。政令市の合計行とその行政区の行だけが値を持つ。行政区を市単位にまとめるときのキー
  - name: municipality_code
    title: 所属する市区町村の標準地域コード（行政区は所属市、市区町村は自分自身、集計行は NULL）
    description: 所属する市区町村の標準地域コード。行政区の行は所属する政令市のコード、市区町村の行は自分自身、都道府県・郡などの集計行は NULL。行政区単位のデータを市単位に畳むときに使う
    semantic: { role: entity, name: city }

$schema: https://tabledoc.queria.io/schemas/table/v1.json
title: 市区町村名と標準地域コードの対応（1970年4月以降の履歴）
description: |-
  市区町村の名前から、その名前が使われていた期間の標準地域コードと全国地方公共団体コードを引くテーブルです。1 行が 1 つのコードの 1 つの名前の有効期間です。e-Stat の「市区町村を探す」の一覧を、1970年4月1日と廃置分合等の施行日ごとに取得し、Queria が名前の有効期間にまとめました。

  使い方: 年度や日付と市区町村名を持つ表は、都道府県名・名前と、その日付が valid_from 以上 valid_to 未満の行で結合します。合併前の名前でも、その時点のコードと、合併後の今のコード（current_area_code）が引けます。

  ```sql
  SELECT t.*, m.lg_code, m.current_area_code
  FROM my_table t
  JOIN e_stat.code.municipality_name m
    ON m.pref_name = t.pref_name AND m.name = t.city_name
   AND t.as_of >= m.valid_from AND (m.valid_to IS NULL OR t.as_of < m.valid_to)
  ```

  - 有効期間の境目は廃置分合等の施行日です。valid_from が 1970-04-01 の行は、それより前から使われていた名前を含みます
  - 同じ都道府県に同じ名前の町村（郡が違う）や区（政令指定都市が違う。大阪府の大阪市北区と堺市北区など）が 2 つある期間があります。そのときは qualified_name（郡名・政令指定都市名を付けた名前）で結合します
  - 北海道の町村は振興局・支庁で括られ、郡名を持たないので、qualified_name は名前だけです
  - 「ヶ」と「ケ」、旧字体などの書き分けは原典のままで、正規化していません
  - 政令指定都市は市の行（area_kind = designated_city）と区の行（ward）の両方があります
topics:
  - e-stat
  - 標準地域コード
  - 全国地方公共団体コード
  - 市区町村名
  - 市町村合併
  - 廃置分合
  - 旧市町村
  - 名寄せ
primary_key: [area_code, valid_from]
sources: [cities]
columns:
  - name: name
    title: 市区町村名
    description: 市区町村名。政令指定都市の市の行は市の名前、区の行は区の名前（「中央区」）
  - name: kana
    title: 市区町村名のよみがな
    description: 市区町村名のよみがな。ひらがな
  - name: parent_name
    title: 郡名・政令指定都市名（無い場合は NULL）
    description: 町村が属する郡の名前、または区が属する政令指定都市の名前。北海道の振興局・支庁、郡に属さない市、東京の特別区、政令指定都市の市の行では NULL
  - name: parent_kana
    title: 郡名・政令指定都市名のよみがな
    description: parent_name のよみがな。ひらがな
  - name: qualified_name
    title: 郡名・政令指定都市名を付けた市区町村名
    description: parent_name と name をつないだ名前（「那珂郡大宮町」「札幌市中央区」）。parent_name が無い行は name と同じ。同じ都道府県に同じ名前の町村や区があるときの結合に使う
  - name: pref_name
    title: 都道府県名
    description: 都道府県名
  - name: pref_code
    title: 都道府県コード（2桁）
    description: area_code の先頭 2 桁
    entity: prefecture
  - name: area_code
    title: 標準地域コード（5桁）
    description: その期間の標準地域コード（5桁）。合併で使われなくなったコードも含む。soumu.code.municipality の area_code と同じ体系
  - name: lg_code
    title: 全国地方公共団体コード（6桁）
    description: area_code に検査数字を付けた全国地方公共団体コード（6桁）
  - name: area_kind
    title: 区分（municipality / designated_city / ward / district）
    description: municipality=市町村と東京の特別区、designated_city=政令指定都市の市の行、ward=政令指定都市の区、district=東京都の特別区部（13100。23 区をまとめた集計の行）
  - name: valid_from
    title: 有効期間の開始日
    description: この名前とコードの組が使われ始めた日。1970-04-01 は収録の始まりで、それより前から使われていた組を含む
  - name: valid_to
    title: 有効期間の終了日（この日を含まない。今も有効なら NULL）
    description: この名前とコードの組が使われなくなった日（廃置分合等の施行日）。この日は含まない。今も使われている組は NULL
  - name: current_area_code
    title: 今の標準地域コード（合併後のコード）
    description: このコードの今の標準地域コード。今も使われているコードは自分自身、合併・編入で使われなくなったコードは引き継いだ団体を今までたどったコード。分割などで引き継ぎ先が 1 つに決まらないときは NULL
    entity: city

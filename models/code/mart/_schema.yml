version: 2

models:
  - name: municipality
    description: |
      統計に用いる標準地域コードの現行一覧。都道府県・郡・市区町村を 5 桁の
      標準地域コード (area_code) で収録する。国勢調査小地域・境界データ・社会人口
      統計体系 (SSDS) など本データセットの各テーブルが用いる地域コードと同体系で、
      コードから名称・よみがなを引くマスタとして使える。
      全国地方公共団体コード (6 桁・チェックデジット付き) とは別体系。

      都道府県・政令指定都市・行政区・郡/振興局/支庁・市区町村が同一テーブルに
      同居しているため、どの階層の行かは area_kind で判別する。市区町村として
      数える行は is_municipality が真の行 (政令指定都市を 1 団体として数え、
      行政区は数えない)。東京の特別区 23 は市区町村として数え、その親にあたる
      集計行「特別区部」(13100) は数えない。同じ「区」でも行政区と特別区で
      扱いが逆になる点に注意。
      出典: 総務省統計局 統計に用いる標準地域コード。
      https://www.soumu.go.jp/toukei_toukatsu/index/seido/9-5.htm
    access: public
    columns:
      - name: area_code
        description: "統計に用いる標準地域コード（5桁）。この表の一意キーで、ssds / census / boundary の地域コードと同体系。全国地方公共団体コード（6桁・チェックデジット付き）とは別物なので、6桁のコードと突き合わせるときは桁を落として揃える"
        data_tests:
          - unique
          - not_null
      - name: pref_code
        description: "都道府県コード（2桁）。area_code の先頭2桁"
      - name: pref_name
        description: "都道府県名"
      - name: district_name
        description: "元データの中間階層名をそのまま入れた列で、郡・振興局・支庁・政令指定都市のいずれかが入る（行政区の行では所属する政令市名）。用途が決まっているなら county_name / subprefecture_name / designated_city_name を使う"
      - name: municipality_name
        description: "市区町村名。都道府県・郡・政令市の集計行では NULL"
      - name: yomigana
        description: "名称のよみがな。全角カタカナ"
      - name: is_prefecture
        description: "都道府県の合計行かどうか（area_code の末尾3桁が 000）。area_kind = 'prefecture' と同値"
      - name: area_kind
        description: "行の階層区分。prefecture=都道府県の合計行、designated_city=政令指定都市の合計行、ward=政令市の行政区、district=郡・振興局・支庁の合計行、municipality=市町村と東京の特別区。集計行と明細行が同じ表に同居するので、絞らずに数えると重複する"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - prefecture
                  - designated_city
                  - ward
                  - district
                  - municipality
      - name: is_municipality
        description: "市区町村数を数えるときに1団体として数える行かどうか。政令指定都市は合計行を真・行政区を偽とし、東京の特別区23は真、その集計行「特別区部」（13100）は偽。市区町村単位の集計はこの列で絞る"
        data_tests:
          - not_null
      - name: county_name
        description: "郡名。郡に属さない場合は NULL。北海道は郡ではなく振興局・支庁で括られるため NULL になる"
      - name: subprefecture_name
        description: "振興局・支庁名。北海道の行のみ値を持ち、それ以外は NULL"
      - name: designated_city_name
        description: "政令指定都市名。政令市の合計行とその行政区の行だけが値を持つ。行政区を市単位にまとめるときのキー"
      - name: municipality_code
        description: "所属する市区町村の標準地域コード。行政区の行は所属する政令市のコード、市区町村の行は自分自身、都道府県・郡などの集計行は NULL。行政区単位のデータを市単位に畳むときに使う"

  - name: municipality_change
    description: |
      統計に用いる標準地域コードの変更（廃置分合）履歴。平成19年（2007年）
      4月2日以降に生じた市区町村の合併・編入・区の再編等を、旧コードから新コード
      への対応として1件1行で収録する。改正事由 (reason) が合併・編入の内容を、
      施行年月日 (effective_date) が発効日を示す。市区町村コードを持つ既存の時系列
      （国勢調査小地域・SSDS 等）を合併をまたいで接続する横断キーとして使える。
      収録範囲は総務省が機械可読形式で提供する2007年4月2日以降のみで、平成の大合併の
      ピーク（1999〜2006年）は含まない。
      出典: 総務省統計局 統計に用いる標準地域コード（平成19年4月2日以降の変更）。
      https://www.soumu.go.jp/toukei_toukatsu/index/seido/9-5.htm
    access: public
    columns:
      - name: effective_date
        description: "変更の施行年月日。収録は2007年4月2日以降のみで、平成の大合併のピーク（1999〜2006年）は含まない"
      - name: pref_code
        description: "都道府県コード（2桁）"
      - name: pref_name
        description: "都道府県名"
      - name: old_code
        description: "変更前の標準地域コード（5桁）。新設の場合は空。旧コードの時系列を新コードに寄せるときの結合キー"
      - name: old_name
        description: "変更前の市区町村名。新設の場合は空"
      - name: new_code
        description: "変更後の標準地域コード（5桁）。code.municipality の area_code と同体系"
      - name: new_name
        description: "変更後の市区町村名。編入・合併でコードが消滅した場合は「削除」と入る"
      - name: is_code_deleted
        description: "当該コードが編入・合併で消滅したかどうか。真なら old_code は現行コード一覧に存在しない"
      - name: reason
        description: "改正事由の原文（「熊毛郡上屋久町、屋久町を合併し、屋久島町を新設」など）。合併・編入・名称変更のどれかは、この文面から読み取る"

  - name: industry
    description: |
      日本標準産業分類の分類項目の一覧。令和5年7月改定（第14回）・平成25年10月改定・
      平成19年11月改定・平成14年3月改定の4改定を、改定年 (revision) と分類コード (code)
      の組で1行ずつ収録する。大分類・中分類・小分類・細分類が同じ表に並び、どの階層かは
      level で分かる。統計や店舗データが持つ産業分類コードから名称を引いたり、細分類を
      中分類・大分類にまとめたりするときに結合する。

      同じコードでも改定によって中身が違う。令和5年改定で新しくできた細分類（5621〜5661
      の総合スーパー・コンビニエンスストア・ドラッグストアなど）もあれば、無くなった細分類も
      ある。大分類の文字も平成14年改定（A〜S）とそれ以降（A〜T）で指す産業が違う。結合する
      ときは必ず revision で改定を揃える。名称の区切りも平成25年改定までは全角カンマ「，」、
      令和5年改定は読点「、」で、名称で突き合わせると外れる。

      出典: 政府統計の総合窓口(e-Stat)（https://www.e-stat.go.jp/）統計分類・用語の検索
      「日本標準産業分類」をもとに作成。
      https://www.e-stat.go.jp/classifications/terms/10
    access: public
    columns:
      - name: revision
        description: "日本標準産業分類の改定年。2023=令和5年7月改定、2013=平成25年10月改定、2007=平成19年11月改定、2002=平成14年3月改定。コードの意味は改定ごとに違うので、結合では必ずこの列を揃える"
        data_tests:
          - not_null
      - name: level
        description: "分類の階層。major=大分類、middle=中分類、minor=小分類、detail=細分類。4つの階層が同じ表に並ぶので、件数を数えるときはこの列で1つの階層に絞る"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - major
                  - middle
                  - minor
                  - detail
      - name: code
        description: "分類コード。大分類は英字1文字、中分類は数字2桁、小分類は3桁、細分類は4桁の文字列で、先頭のゼロ（01、010、0100 など）を保つ。数値に変換すると先頭のゼロが落ちて結合できなくなる"
        data_tests:
          - not_null
      - name: name
        description: "分類項目の名称"
        data_tests:
          - not_null
      - name: parent_code
        description: "1つ上の階層の分類コード。中分類なら大分類の英字、小分類なら中分類の2桁、細分類なら小分類の3桁が入る。大分類は NULL"
      - name: major_code
        description: "その行が属する大分類の英字。大分類の行では自分自身。中分類以下を大分類にまとめるときのキー。大分類の文字は平成14年改定とそれ以降で指す産業が違う"
      - name: description
        description: "分類項目の説明の原文。何を含み何を含まないかが書かれている。大分類の行には総説が入る"
      - name: examples
        description: "この分類に含まれる事業の例の原文。「；」で区切られている"
      - name: non_examples
        description: "この分類に含まれない事業の例の原文。「；」で区切られ、移る先の分類コードが「［2423］」のように全角の角括弧で添えられている"

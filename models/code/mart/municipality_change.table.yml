schema: code
name: municipality_change
title: 標準地域コードの変更（廃置分合）履歴
description: '統計に用いる標準地域コードの変更（廃置分合）履歴。平成19年（2007年）

  4月2日以降に生じた市区町村の合併・編入・区の再編等を、旧コードから新コード

  への対応として1件1行で収録する。改正事由 (reason) が合併・編入の内容を、

  施行年月日 (effective_date) が発効日を示す。市区町村コードを持つ既存の時系列

  （国勢調査小地域・SSDS 等）を合併をまたいで接続する横断キーとして使える。

  収録範囲は総務省が機械可読形式で提供する2007年4月2日以降のみで、平成の大合併の

  ピーク（1999〜2006年）は含まない。

  出典: 総務省統計局 統計に用いる標準地域コード（平成19年4月2日以降の変更）。

  https://www.soumu.go.jp/toukei_toukatsu/index/seido/9-5.htm'
keywords:
  - e-stat
  - 標準地域コード
  - 廃置分合
  - 市町村合併
published: true
sources:
  - path: https://www.soumu.go.jp/toukei_toukatsu/index/seido/9-5.htm
fields:
  - name: effective_date
    title: 施行年月日
    description: 変更の施行年月日。収録は2007年4月2日以降のみで、平成の大合併のピーク（1999〜2006年）は含まない
  - name: pref_code
    title: 都道府県コード（2桁）
    description: 都道府県コード（2桁）
    semantic: { role: entity, name: prefecture }
  - name: pref_name
    title: 都道府県名
    description: 都道府県名
  - name: old_code
    title: 旧標準地域コード（5桁。新設の場合は空）
    description: 変更前の標準地域コード（5桁）。新設の場合は空。旧コードの時系列を新コードに寄せるときの結合キー
  - name: old_name
    title: 旧市区町村名（新設の場合は空）
    description: 変更前の市区町村名。新設の場合は空
  - name: new_code
    title: 新標準地域コード（5桁）
    description: 変更後の標準地域コード（5桁）。code.municipality の area_code と同体系
  - name: new_name
    title: 新市区町村名。編入・合併で消滅した場合は「削除」表記
    description: 変更後の市区町村名。編入・合併でコードが消滅した場合は「削除」と入る
  - name: is_code_deleted
    title: 当該コードが削除（編入・合併で消滅）されたか
    description: 当該コードが編入・合併で消滅したかどうか。真なら old_code は現行コード一覧に存在しない
  - name: reason
    title: 改正事由（合併・編入等の内容）
    description: 改正事由の原文（「熊毛郡上屋久町、屋久町を合併し、屋久島町を新設」など）。合併・編入・名称変更のどれかは、この文面から読み取る

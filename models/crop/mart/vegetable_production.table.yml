schema: crop
name: vegetable_production
title: 都道府県別の野菜の作付面積・収穫量・出荷量（野菜生産出荷統計）
description: |-
  農林水産省 作物統計調査 作況調査（野菜）の確報「野菜生産出荷統計」から、都道府県別の
  作付面積・10a当たり収量・収穫量・出荷量を、年産・品目・作型・地域ごとに1行で収録する。
  地域は全国と47都道府県。収録は2003年産〜2024年産の22年産、87,492行、41品目。
  2024年産の全国の収穫量はばれいしょ 2,295,000t、キャベツ 1,294,000t、たまねぎ 1,126,000t の順。
  キャベツの収穫量は群馬県が2003年産 200,000t → 2024年産 271,700t、茨城県が 87,000t → 98,000t。

  1品目に「計」と作型（春・夏秋・冬 など）の行が並ぶ。品目の年間の量は season = '計' だけを
  見る。作型を足すと計になる（公表の丸めで全国のキャベツは最大600tずれる）が、計と作型を
  一緒に合計すると二重に数える。subset が入る行は「うち」の内訳（トマトのうちミニトマト、
  レタスのうちサラダ菜 など）で、同じ品目・作型の subset IS NULL の行の内数。
  品目の量を比べるときは subset IS NULL に絞る。

  全都道府県を調べるのは2003・2004・2007・2010・2013・2016・2022年産だけで、それ以外の年産は
  品目ごとの主産県だけを調べる。調べていない県の値は NULL で、0 ではない。キャベツで値のある
  都道府県は全国調査の年が47、2024年産が36。調べていない県が混ざる年産は、都道府県の値を
  足しても全国にならない。主産県だけの年産の全国の値は、調べた県の結果から全国分を推計したもの
  なので、全国の値は全国の行
  （area = '00000'）で見る。

  原典の「…」（事実不詳・調査を欠く）・「－」（事実のないもの）・「X」（秘匿）・「nc」
  （計算不能）はどれも NULL になり、区別できない。
  2003年産は、2004年産の表に前年産として載る値（2003年産の都道府県別の表は上位5位しか無い）。
  みずなは2010年産から、グリーンピースは2013年産から。やまのいもは2024年産の表が無く2023年産まで、
  加工用トマトも2023年産まで。温室メロンは2005年産から。
  しょうがの2004年産は原典の表の列がずれていて前後の年とつながらないため収録しない。

  area は標準地域コード（5桁、都道府県は XX000）で、census_municipality・school_health などと
  同じ体系。原典の地域コードは年代で変わる（茨城が 08000 → 1020、N0001 が関東農政局 → 全国）
  ので、名前から振り直している。全国農業地域・農政局の行は収録しない。
  出典: 農林水産省 作物統計調査 作況調査（野菜） 確報 野菜生産出荷統計（都道府県別の作付面積、
  10a当たり収量、収穫量及び出荷量）。
  https://www.e-stat.go.jp/statistics/00500215

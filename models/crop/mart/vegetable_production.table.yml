fields:
- name: year
  title: 年産
  description: 年産（西暦4桁）。2003〜2024。その年に収穫されたもの（作型によって前年の秋に植えたものを含む）
- name: crop
  title: 品目
  description: 品目名（キャベツ、だいこん、トマト、ばれいしょ など41品目）。原典の表記のまま。ばれいしょは年によって「ばれいしょ（じゃがいも）」と書かれるのを「ばれいしょ」にそろえている
- name: season
  title: 作型
  description: 作型。計=年間の合計、ほかは春・夏・秋・冬・春夏・夏秋・秋冬・冬春・春植え・秋植え・その他・温室。品目によって分け方が違い、作型の無い品目は計だけ。作型を足すと計になるので、計と一緒に合計しない
- name: subset
  title: うち内訳
  description: 「うち」の内訳（ミニトマト、加工用トマト、ししとう、サラダ菜、ながいも）。同じ品目・作型の subset IS NULL の行の内数。品目全体の行は NULL
- name: area
  title: 地域コード
  description: 標準地域コード（5桁）。00000=全国、XX000=都道府県
  semantic: { role: entity, name: prefecture }
- name: area_name
  title: 地域名
  description: 地域名（全国、北海道、茨城県、群馬県 など）
- name: prefecture_code
  title: 都道府県コード
  description: 都道府県コード（2桁）。全国は NULL
  semantic: { role: entity, name: prefecture }
- name: planted_area_ha
  title: 作付面積
  description: 作付面積（ha）。調べていない県・事実のないものは NULL
- name: yield_kg_per_10a
  title: 10a当たり収量
  description: 10a当たり収量（kg）
- name: harvest_t
  title: 収穫量
  description: 収穫量（t）。調べていない県・事実のないものは NULL
- name: shipment_t
  title: 出荷量
  description: 出荷量（t）。収穫量のうち市場などに出したもので、自家消費などを除く

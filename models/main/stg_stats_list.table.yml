schema: main
name: stg_stats_list
title: 統計表一覧
description: 'e-Stat API getStatsList から取得した統計表情報。

  e-Stat で提供している統計表の情報（政府統計名、作成機関、統計表題名、調査年月、公開日、統計分野等）を提供する。

  API仕様: https://www.e-stat.go.jp/api/api-info/e-stat-manual3-0#api_2_1'
keywords:
  - e-stat
  - メタデータ
sources:
  - path: https://www.e-stat.go.jp/stat-search/database
fields:
  - name: id
    title: 統計表ID
    description: 統計表ID（e-Stat の statsDataId）。e-Stat API で統計表を指定するときのキーで、1つの統計表に1件
  - name: stat_code
    title: 政府統計コード
    description: '政府統計コード（8桁）。統計調査そのものの識別子で、1つの調査に多数の統計表がぶら下がる（例: 00200502 = 社会・人口統計体系）'
  - name: stat_name
    title: 政府統計名
    description: 政府統計名。stat_code に対応する統計調査の名称
  - name: gov_org_code
    title: 作成機関コード
    description: 作成機関コード。統計表を作成した府省庁の識別子
  - name: gov_org_name
    title: 作成機関名
    description: 作成機関名（総務省統計局 など）
  - name: statistics_name
    title: 提供統計名称
    description: 提供統計名称。同じ政府統計の中での提供単位（年次・調査回など）を表す名前
  - name: tabulation_category
    title: 集計分類
    description: 提供統計名称の集計分類。e-Stat の statisticsNameSpec.tabulationCategory
  - name: tabulation_sub_category
    title: 集計サブ分類
    description: 集計サブ分類。e-Stat の tabulationSubCategory1〜5 を「 > 」で連結したもので、空の階層は詰めてある
  - name: title
    title: 統計表題名
    description: 統計表題名。e-Stat の title / title.$ / tableName のうち最初に値のあるものを採っている
  - name: table_number
    title: 表番号
    description: 表番号。統計表に付された通し番号で、統計表IDとは別物
  - name: table_category
    title: 表分類
    description: 表分類。e-Stat の titleSpec.tableCategory
  - name: table_name
    title: 表名
    description: 表名。e-Stat の titleSpec.tableName
  - name: table_explanation
    title: 表の説明
    description: 表の説明。統計表に付された注記で、空のことが多い
  - name: table_sub_category
    title: 表サブ分類
    description: 表サブ分類。e-Stat の tableSubCategory1〜3 を「 > 」で連結したもので、空の階層は詰めてある
  - name: main_category_code
    title: 統計大分野コード
    description: 統計大分野コード（2桁）。e-Stat の分野分類の上位（02=人口・世帯、03=労働・賃金 など）
  - name: main_category
    title: 統計大分野
    description: 統計大分野名
  - name: sub_category_code
    title: 統計小分野コード
    description: 統計小分野コード。大分野の下位区分
  - name: sub_category
    title: 統計小分野
    description: 統計小分野名
  - name: cycle
    title: 提供周期
    description: 提供周期（年次、年度次、四半期、半期、月次、- のいずれか）
  - name: survey_date
    title: 調査年月
    description: 調査年月。YYYYMM または YYYYMM-YYYYMM 形式の文字列で、日付型ではない
  - name: open_date
    title: 公開日
    description: e-Stat に公開された日（YYYY-MM-DD 形式の文字列）
  - name: updated_date
    title: 更新日
    description: 統計表が最後に更新された日
  - name: small_area
    title: 小地域属性
    description: 小地域集計の有無フラグ（e-Stat の smallArea）。本データセットが取得している範囲では全て 0 で、判別には使えない
  - name: collect_area
    title: 集計地域区分
    description: 集計地域区分（全国／都道府県／市区町村／該当なし）。統計表がどの地域粒度まで持つかを表す
  - name: overall_total_number
    title: 総件数
    description: 当該統計表の総データ件数。e-Stat API から1回で取り切れるかの目安になる
annotations:
  queria:
    published: false

version: 2

models:
  - name: enterprise_industry
    description: |
      経済構造実態調査の企業等に関する集計1を、調査年・企業産業（小分類まで）・経営組織・表章項目ごとに縦に持つテーブルです。全国の値で、2019・2020・2022〜2025年を収録しています。
      出典: 総務省・経済産業省 経済構造実態調査。https://www.stat.go.jp/data/kkj/
    access: public
    columns:
      - name: year
        description: "調査年（西暦4桁）。前年1年間の売上・費用を、調査年の6月1日現在の企業等について集計した値。2021年は経済センサス‐活動調査の年でこの調査が無い"
      - name: industry_code
        description: "日本標準産業分類のコード（AR=全産業、A〜R=大分類、2桁=中分類、3桁=小分類）。2024年までの表は表内の通し番号を振っていたので、名称の先頭のコードに置き換えている。2024年から産業分類の改定で小分類が増えた（562 総合スーパーマーケットなど）"
      - name: industry_name
        description: "industry_code に対応する産業名。年によって読点が「，」と「、」で違う"
      - name: industry_level
        description: "産業の段。total=全産業（2019・2020年は E～R の産業計で、農林漁業・鉱業・建設業を含まない）、sector=農林漁業（AB）と非農林漁業（CR）、division=大分類、division_part=大分類の一部をまとめた区分（G1 など）、major_group=中分類、group=小分類、group_part=小分類の一部（32A など）。段の違う行が同じ列に並ぶので、段で絞ってから合計する"
      - name: organization_code
        description: "経営組織コード。0=総数、1=会社企業、2=会社以外の法人。1 の内訳が 11=株式会社・有限会社・相互会社、12=合名会社・合資会社、13=合同会社。総数と内訳が同じ列に並ぶ。個人経営は対象外"
      - name: organization
        description: "organization_code に対応する経営組織名"
      - name: measure_code
        description: "表章項目。enterprises=企業等数、sales=売上（収入）金額、merchandise_sales=年間商品販売額、wholesale_sales・retail_sales=そのうち卸売・小売販売額、total_expenses=費用総額、payroll=給与総額、taxes_and_dues=租税公課、interest_expenses=支払利息等（2020年まで）、cost_of_goods_sold=商品売上原価（2022年から）、value_added=付加価値額。原典の表章項目コードは年で振り直されているので、名前をそろえたこの列で絞る"
      - name: measure
        description: "表章項目の名称"
      - name: unit
        description: "単位。企業等数は企業等、金額は百万円"
      - name: value
        description: "値。原典の「-」（該当なし）と「x」（秘匿）はどちらも NULL"
  - name: cost_composition
    description: |
      経済構造実態調査の企業等に関する集計2を、調査年・事業区分（中分類、一部は小分類）・費用項目ごとに持つテーブルです。費用総額に占める各費用項目の割合（％）で、全国の値です。2019・2020・2022〜2025年を収録しています。
      出典: 総務省・経済産業省 経済構造実態調査。https://www.stat.go.jp/data/kkj/
    access: public
    columns:
      - name: year
        description: "調査年（西暦4桁）。前年1年間の売上・費用を、調査年の6月1日現在の企業等について集計した値。2021年は経済センサス‐活動調査の年でこの調査が無い"
      - name: business_code
        description: "事業区分のコード（日本標準産業分類の中分類、一部は小分類）。2024年までの表は表内の通し番号を振っていたので、名称の先頭のコードに置き換えている"
      - name: business_name
        description: "business_code に対応する事業区分名"
      - name: cost_item_code
        description: "費用項目のコード。2024年に一部が「1022-2024」の形に振り直されている"
      - name: cost_scope
        description: "どの事業区分の費用項目か。産業共通 はすべての事業区分に共通の項目、そのほかは特定の事業区分（電気業、卸売業、小売業 など）だけの項目。「その他」だけは NULL"
      - name: cost_item
        description: "費用項目の名称（給与総額、外注費、燃料費 など）"
      - name: share_percent
        description: "その事業区分の費用総額に占める割合（％）。事業区分ごとに足すと100になる。その事業区分に無い費用項目は NULL"
  - name: establishment_prefecture
    description: |
      経済構造実態調査の事業所に関する集計1を、調査年・都道府県・産業大分類ごとに持つテーブルです。2022〜2025年を収録しています。
      出典: 総務省・経済産業省 経済構造実態調査。https://www.stat.go.jp/data/kkj/
    access: public
    columns:
      - name: year
        description: "調査年（西暦4桁）。この表は2022年から"
      - name: area
        description: "地域コード（5桁）。00000=全国、01000〜47000=都道府県"
      - name: area_name
        description: "area に対応する地域名"
      - name: area_level
        description: "national=全国、prefecture=都道府県。全国と都道府県が同じ列に並ぶ"
      - name: industry_code
        description: "日本標準産業分類のコード（AR=全産業、AB=農林漁業、CR=非農林漁業、A〜R=大分類）。AB と CR は2024年から"
      - name: industry_name
        description: "industry_code に対応する産業名"
      - name: industry_level
        description: "total=全産業、sector=農林漁業・非農林漁業、division=大分類。段の違う行が同じ列に並ぶ"
      - name: establishments
        description: "事業所数。個人経営を含まない"
      - name: sales_million_yen
        description: "売上（収入）金額（百万円）。全産業・非農林漁業と、建設業（D）・電気・ガス・熱供給・水道業（F）・運輸業、郵便業（H）・金融業、保険業（J）の行は原典に値が無く NULL。大分類の売上を足しても全産業にはならない"

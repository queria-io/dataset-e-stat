version: 2

models:
  - name: income_class_expenditure
    description: |
      2019年全国家計構造調査 年間収入階級(44区分)別の、総世帯の1世帯当たり1か月間の消費支出と
      10大費目（縦持ち）。同じ収入階級の世帯数分布・世帯人員などを列に並べる。全国だけ。
      出典: 総務省統計局 2019年全国家計構造調査。
      https://www.e-stat.go.jp/dbview?sid=0003424577
    access: public
    columns:
      - name: area
        description: "標準地域コード（5桁）。全国 00000 だけ"
        data_tests:
          - not_null
      - name: year
        description: "調査年（2019）"
        data_tests:
          - not_null
      - name: income_class_code
        description: "年間収入階級。00 平均、01〜40 は100万円未満から2000万円以上まで、R1〜R3 は再掲"
        data_tests:
          - not_null
      - name: is_reclassified
        description: "再掲（R1〜R3）なら true"
      - name: item_code
        description: "収支項目。2101 消費支出、210101〜210110 は10大費目"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['2101', '210101', '210102', '210103', '210104', '210105', '210106', '210107', '210108', '210109', '210110']
      - name: expenditure
        description: "1世帯当たり1か月間の支出（円）"
      - name: households
        description: "世帯数分布（抽出率調整後の推計世帯数）"

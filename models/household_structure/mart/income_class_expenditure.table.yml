schema: household_structure
name: income_class_expenditure
title: 年間収入階級別 1世帯当たり1か月間の消費支出（2019年全国家計構造調査）
description: |-
  2019年全国家計構造調査の、総世帯の1か月の消費支出と10大費目を、年間収入階級別に持つテーブルです。全国の値です。

  - 再掲の収入階級（is_reclassified）を除いてから足してください
  - 消費支出と10大費目が同じ列に並びます
keywords:
  - e-stat
  - 全国家計構造調査
  - 家計
  - 消費支出
  - 年収
  - 年間収入階級
  - 10大費目
sources:
  - path: https://www.e-stat.go.jp/dbview?sid=0003424577
fields:
  - name: area
    title: 地域コード（5桁）
    description: 標準地域コード。全国 00000 だけ
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: area_name
    title: 地域名
  - name: year
    title: 調査年
    description: 西暦4桁（2019）
  - name: income_class_code
    title: 年間収入階級コード
    description: 00 平均、01 100万円未満 〜 40 2000万円以上の40区分、R1〜R3 は再掲。足し上げるときは is_reclassified が false の 01〜40 だけを使う
  - name: income_class
    title: 年間収入階級
  - name: income_lower
    title: 年間収入階級の下限（万円）
    description: この金額以上。平均の行は NULL
  - name: income_upper
    title: 年間収入階級の上限（万円）
    description: この金額未満。2000万円以上・1500万円以上（R3）と平均の行は NULL
  - name: is_reclassified
    title: 再掲か
    description: R1〜R3 の再掲の行は true。01〜40 の一部を束ねたもの
  - name: item_code
    title: 収支項目コード
    description: 2101 消費支出、210101 食料、210102 住居、210103 光熱・水道、210104 家具・家事用品、210105 被服及び履物、210106 保健医療、210107 交通・通信、210108 教育、210109 教養娯楽、210110 その他の消費支出。10大費目の和は消費支出と最大2円ずれる
  - name: item_name
    title: 収支項目
  - name: item_parent
    title: 上位の収支項目コード
    description: 10大費目は 2101（消費支出）、消費支出の行は NULL
  - name: expenditure
    title: 支出額（円）
    description: 1世帯当たり1か月間の支出（円）
  - name: sample_households
    title: 集計世帯数（概数）
    description: 集計に使った標本の世帯数。10世帯単位の概数
  - name: households
    title: 世帯数分布（推計世帯数）
    description: 抽出率で調整した推計世帯数（世帯）。比率ではない。平均（00）の行が全体の 51,229,953世帯で、01〜40 の和（51,229,954世帯）と1世帯の差で一致する。01〜40 の expenditure をこれで加重平均すると平均（00）の値になる。11項目の行に同じ値が入るので、足すときは item_code を1つに絞る
  - name: household_members
    title: 世帯人員（人）
    description: 1世帯当たりの平均世帯人員
  - name: members_under_18
    title: 18歳未満人員（人）
    description: 1世帯当たりの平均
  - name: members_65_and_over
    title: 65歳以上人員（人）
    description: 1世帯当たりの平均
  - name: earners
    title: 有業人員（人）
    description: 1世帯当たりの平均
  - name: head_age
    title: 世帯主の年齢（歳）
    description: 世帯主の平均年齢
annotations:
  queria:
    themes: [economy]

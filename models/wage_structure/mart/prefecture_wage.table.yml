schema: wage_structure
name: prefecture_wage
title: 都道府県別の賃金（一般労働者）
description: |-
  賃金構造基本統計調査の一般労働者の賃金を、都道府県別・男女別に収録する（都道府県別 参考表1）。
  所定内給与額・きまって支給する現金給与額・年間賞与その他特別給与額のほか、
  平均年齢・勤続年数・実労働時間数・労働者数が1行に並ぶ。産業計・企業規模計（10人以上）の値。
  収録は2020年〜2025年調査の6年、864行（全国+47都道府県 × 男女計・男・女 × 6年）。
  調査は毎年6月分の賃金で、年間賞与は前年1年間の支給額。
  2025年の所定内給与額は全国 340.6千円で、東京都 418.3千円が最も高く、青森県 263.9千円が最も低い。
  2020年調査で一部の調査事項と推計方法が変わり、厚生労働省はそれまでの公表値との比較には注意が必要としている。
  一般労働者は短時間労働者以外の常用労働者。短時間労働者の時給はこの表に無い。
  金額は千円単位の平均値。労働者数は推計値で、原典の十人単位を10倍して人に直してある。
  男と女の労働者数の合計は男女計と最大10人、47都道府県の合計は全国と最大50人ずれる（十人単位の丸め）。
  出典: 厚生労働省 賃金構造基本統計調査。
  https://www.e-stat.go.jp/stat-search/files?toukei=00450091

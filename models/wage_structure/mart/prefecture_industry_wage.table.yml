fields:
- name: year
  title: 調査年
  description: 調査年（西暦4桁）。2020〜2025
- name: area
  title: 地域コード
  description: 地域コード（5桁）。00000=全国、XX000=都道府県
- name: area_name
  title: 地域名
  description: 地域名（全国、北海道、青森県 など）
- name: prefecture_code
  title: 都道府県コード
  description: 都道府県コード（2桁）。全国は NULL
- name: industry_code
  title: 産業コード
  description: 日本標準産業分類の大分類コード（C〜R の1文字）。原典の列は C〜R の16区分で、A 農業，林業・B 漁業・S 公務の列は無い
- name: industry
  title: 産業
  description: industry_code に対応する産業名
- name: sex_code
  title: 男女コード
  description: 男女コード。0=男女計、1=男、2=女。男女計と内訳が同じ列にあるので、絞らずに集計すると二重に数える
- name: sex
  title: 男女
  description: sex_code に対応する名称
- name: scheduled_earnings
  title: 所定内給与額
  description: 所定内給与額（千円）。6月分の月額で、残業代などの超過労働給与額を含まない。原典で「-」のセルは NULL
- name: annual_special_earnings
  title: 年間賞与その他特別給与額
  description: 年間賞与その他特別給与額（千円）。調査前年1年間の賞与・期末手当などの合計。原典で「-」のセルは NULL

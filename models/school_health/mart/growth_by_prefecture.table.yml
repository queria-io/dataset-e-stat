schema: school_health
name: growth_by_prefecture
title: 都道府県別の身長・体重の平均値（5〜17歳）
description: |-
  学校保健統計調査の都道府県別の身長・体重・座高の平均値と標準偏差を、年度・年齢・男女・地域ごとに
  1行で収録する。年齢は5〜17歳（各年度4月1日現在の満年齢）、地域は全国と47都道府県。
  収録は1996年度〜2025年度の30年度、37,440行。
  2025年度の全国の17歳の身長は男 170.6cm・女 157.9cm（1996年度 170.9cm・158.1cm）。
  標本調査で、2006〜2025年度の表の注では1県あたりの調査対象者は1つの年齢・男女で186〜1,284人。
  都道府県の平均値の年度差や県どうしの差は、標準偏差（身長で4〜9cm）に比べて小さいことが多く、
  標本の誤差の内側にある差を順位として読まない。
  座高は2015年度を最後に調査項目から外れ、2016年度以降は NULL。
  2011年度の岩手県・宮城県・福島県は東日本大震災の影響で調査していないため、値が NULL。
  2020〜2023年度は新型コロナウイルス感染症の影響で、例年4〜6月に行う健康診断を年度末まで
  延長して実施した。測定時期が違うので、ほかの年度と単純に比較できない。
  1999・2000・2011年度の原典ファイルには表示より細かい桁を持つセルがあり、公表の桁
  （平均値は小数1位、標準偏差は小数2位）に四捨五入してある。
  出典: 文部科学省 学校保健統計調査。
  https://www.e-stat.go.jp/stat-search/files?toukei=00400002

schema: local_finance
name: settlement_balance
title: 地方財政状況調査 決算収支の状況（都道府県・市区町村別・年度次）
description: |-
  地方財政状況調査の決算収支の状況。普通会計の歳入総額・歳出総額と、そこから出る
  実質収支・単年度収支・実質単年度収支を、都道府県・市区町村・一部事務組合ごとに
  年度で収録する。1989年度決算から毎年途切れなく続く全数調査で、標本ではない。
  金額の単位はすべて千円。

  都道府県分と市町村分の調査表が別々にあり、両方を縦に積んでいる (survey_scope)。
  市町村分の調査表には一部事務組合と広域連合の行が入る (entity_kind='association')。
  市区町村が組合に出す負担金は市区町村の歳出にも組合の歳入にも立つので、絞らずに
  合計すると二重に数える。市区町村だけを数えるなら entity_kind='municipality'。

  各調査表には「合計(全国)」の行が1本ずつ入っている (entity_kind='total')。これは
  その調査表に載る全団体の単純な合計で、市町村分の合計は一部事務組合を含むため
  市区町村の合計ではない (2024年度で市区町村の和 71.4兆円に対し 73.6兆円)。

  収支の恒等式は歳入歳出差引 = 歳入総額 - 歳出総額、実質収支 = 歳入歳出差引 -
  翌年度に繰り越すべき財源、実質単年度収支 = 単年度収支 + 積立金 + 繰上償還金 -
  積立金取崩し額。原典の側に合わない行が 156,892 行中 7 行ある (2012年度の世田谷区、
  2023年度の諏訪広域公立大学事務組合と宇和島地区広域事務組合、2024年度の川南町と、
  それぞれを含む合計の行3本)。原典の値をそのまま収録している。

  出典: 総務省 地方財政状況調査。
  https://www.e-stat.go.jp/stat-search/files?toukei=00200251
keywords:
  - e-stat
  - 地方財政状況調査
  - 決算カード
  - 地方財政
  - 決算
  - 歳入
  - 歳出
  - 実質収支
  - 普通会計
  - 市区町村
  - 都道府県
  - 一部事務組合
published: true
sources:
  - path: https://www.e-stat.go.jp/stat-search/files?toukei=00200251
fields:
  - name: fiscal_year
    title: 決算年度（西暦）
    description: 決算年度（西暦）。1989年度から収録する
  - name: survey_scope
    title: 調査表の区分（prefecture / municipality）
    description: どちらの調査表から来た行か。prefecture=都道府県分、municipality=市町村分（一部事務組合を含む）。どちらの調査表にも「合計(全国)」の行が1本ずつ入る
  - name: entity_kind
    title: 団体の種別（prefecture / municipality / association / total）
    description: 団体の種別。prefecture=都道府県、municipality=市区町村、association=一部事務組合・広域連合、total=その調査表の合計(全国)。市区町村と組合を絞らずに合計すると、市区町村が組合に出す負担金を二重に数える
  - name: entity_category_code
    title: 団体区分コード（原典）
    description: 原典の団体区分コード。1=政令指定都市、2=特別区、8=中核市、9=施行時特例市、3・4=その他の市、5=町村、6・7=一部事務組合・広域連合。都道府県分と、1990〜2000年度調査の組合の一部では空欄。空欄の年でも団体コードの3桁目が8・9なら組合にあたる
  - name: area_code
    title: 標準地域コード（5桁）
    description: 標準地域コード（5桁）。lg_code の先頭5桁で、census / boundary / code.municipality と同じ体系。合計(全国)の行では NULL。一部事務組合は市区町村ではないのでこのコードで code.municipality を引いても当たらない
  - name: lg_code
    title: 全国地方公共団体コード（6桁）
    description: 全国地方公共団体コード（6桁・チェックデジット付き）。原典の団体コードを6桁に揃えたもの。合計(全国)の行では NULL
  - name: pref_name
    title: 都道府県名
    description: 都道府県名。合計(全国)の行では NULL
  - name: entity_name
    title: 団体名
    description: 団体名。1990〜2000年度調査の一部事務組合には名称が入らない行があり、その場合は NULL
  - name: revenue_total
    title: 歳入総額（千円）
    description: 歳入総額（千円）。普通会計の決算額
  - name: expenditure_total
    title: 歳出総額（千円）
    description: 歳出総額（千円）。普通会計の決算額
  - name: balance
    title: 歳入歳出差引（千円）
    description: 歳入歳出差引（千円）。歳入総額 - 歳出総額
  - name: carryover_resources
    title: 翌年度に繰り越すべき財源（千円）
    description: 翌年度に繰り越すべき財源（千円）。翌年度へ繰り越した事業に充てる分で、当年度の収支からは差し引く
  - name: real_balance
    title: 実質収支（千円）
    description: 実質収支（千円）。歳入歳出差引 - 翌年度に繰り越すべき財源。負なら赤字決算
  - name: single_year_balance
    title: 単年度収支（千円）
    description: 単年度収支（千円）。当年度の実質収支 - 前年度の実質収支
  - name: reserve_fund
    title: 積立金（千円）
    description: 積立金（千円）。当年度に基金へ積み立てた額
  - name: early_redemption
    title: 繰上償還金（千円）
    description: 繰上償還金（千円）。地方債を約定より前倒しで返した額
  - name: reserve_fund_drawdown
    title: 積立金取崩し額（千円）
    description: 積立金取崩し額（千円）。当年度に基金から取り崩した額
  - name: real_single_year_balance
    title: 実質単年度収支（千円）
    description: 実質単年度収支（千円）。単年度収支 + 積立金 + 繰上償還金 - 積立金取崩し額。積立と繰上償還を実質の黒字として戻し、取崩しを赤字の穴埋めとして差し引いた収支

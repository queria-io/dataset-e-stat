schema: kaigo_service
name: insurance_facility
title: 介護保険施設数・定員（市区町村別）
description: |-
  介護サービス施設・事業所調査の介護保険施設数・定員を、市区町村別・施設の種類別に2001年から持つテーブルです。

  - 全国になるのは area_kind が municipality と designated_city の行です
  - 2012〜2017年は基本票と詳細票の2本があるので、survey_form を揃えて系列を作ってください
keywords:
  - e-stat
  - 介護サービス施設・事業所調査
  - 介護保険施設
  - 特別養護老人ホーム
  - 介護老人福祉施設
  - 介護老人保健施設
  - 介護医療院
  - 介護療養型医療施設
  - 介護
  - 高齢者
  - 定員
  - 市区町村
sources:
  - path: https://www.e-stat.go.jp/stat-search/files?toukei=00450042
fields:
  - name: survey_year
    title: 調査年
    description: "調査年。毎年10月1日現在の調査で、2001〜2024で欠けは無い"
  - name: area_code
    title: 地域コード
    description: "統計に用いる標準地域コード（5桁）。調査時点のコードなので、その後の合併で消えたコードが混ざる（実測: 2001〜2024年調査に出る3,785コードのうち、現行の code.municipality に残るのは1,960）"
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: area_name
    title: 地域名
    description: "地域の名称。原典の行見出しからコードを切り出した残り"
  - name: area_kind
    title: 集計の段
    description: "集計の段。nationwide=全国、prefecture=都道府県、designated_city=政令指定都市、municipality=市区町村（東京23区を含む）、ward=政令指定都市の行政区、district=東京23区をまとめた集計行（area_code 13100・area_name「特別区」。2004年〜2010年調査にだけある）。足し合わせて全国になるのは municipality と designated_city だけ"
  - name: prefecture_code
    title: 都道府県コード
    description: "都道府県コード（2桁）。全国の行は NULL"
    annotations: { queria: { semantic: { role: entity, name: prefecture } } }
  - name: prefecture_name
    title: 都道府県名
    description: "都道府県名。code.municipality の pref_name。全国の行は NULL"
  - name: facility_type
    title: 施設の種類
    description: "施設の種類。介護老人福祉施設（特別養護老人ホーム）・介護老人保健施設・介護医療院・介護療養型医療施設。介護医療院は2018年調査から、介護療養型医療施設は2023年調査まで"
  - name: survey_form
    title: 調査票
    description: "調査票。基本票は全施設、詳細票は回収率の変動を受ける。両方そろうのは2012〜2017年調査で、2018年調査からは基本票だけ。2011年調査までは票が1種類しか無いので NULL"
  - name: measure
    title: 指標
    description: "指標。facility_count=施設数、capacity=定員（介護療養型医療施設は病床数）、fte_workers=常勤換算従事者数（2017年調査まで）"
  - name: value
    title: 値
    description: "指標の値。その年その市区町村にその種類の施設が無い行は NULL。常勤換算従事者数は原典が1の位で丸めた値なので、足し上げても上位の行と一致しない（実測: 全国との最大差は市区町村の合計で118人、都道府県の合計で7人）"
annotations:
  queria:
    themes: [social_security_health]

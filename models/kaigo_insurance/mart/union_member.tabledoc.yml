$schema: https://tabledoc.queria.io/schemas/table/v1.json
title: 介護保険の広域連合・一部事務組合の構成市町村
description: |-
  介護保険の保険者のうち、広域連合・一部事務組合（39団体）と構成市町村（207）の対応を持つテーブルです。2024年度末の時点です。

  - 2023年度以前は団体の顔ぶれが違うので、過去の年度には当てないでください
topics:
  - 介護保険
  - 広域連合
  - 一部事務組合
  - 保険者
  - 市区町村
temporal_coverage: {start: "2024", end: "2024"}
sources: [files-00450351]
primary_key: [area_code]
columns:
  - name: insurer_name
    title: 保険者名
    description: "広域連合・一部事務組合の名前。insured_persons・certified_persons の insurer_name と同じ表記"
  - name: prefecture_code
    title: 都道府県コード
    description: "都道府県コード（2桁）"
    entity: {type: foreign, name: prefecture}
  - name: prefecture_name
    title: 都道府県名
    description: "都道府県名"
  - name: area_code
    title: 地域コード
    description: "構成市町村の統計に用いる標準地域コード（5桁）。この表の一意キー"
    entity: {type: primary, name: city}
  - name: municipality_name
    title: 市町村名
    description: "構成市町村の名前。soumu.code.municipality の名前"

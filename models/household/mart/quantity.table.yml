schema: household
name: quantity
title: 品目別購入数量（二人以上の世帯）
description: '家計調査 家計収支編 二人以上の世帯の品目別購入数量。品目分類（2025年改定）。

  1世帯当たりの数量で、月次は1か月分、年次は12か月の合計（年間量）。年平均ではない。

  単位は品目ごとに違う（米は1kg、パンは1g など）ので、品目をまたいで足せない。

  月次は全国（area=00000）だけで、県庁所在市別があるのは年次のみ。

  統計表全体では月次が1985年1月〜2026年6月、年次が1985年〜2025年だが、収録期間は

  世帯区分と品目で違う（cat02=01/02 は2017年まで、03/04 は2000年〜）。

  数量を調査している204品目だけで、支出金額（expenditure）より少ない。品目コードは

  expenditure と同じ体系なので、単価は両表を cat01 で結合して求める。

  出典: 総務省統計局 家計調査 家計収支編 二人以上の世帯 品目分類（2025年改定）（総数：数量）。

  月次 https://www.e-stat.go.jp/dbview?sid=0004023602

  年次 https://www.e-stat.go.jp/dbview?sid=0004023606

  統計局ポータル: https://www.stat.go.jp/data/kakei/'
keywords:
  - e-stat
  - 家計調査
  - 家計
  - 消費
  - 購入数量
  - 品目
published: true
themes: [economy]
sources:
  - path: https://www.e-stat.go.jp/dbview?sid=0004023602
  - path: https://www.e-stat.go.jp/dbview?sid=0004023606
fields:
  - name: cat01
    title: 品目コード
    description: 品目コード（9桁）。expenditure と同じ体系で、数量を調査している204品目だけが入る
  - name: item_name
    title: 品目名
    description: cat01 に対応する品目名。「1.1.1 米」のように分類番号が前置される
  - name: item_level
    title: 品目階層
    description: 品目階層の深さ（2〜5）。数量を調査している品目だけなので、消費支出や10大費目にあたる level=1 の行は無く、level=2 も電気代（1kWh）1項目だけ
  - name: item_parent
    title: 上位品目コード
    description: 1つ上の階層の cat01。親自身はこの表に無いことがある（費目は数量を持たないため）
  - name: cat02
    title: 世帯区分コード
    description: 世帯区分コード。03=二人以上の世帯（2000年〜）、04=そのうち勤労者世帯、01=二人以上の世帯（農林漁家世帯を除く／1985〜2007年,2017年）、02=そのうち勤労者世帯。括弧内は e-Stat の区分名だが、実際は 01/02 が2017年まで、03/04 が2000年〜で、2000〜2017年は両方に行がある。絞らずに集計するとその18年を二重に数える。地域別の内訳を持つのは 03 だけ
  - name: household_type
    title: 世帯区分名
    description: cat02 に対応する世帯区分名
  - name: area
    title: 地域コード
    description: 地域コード（5桁）。月次は 00000（全国）だけ。年次は expenditure と同じ53区分で、コードも expenditure と共通
  - name: area_name
    title: 地域名
    description: area に対応する地域名。市は「01100 札幌市」のように5桁の標準地域コードが前置される
  - name: time
    title: 時間軸コード
    description: 時間軸コード。月次は 2024000101（2024年1月）、年次は 2024000000 の形で衝突しない
  - name: time_name
    title: 時間軸名
    description: 時間軸の名称。「2024年」（年次）と「2024年1月」（月次）が混在する
  - name: frequency
    title: 時間軸の粒度
    description: 時間軸の粒度。月次 または 年次。月次には全国しか無いので、地域別に見るときは年次で絞る
  - name: year
    title: 年
    description: time から切り出した西暦4桁
  - name: month
    title: 月
    description: time から切り出した月（1〜12）。年次の行は NULL
  - name: unit
    title: 単位
    description: 数量の単位。品目ごとに違う（1kg・1g・100g・個・本 など）。単位が違う品目の数量は足せない
  - name: value
    title: 統計値
    description: 統計値。元データが非数値だった場合は NULL

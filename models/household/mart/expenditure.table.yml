schema: household
name: expenditure
title: 品目別支出金額（二人以上の世帯）
description: '家計調査 家計収支編 二人以上の世帯の品目別支出金額。品目分類（2025年改定）。

  1世帯当たりの金額で、月次は1か月の額、年次は12か月の合計（年間額）。年平均ではない。

  ただし世帯人員・世帯主の年齢・持家率など単位が円でない項目だけは年次が年平均になる。

  月次と年次を1つの表に積んであるので、frequency で絞らないと粒度が混ざる。

  統計表全体では月次が1985年1月〜2026年6月、年次が1985年〜2025年だが、収録期間は

  世帯区分と地域で違う。cat02=01/02（農林漁家世帯を除く）は全国だけの1985年〜2017年、

  cat02=03/04 は2000年〜で、県庁所在市の月次は2007年9月から。

  地域（area）は全国と47県庁所在市に川崎・相模原・浜松・堺・北九州を加えた53区分で、

  都道府県別ではない。

  出典: 総務省統計局 家計調査 家計収支編 二人以上の世帯 品目分類（2025年改定）（総数：金額）。

  月次 https://www.e-stat.go.jp/dbview?sid=0004023601

  年次 https://www.e-stat.go.jp/dbview?sid=0004023605

  統計局ポータル: https://www.stat.go.jp/data/kakei/'
keywords:
  - e-stat
  - 家計調査
  - 家計
  - 消費
  - 支出
  - 品目
published: true
themes: [economy]
sources:
  - path: https://www.e-stat.go.jp/dbview?sid=0004023601
  - path: https://www.e-stat.go.jp/dbview?sid=0004023605
fields:
  - name: cat01
    title: 品目コード
    description: 品目コード（9桁）。001100000=消費支出、010000000〜100000000 が10大費目、以下が費目・品目。総額・費目・品目が同じ列に混在するので、item_level か cat01 を絞らずに集計すると重複する
  - name: item_name
    title: 品目名
    description: cat01 に対応する品目名。「1.1.1 米」のように分類番号が前置される
  - name: item_level
    title: 品目階層
    description: 品目階層の深さ（1〜5）。level=1 は22項目あり、消費支出・10大費目・財・サービス支出計・世帯人員などが同居しているので、level=1 を足し上げても消費支出にはならない
  - name: item_parent
    title: 上位品目コード
    description: 1つ上の階層の cat01。level=1 の22項目は NULL。階層は消費支出を根とする1本の木ではなく、財・サービス支出計や教養娯楽関係費のような別集計も根を持たない
  - name: cat02
    title: 世帯区分コード
    description: 世帯区分コード。03=二人以上の世帯（2000年〜）、04=そのうち勤労者世帯、01=二人以上の世帯（農林漁家世帯を除く／1985〜2007年,2017年）、02=そのうち勤労者世帯。括弧内は e-Stat の区分名だが、実際は 01/02 が1985〜2017年、03/04 が2000年〜で、2000〜2017年は両方に行がある。絞らずに集計するとその18年を二重に数える。地域別の内訳を持つのは 03 だけで、勤労者世帯には全国の行しか無い
  - name: household_type
    title: 世帯区分名
    description: cat02 に対応する世帯区分名
  - name: area
    title: 地域コード
    description: 地域コード（5桁）。00000=全国、01003 のような形式が県庁所在市・政令市で、全国を除くと53地域中52市。都道府県別は無い。標準地域コードとは別体系で、市の標準地域コードは area_name の先頭に付いている。cpi.price_index とは市のコードが違う（札幌市は household が 01003、cpi が 01A01）ので、価格と突き合わせるときは area ではなく area_name で結合する
  - name: area_name
    title: 地域名
    description: area に対応する地域名。全国は名称のみ、市は「01100 札幌市」のように5桁の標準地域コードが前置される。東京は「13100 東京都区部」で、特別区をまとめた1行
  - name: time
    title: 時間軸コード
    description: 時間軸コード。月次は 2024000101（2024年1月）、年次は 2024000000 の形で衝突しない
  - name: time_name
    title: 時間軸名
    description: 時間軸の名称。「2024年」（年次）と「2024年1月」（月次）が混在する
  - name: frequency
    title: 時間軸の粒度
    description: 時間軸の粒度。月次 または 年次。月次と年次を足すと二重に数えるので、集計の前にどちらかで絞る
  - name: year
    title: 年
    description: time から切り出した西暦4桁
  - name: month
    title: 月
    description: time から切り出した月（1〜12）。年次の行は NULL
  - name: unit
    title: 単位
    description: 単位。支出金額の品目は「円」。円でないのは世帯数分布の「一万分比」、集計世帯数・調整集計世帯数の「世帯」、世帯人員など人数の「人」、世帯主の年齢の「歳」、持家率などの「％」の5種で、これらは支出ではなく年次も合計ではない
  - name: value
    title: 統計値
    description: 統計値。元データが非数値だった場合は NULL

schema: construction
name: prefecture_monthly
title: 都道府県別の建設工事出来高（月次）
description: |-
  建設総合統計の都道府県別・月別の建設工事出来高（億円）を持つテーブルです。工事費を工事の進み具合に合わせて月ごとに割り振った値です。

  - 建築・土木、民間・公共を合わせた計で、内訳はありません
  - 毎年6月に過去3年分が遡って改定されます
keywords:
  - e-stat
  - 建設総合統計
  - 建設投資
  - 出来高
  - 建設工事
  - 都道府県
  - 月次
published: true
themes: [housing_land]
sources:
  - path: https://www.e-stat.go.jp/dbview?sid=0003458459
fields:
  - name: prefecture_code
    title: 都道府県コード
    description: "都道府県コード（2桁）。01=北海道〜47=沖縄県"
    semantic: { role: entity, name: prefecture }
  - name: area
    title: 地域コード
    description: "都道府県の地域コード（5桁、下3桁が000）。統計に用いる標準地域コードと同じ体系"
  - name: area_name
    title: 都道府県名
    description: "area に対応する都道府県名"
  - name: region_code
    title: 地方コード
    description: "この統計の地方区分のコード。00042=北海道、00043=東北、00044=関東、00049=北陸、51000=中部、00051=近畿、00053=中国、00054=四国、00056=九州（沖縄県を含む）"
  - name: region_name
    title: 地方名
    description: "region_code に対応する地方名。区分はこの統計独自のもので、山梨県・長野県は関東地方、新潟県は北陸地方、中部地方は岐阜・静岡・愛知・三重の4県"
  - name: time
    title: 時間軸コード
    description: "e-Stat の時間軸コード。2024000404 が2024年4月"
  - name: time_name
    title: 時間軸名
    description: "時間軸の名称（2024年4月 など）"
  - name: year
    title: 年
    description: "time から切り出した西暦4桁。年度ではなく暦年"
  - name: month
    title: 月
    description: "time から切り出した月（1〜12）。年度で集計するときは4月〜翌年3月を同じ年度に数える"
  - name: output
    title: 出来高
    description: "その月の建設工事出来高（億円）。億円未満を丸めた値で、都道府県を足すと全国の値と丸めの分だけずれる。最小107、最大7,433"
    semantic: { role: measure, agg: sum }

version: 2

models:
  - name: prefecture_monthly
    description: |
      建設総合統計の都道府県別・月別の建設工事出来高（億円）。建築着工統計と建設工事受注動態統計の
      工事費を工事の進み具合に合わせて月ごとに割り振った加工統計で、その月に施工された分の金額にあたる。
      着工した月に全額が載る建築着工統計（building_starts）と違い、工期の長い工事も毎月の施工分に均される。
      建築・土木、民間・公共をすべて合わせた計で、内訳はこの表には無い。
      収録は2011年4月〜2026年8月の185か月 × 47都道府県の8,695行で、欠けは無い。
      都道府県を足した年度計は、全国の年度別出来高（sid=0003458482）と2011〜2025年度のすべてで
      16億円以内で一致する（億円の丸めによる差）。全国の月別出来高（sid=0003458439）とは2020年度まで
      一致するが、2021年度以降はずれ、2025年度は全国の月別のほうが4.6%大きい。
      値は毎年6月に過去3年分が補正率で遡及改定される。同じ月でも取得した時期で値が変わる。
      出典: 国土交通省 建設総合統計。
      https://www.e-stat.go.jp/dbview?sid=0003458459
      統計の案内: https://www.e-stat.go.jp/statistics/00600260
    access: public
    columns:
      - name: prefecture_code
        description: "都道府県コード（2桁）。01=北海道〜47=沖縄県"
      - name: area
        description: "都道府県の地域コード（5桁、下3桁が000）。統計に用いる標準地域コードと同じ体系"
      - name: area_name
        description: "area に対応する都道府県名"
      - name: region_code
        description: "この統計の地方区分のコード。00042=北海道、00043=東北、00044=関東、00049=北陸、51000=中部、00051=近畿、00053=中国、00054=四国、00056=九州（沖縄県を含む）"
      - name: region_name
        description: "region_code に対応する地方名。区分はこの統計独自のもので、山梨県・長野県は関東地方、新潟県は北陸地方、中部地方は岐阜・静岡・愛知・三重の4県"
      - name: time
        description: "e-Stat の時間軸コード。2024000404 が2024年4月"
      - name: time_name
        description: "時間軸の名称（2024年4月 など）"
      - name: year
        description: "time から切り出した西暦4桁。年度ではなく暦年"
      - name: month
        description: "time から切り出した月（1〜12）。年度で集計するときは4月〜翌年3月を同じ年度に数える"
      - name: output
        description: "その月の建設工事出来高（億円）。億円未満を丸めた値で、都道府県を足すと全国の値と丸めの分だけずれる。最小107、最大7,433"
  - name: public_orders_prefecture_monthly
    description: |
      建設工事受注動態統計調査のうち、公共機関から受注した工事（1件500万円以上）の請負契約額を、
      施工した都道府県・発注機関ごとに月別に収録する（百万円）。全国計（area = '00000'）と47都道府県の行がある。
      発注機関は国の機関（国・独立行政法人・政府関連企業等）と地方の機関（都道府県・市区町村・
      地方公営企業・その他）の7区分で、合計と国の機関・地方の機関の小計も列に持つ。
      収録は2021年4月〜2026年8月の65か月 × 48行の3,120行。推計方法が2021年4月分から変わり、
      それより前の月とは水準がつながらないので、この月から収録する。
      都道府県を足した値は全国計と一致し、月を足した年度計は年度次の同じ表と2025年度で全国・
      都道府県・発注機関のすべて一致する。2025年度の全国の請負契約額は23兆5,706億円で、
      東京都（3兆1,006億円）・北海道・愛知県・神奈川県・大阪府の順に大きい。
      年度末の3月に契約が集まり、2021〜2025年度の3月の全国計は平均でほかの月の2.4倍。
      受注したその月に契約額の全額が載るので、工事の進み具合に合わせて均した出来高は
      prefecture_monthly（建設総合統計）を使う。
      変更契約で減額された分が多い月は発注機関の列が負になる（78行、最小は -25,913百万円）。
      受注高の少ない区分は標本の誤差が大きい。
      出典: 国土交通省 建設工事受注動態統計調査。
      https://www.e-stat.go.jp/stat-search/files?toukei=00600130
      統計の案内: https://www.e-stat.go.jp/statistics/00600130
    access: public
    columns:
      - name: prefecture_code
        description: "都道府県コード（2桁）。01=北海道〜47=沖縄県。全国計の行は NULL"
      - name: area
        description: "地域コード（5桁）。都道府県は下3桁が000、全国計は 00000。統計に用いる標準地域コードと同じ体系"
      - name: area_name
        description: "都道府県名（北海道・東京都 など）。全国計の行は「全国」"
      - name: year
        description: "調査月の西暦4桁。年度ではなく暦年"
      - name: month
        description: "調査月（1〜12）"
      - name: fiscal_year
        description: "調査月の属する年度（4月〜翌年3月）"
      - name: total
        description: "公共機関から受注した工事の請負契約額の合計（百万円）。national_total と local_total の和"
      - name: national_total
        description: "国・独立行政法人・政府関連企業等の計（百万円）"
      - name: national_government
        description: "国が発注した工事の請負契約額（百万円）"
      - name: independent_agency
        description: "独立行政法人が発注した工事の請負契約額（百万円）"
      - name: government_affiliated
        description: "政府関連企業等が発注した工事の請負契約額（百万円）"
      - name: local_total
        description: "都道府県・市区町村・地方公営企業・その他の計（百万円）"
      - name: prefectural_government
        description: "都道府県が発注した工事の請負契約額（百万円）"
      - name: municipal_government
        description: "市区町村が発注した工事の請負契約額（百万円）"
      - name: local_public_enterprise
        description: "地方公営企業が発注した工事の請負契約額（百万円）"
      - name: other
        description: "地方の機関のうち、都道府県・市区町村・地方公営企業以外が発注した工事の請負契約額（百万円）"

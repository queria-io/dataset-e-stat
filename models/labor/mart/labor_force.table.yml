schema: labor
name: labor_force
title: 就業状態別15歳以上人口
description: '労働力調査 基本集計の就業状態別15歳以上人口。全国の月次（1968年1月〜）と

  地域ブロック別の四半期（2000年1〜3月期〜）を1つの表に積んである。

  単位は人ではなく万人。値は万人単位で丸められているので、内訳の合計は総数と

  数万人ずれる。

  月次には全国しか無く、地域ブロックがあるのは四半期だけなので、frequency で

  絞らないと粒度が混ざる。都道府県別はこの調査には無い（標本設計が地域ブロックまで）。

  就業状態（labor_status）は 15歳以上人口・労働力人口・就業者・完全失業者・

  非労働力人口などが同じ列に縦に積まれた階層で、labor_status_level=1 は

  入れ子の総数を含むため足し上げると何重にも数える。

  年齢階級（age_class）も同じで、age_class_level=1 には総数の「15歳以上」と

  再集計の「15〜64歳」が各階級と同居している。

  産業（industry_code）の内訳を持つのは就業者系の状態だけで、15歳以上人口・

  労働力人口・完全失業者・非労働力人口は全産業（000）の行しか無い。

  出典: 総務省統計局 労働力調査 基本集計。

  全国・月次 https://www.e-stat.go.jp/dbview?sid=0002060002

  地域別・四半期 https://www.e-stat.go.jp/dbview?sid=0003009572

  統計局ポータル: https://www.stat.go.jp/data/roudou/'
keywords:
- e-stat
- 労働力調査
- 労働
- 就業
- 雇用
- 失業
published: true
themes: [labour]
sources:
- path: https://www.e-stat.go.jp/dbview?sid=0002060002
- path: https://www.e-stat.go.jp/dbview?sid=0003009572
fields:
- name: frequency
  title: 時間軸の粒度
  description: 時間軸の粒度。月次 または 四半期。月次は全国だけ、四半期は全国と地域ブロックで、同じ期間を両方が持つので足すと二重に数える
- name: industry_code
  title: 産業コード
  description: 産業コード。000=全産業、001=農業，林業、004=非農林業。就業者・従業者・休業者など就業者系の状態だけが内訳を持ち、それ以外の状態は 000 の行しか無い。四半期（地域別）の行は産業を分けない集計なので一律 000
- name: industry_name
  title: 産業名
  description: industry_code に対応する産業名（全産業／農業，林業／非農林業）
- name: sex_code
  title: 性別コード
  description: 性別コード。0=総数、1=男、2=女。総数と内訳が同じ列にあるので、絞らずに集計すると二重に数える
- name: sex
  title: 性別名
  description: sex_code に対応する性別名
- name: labor_status_code
  title: 就業状態コード
  description: 就業状態コード。00=15歳以上人口、01=労働力人口、02=就業者、03=従業者、07=休業者、08=完全失業者、09=非労働力人口。04〜06・10〜12・16 はその内訳
- name: labor_status
  title: 就業状態名
  description: labor_status_code に対応する就業状態名
- name: labor_status_level
  title: 就業状態の階層
  description: 就業状態の階層の深さ（1〜2）。level=1 は総数と入れ子の小計が同居している（15歳以上人口 ⊃ 労働力人口 ⊃ 就業者 ⊃ 従業者）ので、足し上げても総数にはならない。労働力人口=就業者+完全失業者、就業者=従業者+休業者は成り立つが、15歳以上人口は労働力人口と非労働力人口の合計より数万人多い（実測で最大13万人）。差はこの表に区分の無い就業状態不詳の分で、この恒等式は成り立たない
- name: age_class_code
  title: 年齢階級コード
  description: 年齢階級コード。00=15歳以上（総数）、27=15〜64歳、01〜20・28〜36 が各階級。月次（全国）は30区分、四半期（地域別）はその部分集合の18区分
- name: age_class
  title: 年齢階級名
  description: age_class_code に対応する年齢階級名
- name: age_class_level
  title: 年齢階級の階層
  description: 年齢階級の階層の深さ（1〜3）。level=1 には総数の15歳以上と再集計の15〜64歳が各階級と並んでいるので、level で絞っただけでは区分にならない
- name: age_class_parent
  title: 上位年齢階級コード
  description: 1つ上の階層の age_class_code。level=1 の階級と、70〜74歳・75歳以上のように上位が張られていない階級は NULL
- name: area
  title: 地域コード
  description: 地域コード（5桁）。00000=全国、00042〜00059 が地域ブロック。全国が地域ブロックと同じ列に入っているので、地域を足し上げるときは除く。九州は2011年10〜12月期までが九州・沖縄地方（00055）、2012年1〜3月期以降が九州地方（00057）と沖縄地方（00059）に分かれていて、同じ時点に両方が並ぶことは無い
- name: area_name
  title: 地域名
  description: area に対応する地域名（全国、北海道地方、南関東地方 など）。都道府県はこの調査には無い
- name: time
  title: 時間軸コード
  description: 時間軸コード。月次は 2024000404（2024年4月）、四半期は 2024000406（2024年4〜6月期）で、期末月の位置が違うだけで衝突しない
- name: time_name
  title: 時間軸名
  description: 時間軸の名称。「2024年4月」（月次）と「2024年4〜6月期」（四半期）が混在する
- name: year
  title: 年
  description: time から切り出した西暦4桁
- name: month
  title: 月
  description: time から切り出した月（1〜12）。四半期の行は NULL
- name: quarter
  title: 四半期
  description: time から切り出した四半期（1〜4）。月次の行は NULL
- name: unit
  title: 単位
  description: 単位。万人
- name: value
  title: 統計値
  description: 統計値（万人）。元データが非数値だった場合は NULL

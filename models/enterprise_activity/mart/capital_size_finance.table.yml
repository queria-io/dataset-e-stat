schema: enterprise_activity
name: capital_size_finance
title: 資本金規模別・産業別の財務
description: |-
  経済産業省企業活動基本調査の資本金規模別・産業別の資産・負債及び純資産・損益・費用の内訳を、年度ごとに縦に持つテーブルです。第3-1表と第4表を1つに積んでいます。2009〜2024年度を収録しています。

  - 資本金規模と産業に計と内訳が並ぶので、絞ってから合計してください
  - 企業数・売上高・経常利益は第3-1表の値で、第3-1表が空欄のセルは第4表の値で埋めています
keywords:
- e-stat
- 企業活動基本調査
- 経済産業省
- 企業
- 資本金規模
- 費用の内訳
- 給与総額

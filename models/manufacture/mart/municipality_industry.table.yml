schema: manufacture
name: municipality_industry
title: 市区町村別 産業中分類別の事業所数・従業者数・製造品出荷額等（工業統計調査）
description: |-
  工業統計調査の、都道府県・市区町村ごとの製造業の事業所数・従業者数・製造品出荷額等を、産業中分類別に2008年から2020年まで持つテーブルです。従業者4人以上の事業所が対象です。

  - 金額は前年の実績のことがあるので、年で並べるときは amount_reference_year を使ってください
  - 秘匿で金額の内訳が欠けるので、総数は製造業計の行を読んでください
  - 都道府県と市区町村の行が同じ列に並ぶので、area_level で絞ってから合計してください
keywords:
  - e-stat
  - 工業統計調査
  - 製造業
  - 事業所
  - 従業者数
  - 製造品出荷額
  - 産業中分類
  - 市区町村
  - 都道府県
sources:
  - path: https://www.e-stat.go.jp/statistics/00550010
fields:
  - name: survey_year
    title: 調査年
    description: 調査年。2008〜2010・2012〜2014・2017〜2020の10年。2011年・2015年・2016年は経済センサス‐活動調査の実施年で工業統計調査が行われていない。事業所数と従業者数はこの年の時点（2014年までは12月31日現在、2017年以降は6月1日現在）
  - name: amount_reference_year
    title: 金額の実績年
    description: 金額の項目が対象とする実績年。2014年までは survey_year と同じ、2017年以降は survey_year - 1。2017年調査から調査期日が翌年6月1日に変わり、経理事項は前年1〜12月の実績になった。金額を年で並べるときはこの列を使う
  - name: area
    title: 標準地域コード（5桁）
    description: 標準地域コード。都道府県は 13000 のように市区町村部が 000。census_municipality の area・code.municipality の area_code と同じ体系。全国の行は無い
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: area_name
    title: 地域名
    description: 地域の名称。2012年までは政令指定都市の区が市名を含まず（中央区）、2013年以降は含む（札幌市中央区）。年をまたぐ集計は名称でなく area で束ねる
  - name: area_level
    title: 地域の粒度
    description: area の粒度。prefecture=都道府県（47）、municipality=市・町村・東京特別区（13100）、ward=政令指定都市の行政区・特別区。日本全域をちょうど1回覆うのは prefecture だけ、または municipality だけで、ward は municipality の内訳
  - name: parent_area
    title: 上位地域の標準地域コード
    description: 1つ上の階層の area。市区町村の親は都道府県、行政区の親はその市、特別区の親は東京特別区（13100）。都道府県は NULL
  - name: industry_code
    title: 産業中分類コード
    description: 産業中分類のコード。00=製造業計、09〜32=中分類24区分。日本標準産業分類 第12回改定以降のコードで、収録している2008〜2020年は同じコードが同じ産業を指す
  - name: industry_name
    title: 産業中分類
    description: industry_code に対応する産業の名称
  - name: industry_level
    title: 産業分類の階層
    description: 産業分類の階層。1=製造業計、2=中分類。重複なく製造業を覆うのは industry_level = 2 の24区分で、その和が製造業計に一致するのは事業所数と従業者数だけ
  - name: establishments
    title: 事業所数
    description: 事業所数（従業者4人以上）。欠測が無く、中分類の和が製造業計に一致する
  - name: establishments_30_to_299
    title: 事業所数（従業者30〜299人）
    description: 事業所数のうち従業者30〜299人の事業所（事業所）。該当が無い行は NULL
  - name: establishments_300_or_more
    title: 事業所数（従業者300人以上）
    description: 事業所数のうち従業者300人以上の事業所（事業所）。該当が無い行は NULL
  - name: employees
    title: 従業者数
    description: 従業者数（人）。欠測が無く、中分類の和が製造業計に一致する
  - name: cash_earnings_10k_yen
    title: 現金給与総額
    description: 現金給与総額（万円、amount_reference_year の1〜12月実績）。事業所が少ない区分は秘匿され NULL が入るため、中分類の和は製造業計に届かない
  - name: material_cost_10k_yen
    title: 原材料使用額等
    description: 原材料使用額等（万円、amount_reference_year の1〜12月実績）。事業所が少ない区分は秘匿され NULL が入る
  - name: shipment_value_10k_yen
    title: 製造品出荷額等
    description: 製造品出荷額等（万円、amount_reference_year の1〜12月実績）。事業所が少ない区分は秘匿され NULL が入るため、中分類の和は製造業計に届かない
  - name: other_income_10k_yen
    title: その他収入額
    description: 製造品出荷額等のうちその他収入額（万円）。2014年までの統計表にしかなく、2017年以降は NULL
  - name: gross_value_added_10k_yen
    title: 粗付加価値額
    description: 粗付加価値額（万円、amount_reference_year の1〜12月実績）。事業所が少ない区分は秘匿され NULL が入る。負の値をとる行がある
  - name: tangible_fixed_assets_10k_yen
    title: 有形固定資産年末現在高
    description: 有形固定資産年末現在高（従業者30人以上、万円）。2014年までの統計表にしかなく、2017年以降は NULL
annotations:
  queria:
    themes: [mining_manufacturing]

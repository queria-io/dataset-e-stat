schema: manufacture
name: municipality_industry
title: 市区町村別 産業中分類別の事業所数・従業者数・製造品出荷額等（工業統計調査）
description: |-
  工業統計調査 確報の「市区町村別、産業中分類別統計」から、都道府県・市区町村・政令指定都市の
  区ごとの事業所数・従業者数・製造品出荷額等を産業中分類別に集めた表。従業者4人以上の
  事業所が対象。1地域につき 製造業計 + 産業中分類24区分の縦持ちで、地域は年により1,944〜2,005。

  件数と金額で対象期間が違う。2017年調査から調査期日が12月31日から翌年6月1日に変わり、
  事業所数・従業者数は調査年の6月1日現在、現金給与総額・製造品出荷額等などの経理事項は
  前年1〜12月の実績になった（2020年確報の製造品出荷額等は2019年実績）。2014年までは
  12月31日現在と当年1〜12月の実績で、調査年と実績年が同じ。同じ1行の中で件数と金額の
  対象期間がずれるので、金額を年で並べるときは survey_year ではなく
  amount_reference_year を使う。金額の実績年は 2008〜2010・2012〜2014・2016〜2019 になり、
  2015年の実績はどの年にも入らない。

  収録は2008年から2020年までの10年。2011年・2015年・2016年は経済センサス‐活動調査の実施年で
  工業統計調査が行われていない。2020年確報が最後で、以降この調査は行われていない。
  2007年以前は取り込んでいない。日本標準産業分類 第12回改定（2008年適用）で繊維工業と
  衣服製造業が統合され、以降の中分類コードが繰り上がったため、同じコードが2007年と2008年で
  別の産業を指す（26 は2007年が一般機械器具製造業、2008年以降が生産用機械器具製造業）。
  コードで時系列を引くと黙って別の産業が混ざる。

  産業中分類の内訳を持つ地域は限られる。都道府県の行と、政令指定都市・東京特別区の行は
  製造業計しか持たない（政令指定都市の内訳は区の行にある）。事業所の少ない市町村も内訳が
  秘匿されていて入らない。2020年に内訳を持つのは市区町村772と区198の計970地域で、その
  事業所数の合計は159,720。全国181,876事業所の88%にあたる。内訳の無い市町村は929で、
  事業所数の中央値は16。都道府県の産業別内訳は同じ調査の別の統計表（都道府県別、東京特別区・
  政令指定都市別の産業中分類別統計）にあり、この表には無い。

  足し算が成り立つのは件数の項目だけ。事業所数と従業者数は欠測が無く、産業中分類24区分の和が
  製造業計に一致する（内訳を持つ9,646の地域×年すべてで不一致0）。市区町村の和も都道府県に
  一致する（470の都道府県×年のうち469。長野県の2020年だけ都道府県が4,767事業所・202,222人で
  市区町村の和が4,766事業所・202,218人になり、1事業所ぶんずれる）。政令指定都市の区の和は
  その市に全204組で一致する。全国の行は無いが、47都道府県の和が全国計に一致する
  （2008年の事業所数263,061で、同じ調査の産業編「従業者4人以上の事業所に関する統計」の
  全国計と同値）。
  金額の項目（現金給与総額・原材料使用額等・製造品出荷額等・粗付加価値額）は事業所が少ない
  区分を秘匿するため NULL が入り、値が入るのは全体の70%。製造品出荷額等の中分類の和は
  製造業計の中央値で94%にとどまり、9,625の地域×年のうち一致するのは109だけ。総数を出したい
  ときは内訳を足さず、製造業計の行・都道府県の行をそのまま読む。

  東京の特別区は、23区の合計にあたる東京特別区（13100）を市区町村と同じ粒度に置き、23区を
  その内訳（ward）にしている。日本全域をちょうど1回覆うのは area_level = 'prefecture' だけ、
  または area_level = 'municipality' だけで、ward は municipality の内訳。

  地域の名称は年で書き方が変わる。2012年までは政令指定都市の区が市名を含まず（中央区）、
  2013年以降は含む（札幌市中央区）。年をまたぐ集計は名称でなく area で束ねる。

  経済センサス‐活動調査（economic_census.establishment_industry）と単純につなげない。
  あちらは全産業を産業大分類で見た2021年の断面で、事業所の規模を絞らない。こちらは製造業だけを
  産業中分類で見た毎年の系列で、従業者4人以上に限る。同じ「製造業の事業所数」でも母数が違う。

  area は census_municipality・code.municipality の area_code と同じ標準地域コード（5桁）。
  全国地方公共団体コード（6桁）とは別体系なので、lg_code や address_br と結合するときは
  桁と体系を揃える。
  出典: 経済産業省 工業統計調査 確報 市区町村編／地域別 市区町村別、産業中分類別統計表。
  https://www.e-stat.go.jp/
keywords:

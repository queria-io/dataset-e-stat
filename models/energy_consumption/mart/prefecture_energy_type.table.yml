schema: energy_consumption
name: prefecture_energy_type
title: 都道府県別・エネルギー種別エネルギー消費量
description: |-
  エネルギー消費統計調査の都道府県別・エネルギー種別（石炭・都市ガス・A重油・電力・蒸気など）のエネルギー消費量（熱量、TJ）を2009年度から持つテーブルです。

  - 製造業は石油等消費動態統計調査の対象の事業所の分を含みません。家庭の消費も含みません
  - 合計・燃料・電力などの計と全国の行が内訳と同じ列に並ぶので、絞ってから合計してください
keywords:
  - e-stat
  - エネルギー消費統計調査
  - エネルギー消費量
  - エネルギー
  - 熱量
  - 燃料
  - 電力
  - 都市ガス
  - 重油
  - 都道府県
published: true
themes: [energy_water]
temporal_coverage: { start: "2009", end: "2024" }
sources:
  - path: https://www.e-stat.go.jp/stat-search/files?toukei=00551005
fields:
  - name: fiscal_year
    title: 年度
    description: "年度（西暦4桁）。2009〜2024"
  - name: area
    title: 地域コード
    description: "地域コード（5桁）。00000=全国、XX000=都道府県"
    semantic: { role: entity, name: prefecture }
  - name: area_name
    title: 地域名
    description: "地域名（全国、北海道、青森県 など）"
  - name: prefecture_code
    title: 都道府県コード
    description: "都道府県コード（2桁）。全国は NULL"
    semantic: { role: entity, name: prefecture }
  - name: energy_type
    title: エネルギー種別
    description: "エネルギー種別（原典の表記）。合計・燃料・非石油系燃料・石油系燃料・電力・熱は計の行"
  - name: parent_energy_type
    title: 上位の種別
    description: "1つ上の種別。合計は NULL。同じ親の行を足すと親の値になる"
  - name: energy_tj
    title: エネルギー消費量（TJ）
    description: "エネルギー消費量（TJ、熱量換算）"

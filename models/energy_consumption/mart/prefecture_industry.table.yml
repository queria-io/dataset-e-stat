schema: energy_consumption
name: prefecture_industry
title: 都道府県別・業種別エネルギー消費量
description: |-
  エネルギー消費統計調査の都道府県別・業種別のエネルギー消費量（熱量、TJ）を2009年度から持つテーブルです。

  - 製造業は石油等消費動態統計調査の対象の事業所の分を含みません。家庭の消費も含みません
  - 業種計・部門計・全国の行が内訳と同じ列に並ぶので、絞ってから合計してください
keywords:
  - e-stat
  - エネルギー消費統計調査
  - エネルギー消費量
  - エネルギー
  - 熱量
  - 業種
  - 産業
  - 製造業
  - 業務部門
  - 都道府県
published: true
themes: [energy_water]
temporal_coverage: { start: "2009", end: "2024" }
sources:
  - path: https://www.e-stat.go.jp/stat-search/files?toukei=00551005
fields:
  - name: fiscal_year
    title: 年度
    description: "年度（西暦4桁）。2009〜2024"
  - name: area
    title: 地域コード
    description: "地域コード（5桁）。00000=全国、XX000=都道府県"
    semantic: { role: entity, name: prefecture }
  - name: area_name
    title: 地域名
    description: "地域名（全国、北海道、青森県 など）"
  - name: prefecture_code
    title: 都道府県コード
    description: "都道府県コード（2桁）。全国は NULL"
    semantic: { role: entity, name: prefecture }
  - name: industry_code
    title: 業種の記号
    description: "A~S=業種計、A~D=非製造業計、E=製造業、F~S=業務部門計、A〜S=日本標準産業分類の大分類、9〜32=製造業の中分類"
  - name: industry_name
    title: 業種
    description: "業種の名前（原典の表記）"
  - name: parent_industry_code
    title: 上位の業種の記号
    description: "1つ上の業種の記号。業種計（A~S）は NULL。同じ親の行を足すと親の値になる"
  - name: energy_tj
    title: エネルギー消費量（TJ）
    description: "エネルギー消費量（TJ、熱量換算）"

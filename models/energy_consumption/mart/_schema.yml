version: 2

models:
  - name: prefecture_industry
    description: |
      エネルギー消費統計調査の参考表「都道府県別・業種別エネルギー消費量」（熱量単位表）を、
      都道府県 × 業種の1セル1行で収録する。2009〜2024年度の16年度、35,328行
      （各年度 全国+47都道府県 × 46業種）。単位は TJ（テラジュール）。
      事業所の調査なので家庭の消費は含まない。製造業は、石油等消費動態統計調査の対象の
      事業所の分を含まない（原典の「石油等消費動態統計を含まない」の結果表）。
      業種は日本標準産業分類の大分類（A〜S）と製造業の中分類（9〜32）で、計の行が内訳と同じ列に
      並ぶ（業種計 A~S = 非製造業計 A~D + 製造業 E + 業務部門計 F~S）。parent_industry_code が
      1つ上の行の記号で、同じ親の行を足すと親の値に一致する。全国の行も都道府県の行と並ぶので、
      絞らずに足すと二重に数える。
      出典: 資源エネルギー庁 エネルギー消費統計調査（石油等消費動態統計を含まない）参考1。
      https://www.e-stat.go.jp/stat-search/files?toukei=00551005
    access: public
    columns:
      - name: fiscal_year
        description: "年度（西暦4桁）。2009〜2024"
        data_tests:
          - not_null
      - name: area
        description: "地域コード（5桁）。00000=全国、XX000=都道府県"
        data_tests:
          - not_null
      - name: area_name
        description: "地域名（全国、北海道、青森県 など）"
      - name: prefecture_code
        description: "都道府県コード（2桁）。全国は NULL"
      - name: industry_code
        description: "業種の記号。A~S=業種計、A~D=非製造業計、E=製造業、F~S=業務部門計、A〜S=日本標準産業分類の大分類、9〜32=製造業の中分類"
        data_tests:
          - not_null
      - name: industry_name
        description: "業種の名前（原典の表記）"
      - name: parent_industry_code
        description: "1つ上の業種の記号。業種計（A~S）は NULL。同じ親の行を足すと親の値になる"
      - name: energy_tj
        description: "エネルギー消費量（TJ、熱量換算）"
        data_tests:
          - not_null
  - name: prefecture_energy_type
    description: |
      エネルギー消費統計調査の参考表「都道府県別・エネルギー種別エネルギー消費量」（熱量単位表）を、
      都道府県 × エネルギー種別の1セル1行で収録する。2009〜2024年度の16年度、28,416行
      （各年度 全国+47都道府県 × 37種別）。単位は TJ（テラジュール）。
      対象の事業所は prefecture_industry と同じで、業種計の値は合計の値に一致する。
      種別は合計 → 燃料・電力・熱 → 非石油系燃料・石油系燃料 → 石炭・都市ガス・A重油 などの
      階層で、計の行が内訳と同じ列に並ぶ。parent_energy_type が1つ上の種別で、同じ親の行を
      足すと親の値に一致する。全国の行も都道府県の行と並ぶので、絞らずに足すと二重に数える。
      出典: 資源エネルギー庁 エネルギー消費統計調査（石油等消費動態統計を含まない）参考2。
      https://www.e-stat.go.jp/stat-search/files?toukei=00551005
    access: public
    columns:
      - name: fiscal_year
        description: "年度（西暦4桁）。2009〜2024"
        data_tests:
          - not_null
      - name: area
        description: "地域コード（5桁）。00000=全国、XX000=都道府県"
        data_tests:
          - not_null
      - name: area_name
        description: "地域名（全国、北海道、青森県 など）"
      - name: prefecture_code
        description: "都道府県コード（2桁）。全国は NULL"
      - name: energy_type
        description: "エネルギー種別（原典の表記）。合計・燃料・非石油系燃料・石油系燃料・電力・熱は計の行"
        data_tests:
          - not_null
      - name: parent_energy_type
        description: "1つ上の種別。合計は NULL。同じ親の行を足すと親の値になる"
      - name: energy_tj
        description: "エネルギー消費量（TJ、熱量換算）"
        data_tests:
          - not_null

schema: school
name: enrollment_by_grade
title: 都道府県別の学年別児童生徒数（小学校・中学校）
description: |-
  学校基本調査の小学校・中学校の学年別の児童生徒数を、都道府県別・設置者別・男女別に2000年から持つテーブルです。

  - 計・全国・学年の計・男女計が内訳と同じ列に並ぶので、絞ってから合計してください
keywords:
- e-stat
- 学校基本調査
- 小学校
- 中学校
- 児童数
- 生徒数
- 学年
- 私立
- 少子化
- 都道府県
published: true
themes: [education_culture]
sources:
- path: https://www.e-stat.go.jp/stat-search/files?toukei=00400001
fields:
- name: year
  title: 調査年
  description: 調査年（西暦4桁）。2000〜2025。毎年5月1日現在
- name: school_type
  title: 学校種コード
  description: 学校種。elementary=小学校、junior_high=中学校
- name: school_type_name
  title: 学校種
  description: school_type に対応する名称（小学校・中学校）
- name: founder_code
  title: 設置者コード
  description: 設置者コード。0=計、1=国立、2=公立、3=私立。計と内訳が同じ列にあるので、絞らずに集計すると二重に数える
- name: founder
  title: 設置者
  description: founder_code に対応する名称
- name: area
  title: 地域コード
  description: 地域コード（5桁）。00000=全国、XX000=都道府県
  semantic: { role: entity, name: prefecture }
- name: area_name
  title: 地域名
  description: 地域名（全国、北海道、青森県 など）
- name: prefecture_code
  title: 都道府県コード
  description: 都道府県コード（2桁）。全国は NULL
  semantic: { role: entity, name: prefecture }
- name: grade
  title: 学年
  description: 学年。小学校 1〜6、中学校 1〜3。0 は学年の計
- name: sex_code
  title: 男女コード
  description: 男女コード。0=男女計、1=男、2=女。男女計は学年の計（grade = 0）の行にだけある
- name: sex
  title: 男女
  description: sex_code に対応する名称
- name: students
  title: 児童生徒数
  description: 在学している児童数（小学校）・生徒数（中学校）（人）。原典で「-」のセルは 0

  - name: municipality_teachers
    description: |
      学校基本調査の小学校・中学校の本務教員数を、市区町村別・職名別・男女別に1セル1行で収録する
      （国立・公立・私立の計）。調査日は毎年5月1日。収録は2021年〜2025年の5年、757,926行。
      地域は都道府県の計（area_level = 'prefecture'）と市区町村・政令指定都市の区。政令指定都市は
      区の行だけで市の行は無いので、市の値は city_code で区を足して出す。都道府県の計は、
      その都道府県の市区町村・区・outside の行を足した値に一致する。全国の行は無い。
      職名 position は 計・校長・副校長・教頭・主幹教諭・指導教諭・教諭・助教諭・養護教諭・養護助教諭・
      栄養教諭・講師の12の内訳と、市町村費負担の者(再掲)。再掲は計の内数なので、職名を足すときは外す。
      兼務者（非常勤など）は入らない。2025年の全国の本務教員数は小学校 424,894人、中学校 247,305人。
      出典: 文部科学省 学校基本調査（市町村別集計）。
      https://www.e-stat.go.jp/stat-search/files?toukei=00400001
    access: public
    columns:

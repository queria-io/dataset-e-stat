      - name: area_name
        description: "地域名（原典の表記）。政令指定都市の区は区名だけ（中央区 など）"
        data_tests:
          - not_null
      - name: area_level
        description: "prefecture=都道府県の計、municipality=市区町村、ward=政令指定都市の区、outside=原典の「東京都外」「大阪市外」の行"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - prefecture
                  - municipality
                  - ward
                  - outside
      - name: prefecture_code
        description: "都道府県コード（2桁）"
        data_tests:
          - not_null
      - name: city_code
        description: "市区町村コード（5桁）。政令指定都市の区は市のコード（札幌市中央区なら 01100）、ほかの市区町村は area と同じ。都道府県の計と outside の行は NULL"
      - name: position
        description: "職名。計と12の内訳、市町村費負担の者(再掲)。再掲は計の内数"
        data_tests:
          - not_null
      - name: sex_code
        description: "男女コード。0=計、1=男、2=女"
        data_tests:

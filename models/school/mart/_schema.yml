version: 2

models:
  - name: enrollment_by_grade
    description: |
      学校基本調査の小学校の学年別児童数と中学校の学年別生徒数を、都道府県別・設置者別・男女別に
      1セル1行で収録する。調査日は毎年5月1日。
      収録は2000年〜2025年の26年、119,808行（小学校 74,880行、中学校 44,928行）。
      学年 grade は小学校 1〜6、中学校 1〜3 で、0 が学年の計。男女計 sex_code = '0' の行は
      学年の計（grade = 0）にだけあり、学年別の行は男と女だけ。
      設置者 founder_code は 0=計、1=国立、2=公立、3=私立。計・全国・学年の計・男女計が
      内訳と同じ列に並ぶので、絞らずに足すと二重に数える。
      2025年の全国の児童数は 5,812,375人（2000年 7,366,079人）、生徒数は 3,105,297人（同 4,103,717人）。
      義務教育学校・中等教育学校の前期課程・特別支援学校の小学部と中学部の在学者は入らない。
      原典で「-」のセル（その都道府県にその設置者の学校が無いなど）は 0。
      2003年の小学校 公立 福岡県 男 の計は原典で 14656 と1桁欠けているので、男女・学年・都道府県・
      設置者の合計がそろう 146656 に直してある。
      出典: 文部科学省 学校基本調査。
      https://www.e-stat.go.jp/stat-search/files?toukei=00400001
    access: public
    columns:
      - name: year
        description: "調査年（西暦4桁）。2000〜2025。毎年5月1日現在"
      - name: school_type
        description: "学校種。elementary=小学校、junior_high=中学校"
      - name: school_type_name
        description: "school_type に対応する名称（小学校・中学校）"
      - name: founder_code
        description: "設置者コード。0=計、1=国立、2=公立、3=私立。計と内訳が同じ列にあるので、絞らずに集計すると二重に数える"
      - name: founder
        description: "founder_code に対応する名称"
      - name: area
        description: "地域コード（5桁）。00000=全国、XX000=都道府県"
      - name: area_name
        description: "地域名（全国、北海道、青森県 など）"
      - name: prefecture_code
        description: "都道府県コード（2桁）。全国は NULL"
      - name: grade
        description: "学年。小学校 1〜6、中学校 1〜3。0 は学年の計"
      - name: sex_code
        description: "男女コード。0=男女計、1=男、2=女。男女計は学年の計（grade = 0）の行にだけある"
      - name: sex
        description: "sex_code に対応する名称"
      - name: students
        description: "在学している児童数（小学校）・生徒数（中学校）（人）。原典で「-」のセルは 0"
  - name: municipality_schools
    description: |
      学校基本調査の小学校・中学校の学校数を、市区町村別・設置者別・本校分校別に1セル1行で収録する。
      調査日は毎年5月1日。収録は2021年〜2025年の5年、417,831行。
      地域は都道府県の計（area_level = 'prefecture'）と市区町村・政令指定都市の区。政令指定都市は
      区の行だけで市の行は無いので、市の値は city_code で区を足して出す。都道府県の計は、
      その都道府県の市区町村・区・outside の行を足した値に一致する。全国の行は無い。
      設置者は founder（計・国立・公立・私立）、公立の内訳は founder_detail（市(区)立・町立・村立・
      組合立、中学校は都道府県立も）、campus は 計・本校・分校。計の行が内訳と同じ列に並ぶので、
      絞らずに足すと二重に数える。小学校の表には都道府県立の列が無く、都立の小学校（立川市の1校）は
      公立の計にだけ入る。2025年の全国の学校数は小学校 18,607校、中学校 9,827校。
      義務教育学校・中等教育学校・特別支援学校は入らない。
      出典: 文部科学省 学校基本調査（市町村別集計）。
      https://www.e-stat.go.jp/stat-search/files?toukei=00400001
    access: public
    columns:
      - name: year
        description: "調査年（西暦4桁）。2021〜2025。毎年5月1日現在"
        data_tests:
          - not_null
      - name: school_type
        description: "学校種。elementary=小学校、junior_high=中学校"
        data_tests:
          - not_null
      - name: school_type_name
        description: "school_type に対応する名称（小学校・中学校）"
      - name: area
        description: "地域コード（5桁、統計に用いる標準地域コード）。XX000=都道府県の計。東京都外・大阪市外の行は NULL。浜松市の2023年までの旧区（22131〜22137）は現行の code.municipality に無い"
      - name: area_name
        description: "地域名（原典の表記）。政令指定都市の区は区名だけ（中央区 など）"
        data_tests:
          - not_null
      - name: area_level
        description: "prefecture=都道府県の計、municipality=市区町村、ward=政令指定都市の区、outside=原典の「東京都外」「大阪市外」の行"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - prefecture
                  - municipality
                  - ward
                  - outside
      - name: prefecture_code
        description: "都道府県コード（2桁）"
        data_tests:
          - not_null
      - name: city_code
        description: "市区町村コード（5桁）。政令指定都市の区は市のコード（札幌市中央区なら 01100）、ほかの市区町村は area と同じ。都道府県の計と outside の行は NULL"
      - name: founder
        description: "設置者。計・国立・公立・私立"
        data_tests:
          - not_null
      - name: founder_detail
        description: "公立の内訳。計・市(区)立・町立・村立・組合立（中学校は都道府県立も）。国立と私立の行は founder と同じ値"
        data_tests:
          - not_null
      - name: campus
        description: "本校・分校。計・本校・分校（国立と私立は本校だけ）"
        data_tests:
          - not_null
      - name: schools
        description: "学校数"
        data_tests:
          - not_null

spec_version: "0.1"
name: e_stat
title: e-Stat 統計データ
description: |-
  e-Stat API と統計GIS から取得した日本の公的統計データ。地域別の統計を横断で引くための土台で、
  スキーマごとに出どころと粒度が違う。
  census の area は boundary.small_area の key_code と同じ体系なので、小地域の統計を地図に
  載せるときはそこで結合する。
  code.municipality の5桁コードは全国地方公共団体コード（6桁）とは別体系なので、lg_code や
  address_br と結合するときは桁と体系を揃える。
  このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。

$schema: https://tabledoc.queria.io/schemas/dataset/v1.json
name: e_stat
title: e-Stat 統計データ
description: |-
  e-Stat の API と統計GIS から取得した日本の公的統計です。社会・人口統計体系、国勢調査、経済センサスなど約 30 の統計を、スキーマごとに収録しています。
  出典は政府統計の総合窓口（e-Stat）と各統計の作成府省です。このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。
image: cover.png

# 新しい統計表が出たら知らせる統計（scripts/check_new_tables.py）。
# 毎週、過去 7 日に公開された統計表を e-Stat の統計表情報で探し、あれば統計ごとに issue を立てる。
# 毎月・毎週の表が出る統計（家計調査・人口推計など）は数が多いので入れない。
# search_kinds: 1 = 統計データ、2 = 小地域・地域メッシュ（国勢調査の町丁・字別など）
